<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Inicio</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  .saludo { margin:0 0 2px; }
  .sub { color:var(--gris); font-size:.9rem; margin:0 0 16px; }
  .bloque { margin-bottom:18px; }
  .bloque h2 { font-size:.95rem; margin:0 0 8px; display:flex; align-items:center; gap:7px;
    color:var(--verde-osc); }
  .bloque h2 .material-icons { font-size:19px; }
  .bloque h2 a { margin-left:auto; font-size:.78rem; color:var(--gris);
    text-decoration:none; font-weight:400; }
  .nov { display:flex; align-items:center; gap:10px; background:#fff;
    border:1px solid var(--linea); border-radius:var(--radio); padding:11px 13px;
    margin:6px 0; box-shadow:var(--sombra); text-decoration:none; color:inherit; }
  .nov:hover { border-color:var(--verde); }
  .nov .ic { flex:none; width:34px; height:34px; border-radius:9px; display:flex;
    align-items:center; justify-content:center; }
  .nov .ic .material-icons { font-size:19px; }
  .nov .txt { flex:1; min-width:0; }
  .nov .txt b { display:block; font-size:.92rem; font-weight:600; }
  .nov .txt small { color:var(--gris); font-size:.78rem; }
  .nov .cuando { font-size:.72rem; color:var(--gris); white-space:nowrap; }
  .nuevo { background:var(--verde); color:#fff; font-size:.64rem; font-weight:700;
    padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .atraso { background:#fdeceb; color:var(--rojo); font-size:.7rem; font-weight:700;
    padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .urgente .ic { background:#fdeceb; color:var(--rojo); }
  .aviso  .ic { background:#eef4fb; color:#33506e; }
  .ok     .ic { background:var(--verde-claro); color:var(--verde-osc); }
  .neutro .ic { background:#f2f1ec; color:var(--gris); }
  .limpio { text-align:center; padding:30px 16px; color:var(--gris); }
  .limpio .material-icons { font-size:38px; color:var(--verde-claro); display:block;
    margin:0 auto 8px; }
  .cargando { text-align:center; color:var(--gris); padding:30px; }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <h1 class="saludo" id="saludo">Hola</h1>
  <p class="sub" id="sub">Cargando novedades…</p>
  <div id="cuerpo"></div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════
// INICIO — qué pasó desde la última vez que miraste.
//
// No repite lo que ya muestra cada página: junta lo que necesita
// tu atención, en el MISMO ORDEN del menú, y respetando permisos.
// Si está todo visto, muestra lo último de cada sección para que
// la página nunca quede vacía.
//
// "Visto" se guarda en usuarios/{uid}.ultimaVisitaInicio. La regla
// deja que cada uno escriba SOLO ese campo de su propio documento.
// Regla 3.2: nada de onSnapshot acá — es una foto al entrar.
// ═══════════════════════════════════════════════════════════
import {
  db, collection, query, where, or, getDocs, getDoc, doc, updateDoc, serverTimestamp
} from './firebase-init.js';
import { CV2 } from './nucleo.js';
import { Core } from './actividades-core.js';

CV2.registrarSW();
const u = await CV2.verificarAuth();
CV2.renderNav('inicio');

const $ = (id) => document.getElementById(id);
const esc = CV2.esc;
const hoy = CV2.hoyISO();

$('saludo').textContent = 'Hola, ' + (u.nombre || '').split(' ')[0];

// Marca de la última visita (para saber qué es nuevo).
const visitaPrevia = u.ultimaVisitaInicio && u.ultimaVisitaInicio.toMillis
  ? u.ultimaVisitaInicio.toMillis() : 0;

const ms = (t) => (t && t.toMillis) ? t.toMillis() : 0;
const esNuevo = (t) => ms(t) > visitaPrevia;

function haceCuanto(t) {
  const v = ms(t);
  if (!v) return '';
  const min = Math.round((Date.now() - v) / 60000);
  if (min < 60) return 'hace ' + Math.max(1, min) + ' min';
  if (min < 1440) return 'hace ' + Math.round(min / 60) + ' h';
  const d = Math.round(min / 1440);
  return d === 1 ? 'ayer' : 'hace ' + d + ' días';
}

// Días entre dos fechas ISO. Se calcula a mediodía para que el cambio
// de horario no coma ni agregue un día.
function diasEntre(desdeISO, hastaISO) {
  const a = new Date(desdeISO + 'T12:00:00');
  const b = new Date(hastaISO + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}

// Marcas de lectura del chat → mapa plano comId→ms. Soporta el formato
// viejo (claves comId al ras del documento) y el nuevo
// ({ lecturas:{comId:Timestamp}, eliminados:{...} }). El nuevo gana.
// Antes esto leía un campo 'vistos' que NUNCA existió: por eso todos los
// temas se veían siempre como no leídos y el cartel "nuevo" jamás se iba.
function leerVistos(data) {
  const out = {};
  if (!data) return out;
  Object.keys(data).forEach((k) => {
    if (k === 'lecturas' || k === 'eliminados') return;
    const v = data[k];
    if (v && v.toMillis) out[k] = v.toMillis();
  });
  const nuevos = data.lecturas || {};
  Object.keys(nuevos).forEach((k) => {
    const v = nuevos[k];
    out[k] = (v && v.toMillis) ? v.toMillis() : (typeof v === 'number' ? v : 0);
  });
  return out;
}

// ── Acumulador de novedades ──────────────────────────────────
// Cada bloque respeta el orden del menú (CV2.NAV) para que la
// portada y la navegación se lean igual.
const bloques = [];
const agregar = (id, titulo, icono, href, items) => {
  if (items && items.length) bloques.push({ id, titulo, icono, href, items });
};

const fila = (o) => `
  <a class="nov ${o.tono || 'neutro'}" href="${esc(o.href)}">
    <span class="ic"><span class="material-icons">${esc(o.icono)}</span></span>
    <span class="txt"><b>${esc(o.titulo)}</b>
      ${o.detalle ? `<small>${esc(o.detalle)}</small>` : ''}</span>
    ${o.atraso ? `<span class="atraso">${esc(o.atraso)}</span>` : ''}
    ${o.nuevo ? '<span class="nuevo">NUEVO</span>' : ''}
    ${o.cuando ? `<span class="cuando">${esc(o.cuando)}</span>` : ''}
  </a>`;

// Ninguna lista se estira sin fin: se corta y se avisa cuántas quedaron.
function recortar(items, tope, href) {
  if (items.length <= tope) return items;
  return items.slice(0, tope).concat([{
    icono: 'more_horiz', titulo: 'y ' + (items.length - tope) + ' más',
    detalle: 'Abrir la lista completa', tono: 'neutro', href: href
  }]);
}

// ── 1 · Actividades ──────────────────────────────────────────
// Cuántos días de atraso convierten una recurrente en un problema.
// Es el único número a tocar si mañana querés que avise antes o después.
const DIAS_ALERTA = 7;

let acts = [];
try {
  const snap = await getDocs(Core.consultaActividades(u, CV2.esAdmin()));
  // LO ELIMINADO NO ENTRA. Eliminar marca 'eliminado' en UN documento y su
  // rama entera se va con él: el mismo corte que en Actividades y en la
  // Agenda. Sin esto, algo mandado a la papelera seguiría reclamando atención
  // desde la portada, que es justo donde más molesta.
  const crudo = {};
  snap.forEach((d) => { crudo[d.id] = { id: d.id, ...d.data() }; });
  const enterrado = (it) => {
    let cur = it, g = 0;
    while (cur && g++ < 25) {
      if (cur.eliminado) return true;
      cur = cur.parentId ? crudo[cur.parentId] : null;
    }
    return false;
  };
  acts = Object.values(crudo).filter((it) => !enterrado(it));
} catch (e) { console.warn('actividades', e); }

// Las recurrentes NO usan fechaVencimiento: al cerrar el ciclo, el core
// escribe fechaInicio = día de la realización + recurrenciaDias. O sea que
// fechaInicio ES el día en que vuelve a tocar, y el atraso se cuenta desde
// ahí. Hasta ahora el Inicio solo miraba fechaVencimiento, así que las
// recurrentes —que son la rutina de la casa— no aparecían nunca.
const atrasadas = [];   // se pasaron de rosca: van en bloque aparte, arriba
const tocanAhora = [];  // toca hacerlas, todavía dentro de lo tolerable
acts.forEach((a) => {
  const ciclo = Number(a.recurrenciaDias) || 0;
  if (a.hecho || ciclo <= 0) return;
  if (!a.fechaInicio || a.fechaInicio > hoy) return;   // todavía no vuelve
  const atraso = diasEntre(a.fechaInicio, hoy);
  // Grave por dos caminos: más de una semana tarde (el pedido), o más de un
  // ciclo entero tarde — porque en una tarea de cada dos días, siete días de
  // atraso ya son tres ciclos perdidos y hay que enterarse antes.
  const grave = atraso > DIAS_ALERTA || atraso > ciclo;
  (grave ? atrasadas : tocanAhora).push({ a: a, atraso: atraso, ciclo: ciclo });
});
atrasadas.sort((x, y) => y.atraso - x.atraso);
tocanAhora.sort((x, y) => y.atraso - x.atraso);

// ── 1a · LIMPIEZAS — arriba de todo ──────────────────────────
// Van primero y aparte, y no es una preferencia estética: una limpieza tiene
// la fecha de entrada de un huésped y no se puede correr.
//
// POR QUÉ NO APARECÍAN ANTES: su 'fechaVencimiento' es el día del check-in,
// así que el bloque de "vencidas" recién las mostraba ESE MISMO DÍA. Nacen
// siete días antes y quedaban invisibles justo en el tiempo en que se pueden
// organizar. Ahora se muestran desde que existen, con los días que faltan.
//
// Y se descartan las LATENTES: desde que la limpieza se crea al confirmar la
// reserva, "desde que existen" puede ser con meses de anticipación, y esta
// lista no tiene tope de filas. Core.limpiezaLatente deja pasar solo las que
// entran en el horizonte — las mismas que se veían antes de aquel cambio.
const aActividad = (a) => './actividades.html?a=' + encodeURIComponent(a.id);

const limpiezas = acts
  .filter((a) => !a.hecho && a.reservaId && (a.fase === 'entrada' || a.fase === 'salida')
    && !Core.limpiezaLatente(a))
  .sort((x, y) => String(x.fechaVencimiento ?? x.fechaInicio ?? '')
    .localeCompare(String(y.fechaVencimiento ?? y.fechaInicio ?? '')));

// Los faltantes de un check-out son otra cosa: no es limpiar, es reponer.
const faltantes = acts.filter((a) => !a.hecho && a.faltantesData);

agregar('actividades', 'Limpiezas y controles', 'cleaning_services', './actividades.html',
  limpiezas.map((a) => {
    const cuando = a.fechaVencimiento || a.fechaInicio || '';
    const faltan = cuando ? diasEntre(hoy, cuando) : null;
    return {
      icono: a.fase === 'salida' ? 'logout' : 'cleaning_services',
      titulo: a.titulo || '(sin título)',
      detalle: a.fase === 'salida'
        ? 'Control de salida — inventario y faltantes'
        : (faltan === null ? 'Sin fecha'
          : faltan > 1 ? 'Entra el ' + CV2.fmtFecha(cuando) + ' · faltan ' + faltan + ' días'
          : faltan === 1 ? 'Entra MAÑANA · ' + CV2.fmtFecha(cuando)
          : faltan === 0 ? 'ENTRA HOY' : 'Entró el ' + CV2.fmtFecha(cuando)),
      // Urgente desde el día anterior. Antes, con dos o tres días por delante,
      // todavía se puede repartir el trabajo con calma.
      tono: (faltan !== null && faltan <= 1) ? 'urgente' : 'aviso',
      href: aActividad(a),
      atraso: (faltan !== null && faltan < 0) ? '+' + (-faltan) + ' d' : '',
      nuevo: esNuevo(a.creadoEn), cuando: haceCuanto(a.creadoEn)
    };
  }));

agregar('actividades', 'Faltantes por reponer', 'shopping_cart', './actividades.html',
  faltantes.map((a) => ({
    icono: 'shopping_cart', titulo: a.titulo || '(sin título)',
    detalle: a.gastoMovimientoId ? 'Gasto ya registrado en Dinero' : 'Falta registrar el gasto',
    tono: a.gastoMovimientoId ? 'neutro' : 'aviso', href: aActividad(a)
  })));

agregar('actividades', 'Atrasadas hace rato', 'history', './actividades.html',
  recortar(atrasadas.map((x) => ({
    icono: 'history',
    titulo: x.a.titulo || '(sin título)',
    detalle: 'Tocaba el ' + CV2.fmtFecha(x.a.fechaInicio) + ' · cada ' + x.ciclo + ' días · ' +
      (x.a.ultimaRealizacion
        ? 'última vez ' + CV2.fmtFecha(x.a.ultimaRealizacion) +
          (x.a.ultimaRealizacionNombre ? ' (' + x.a.ultimaRealizacionNombre + ')' : '')
        : 'nunca se hizo'),
    tono: 'urgente', href: aActividad(x.a),
    atraso: '+' + x.atraso + ' d'
  })), 6, './actividades.html'));

// Únicas vencidas o que vencen hoy. Se excluyen las recurrentes: ya se
// contaron arriba por su ciclo, y contarlas dos veces confunde.
// Se excluyen las limpiezas y los faltantes: ya tienen su propio bloque
// arriba, y repetirlas acá sería contar dos veces la misma tarea.
const vencidas = acts.filter((a) =>
  !a.hecho && !(Number(a.recurrenciaDias) > 0) &&
  !a.reservaId && !a.faltantesData &&
  a.fechaVencimiento && a.fechaVencimiento <= hoy);

const hoyItems = vencidas.map((a) => ({
  icono: a.reservaId ? 'cleaning_services' : 'priority_high',
  titulo: a.titulo || '(sin título)',
  detalle: a.fechaVencimiento < hoy ? 'Vencida el ' + CV2.fmtFecha(a.fechaVencimiento) : 'Vence hoy',
  tono: 'urgente', href: aActividad(a),
  nuevo: esNuevo(a.creadoEn), cuando: ''
})).concat(tocanAhora.map((x) => ({
  icono: 'autorenew',
  titulo: x.a.titulo || '(sin título)',
  detalle: (x.atraso === 0 ? 'Toca hacerla hoy' : 'Atrasada ' + x.atraso + ' día(s)') +
    ' · cada ' + x.ciclo + ' días',
  tono: x.atraso === 0 ? 'aviso' : 'urgente', href: aActividad(x.a)
})));

agregar('actividades', 'Necesitan atención hoy', 'checklist', './actividades.html',
  recortar(hoyItems, 8, './actividades.html'));

// ── 1b · Tus destacadas ──────────────────────────────────────
// Lo que cada uno marcó con estrella. Es la única lista del Inicio que arma
// la persona a mano: el resto lo decide el sistema por fechas y estados.
// Va DESPUÉS de lo urgente a propósito — destacar algo no lo vuelve urgente,
// y si empujara a las limpiezas hacia abajo dejaría de servir.
// Las que ya salen en otro bloque no se repiten.
try {
  const eu = await getDoc(doc(db, 'estado_usuario', u.uid));
  const estrellas = new Set(eu.exists() ? (eu.data().destacados ?? []) : []);
  const yaMostradas = new Set(
    limpiezas.map((a) => a.id)
      .concat(faltantes.map((a) => a.id))
      .concat(atrasadas.map((x) => x.a.id))
      .concat(vencidas.map((a) => a.id))
      .concat(tocanAhora.map((x) => x.a.id)));

  const mias = acts.filter((a) => estrellas.has(a.id) && !a.hecho && !yaMostradas.has(a.id));
  agregar('actividades', 'Tus destacadas', 'star', './actividades.html',
    recortar(mias.map((a) => ({
      icono: 'star',
      titulo: a.titulo || '(sin título)',
      detalle: (Number(a.recurrenciaDias) > 0
        ? 'Cada ' + a.recurrenciaDias + ' días'
        : (a.fechaVencimiento ? 'Vence el ' + CV2.fmtFecha(a.fechaVencimiento) : 'Sin fecha')),
      tono: 'neutro', href: aActividad(a)
    })), 6, './actividades.html'));
} catch (e) { console.warn('destacadas', e); }

// ── 2 · Reservas (solo con permiso) ──────────────────────────
if (CV2.puede('reservas')) {
  try {
    const rs = [];
    const snap = await getDocs(collection(db, 'reservas'));
    snap.forEach((d) => rs.push({ id: d.id, ...d.data() }));
    const items = [];

    // UNA LÍNEA POR ACUERDO, no por cabaña. Un huésped que toma las tres
    // cabañas es UNA llegada, no tres: sin esto el Inicio decía "Llega hoy:
    // Alejandro" tres veces seguidas y la novedad de verdad quedaba enterrada
    // entre repeticiones. Es el mismo error que mostraba tres saldos donde
    // hay uno solo (§10 · F2).
    // Se agrupa por 'grupoId'; una reserva suelta es un acuerdo de una.
    function porAcuerdo(lista) {
      const mapa = new Map();
      lista.forEach((r) => {
        const k = r.grupoId || r.id;
        if (!mapa.has(k)) mapa.set(k, []);
        mapa.get(k).push(r);
      });
      return [...mapa.values()];
    }
    // Cuántas cabañas, para decirlo en vez de repetir la línea.
    const cuantas = (g) => g.length > 1 ? ' · ' + g.length + ' cabañas' : '';
    // El enlace lleva DIRECTO a esa reserva y la abre allá (?r=), igual que
    // desde el calendario. Antes caía en la lista y había que buscarla.
    const aReserva = (r) => './reservas.html?r=' + encodeURIComponent(r.id);

    porAcuerdo(rs.filter((r) => r.estado === 'presupuesto'))
      .slice(0, 4)
      .forEach((g) => items.push({
        icono: 'pending_actions', titulo: g[0].clienteNombre || 'Presupuesto',
        detalle: 'Sin confirmar · ' + CV2.fmtFecha(g[0].checkIn) + cuantas(g),
        tono: 'aviso', href: aReserva(g[0]),
        nuevo: esNuevo(g[0].creadoEn), cuando: haceCuanto(g[0].creadoEn)
      }));
    porAcuerdo(rs.filter((r) => r.estado === 'confirmada' && r.checkIn === hoy))
      .forEach((g) => items.push({
        icono: 'login', titulo: 'Llega hoy: ' + (g[0].clienteNombre || ''),
        detalle: 'Check-in ' + CV2.fmtFecha(g[0].checkIn) + cuantas(g),
        tono: 'ok', href: aReserva(g[0])
      }));
    porAcuerdo(rs.filter((r) => r.estado === 'confirmada' && r.checkOut === hoy))
      .forEach((g) => items.push({
        icono: 'logout', titulo: 'Se va hoy: ' + (g[0].clienteNombre || ''),
        detalle: 'Check-out ' + CV2.fmtFecha(g[0].checkOut) + cuantas(g),
        tono: 'aviso', href: aReserva(g[0])
      }));
    agregar('reservas', 'Reservas', 'king_bed', './reservas.html', items);
  } catch (e) { console.warn('reservas', e); }
}

// ── 3 · Chat: lo que no leíste ───────────────────────────────
try {
  const convs = [];
  // Colaborador: SOLO temas de equipo o donde participa. La regla nueva
  // rechaza el listado sin filtrar (incluiría temas dirigidos ajenos).
  // Admin: los ve todos.
  const snap = CV2.esAdmin()
    ? await getDocs(collection(db, 'comunicaciones'))
    : await getDocs(query(collection(db, 'comunicaciones'),
        or(where('audiencia', '==', 'equipo'),
           where('participantes', 'array-contains', u.uid))));
  snap.forEach((d) => convs.push({ id: d.id, ...d.data() }));
  let vistos = {};
  try {
    const lec = await getDoc(doc(db, 'comunicaciones_lecturas', u.uid));
    if (lec.exists()) vistos = leerVistos(lec.data());
  } catch { /* primera vez */ }
  // Sin leer = actividad más nueva que mi última lectura, cuyo último
  // mensaje no lo escribí yo, y que no borré de mi lista (ocultoPara).
  const sinLeer = convs.filter((c) =>
    ms(c.ultimaActividad) > (vistos[c.id] || 0) && c.ultimoAutorUid !== u.uid
    && (c.ocultoPara || []).indexOf(u.uid) === -1);
  // El puntito rojo sobre la pestaña Chat. El Inicio es el único lugar que
  // tiene la cuenta hecha, así que es el que lo enciende. Estaba escrito el
  // encendedor (CV2.marcarNovedad) y el estilo (.cv-tab.con-novedad), pero
  // nadie lo llamaba: el manual prometía un punto que no existía.
  CV2.marcarNovedad('comunicacion', sinLeer.length > 0);
  agregar('comunicacion', 'Mensajes sin leer', 'forum', './comunicacion.html',
    sinLeer.slice(0, 6).map((c) => ({
      icono: 'chat_bubble', titulo: c.titulo || 'Conversación',
      detalle: c.ultimoMensaje || '', tono: 'aviso', href: './comunicacion.html',
      nuevo: true, cuando: haceCuanto(c.ultimaActividad)
    })));
} catch (e) { console.warn('comunicaciones', e); }

// ── 4 · Tu cronómetro andando ────────────────────────────────
try {
  const s = await Core.sesionActiva(u.uid);
  if (s) {
    agregar('sesiones', 'Tenés trabajo en curso', 'schedule', './gestion-sesiones.html', [{
      icono: 'timer', titulo: s.actividadTitulo || 'Cronómetro andando',
      detalle: 'Arrancó ' + haceCuanto(s.inicio) + ' — acordate de pararlo',
      // Va DIRECTO a la actividad que se está cronometrando: es el único
      // lugar donde se puede frenar. Este enlace era el último que caía en
      // la lista, y justo el más urgente de todos.
      tono: 'urgente',
      href: s.actividadId ? './actividades.html?a=' + encodeURIComponent(s.actividadId)
                          : './actividades.html'
    }]);
  }
} catch (e) { console.warn('sesion activa', e); }

// ── 5 · Tus cobros ───────────────────────────────────────────
try {
  const q = CV2.puede('finanzas')
    ? query(collection(db, 'honorarios'), where('estado', '==', 'pendiente'))
    : query(collection(db, 'honorarios'), where('uid', '==', u.uid));
  const snap = await getDocs(q);
  const hs = [];
  snap.forEach((d) => { const x = d.data(); if (x.estado !== 'pagado') hs.push({ id: d.id, ...x }); });
  const mios = hs.filter((h) => h.uid === u.uid);
  const total = mios.reduce((a, h) => a + (Number(h.monto) || 0), 0);
  const items = [];
  if (mios.length) items.push({
    icono: 'payments', titulo: 'Te deben ' + CV2.fmtMonto(total),
    detalle: mios.length + ' cobro(s) pendiente(s)', tono: 'ok', href: './honorarios.html'
  });
  const ajenos = hs.filter((h) => h.uid !== u.uid);
  if (CV2.puede('finanzas') && ajenos.length) items.push({
    icono: 'group', titulo: 'Cobros del equipo por pagar',
    detalle: ajenos.length + ' pendiente(s) · ' +
      CV2.fmtMonto(ajenos.reduce((a, h) => a + (Number(h.monto) || 0), 0)),
    tono: 'aviso', href: './honorarios.html'
  });
  agregar('honorarios', 'Cobros', 'payments', './honorarios.html', items);
} catch (e) { console.warn('honorarios', e); }

// ── 6 · Dinero: lo que quedó colgando ────────────────────────
if (CV2.puede('finanzas')) {
  try {
    const snap = await getDocs(collection(db, 'movimientos'));
    const pend = {};
    snap.forEach((d) => {
      const m = d.data();
      if (m.cierreId) return;                                  // sellado por un balance
      if (!m.pendiente || m.pendiente.saldado) return;
      if (m.pendiente.cierreId) return;                        // cerrado por el modelo viejo
      // LA MONEDA VA EN LA CLAVE. Sin ella se sumaban reales con dólares y
      // el total se mostraba entero en R$: un número que miente y no avisa.
      // Es la misma cuenta que hace pendientesVivos() en dinero.html, y acá
      // se había vuelto a escribir mal (CONVENCIONES §8).
      const mon = m.moneda || 'BRL';
      const k = (m.nombre || '') + '|' + m.pendiente.clase + '|' + mon;
      pend[k] = (pend[k] || 0) + (Number(m.monto) || 0);
    });
    const items = Object.keys(pend).sort().map((k) => {
      const [nombre, clase, mon] = k.split('|');
      return {
        icono: clase === 'reponer' ? 'currency_exchange' : 'schedule',
        titulo: clase === 'reponer' ? 'Reponerle a ' + nombre : 'Por cobrar (' + nombre + ')',
        detalle: CV2.fmtMonto(pend[k], mon), tono: 'aviso', href: './dinero.html'
      };
    });
    agregar('dinero', 'Dinero pendiente', 'savings', './dinero.html', items);
  } catch (e) { console.warn('movimientos', e); }

  // ── 6b · Trámites del impuesto de Airbnb ───────────────────
  // Van al Inicio y no solo a su pantalla porque el plazo real no es a fin
  // de mes: para un no residente el DARF vence el día en que la plataforma
  // paga. Un trámite que falta el día del primer cobro ya llega tarde, y la
  // mora corre sola (1% mensual más SELIC). Desaparece al tildarlos todos.
  try {
    const items = [];

    // Los DARF impagos van PRIMERO y en rojo: la mora corre sola (1% mensual
    // más SELIC) desde el día del cobro, así que un vencido no es un
    // recordatorio, es plata que se está perdiendo.
    const sl = await getDocs(collection(db, 'liquidaciones'));
    const impagos = [];
    sl.forEach((d) => { const l = d.data(); if (!l.darf?.pagado) impagos.push(l); });
    for (const l of impagos.sort((a, b) => (a.fecha ?? '').localeCompare(b.fecha ?? ''))) {
      const vencido = (l.fecha ?? '') < hoy;
      items.push({
        icono: 'receipt_long',
        titulo: (vencido ? 'DARF vencido' : 'DARF por pagar')
          + ' · ' + CV2.fmtMonto(Number(l.neto) || Number(l.bruto) || 0, l.moneda || 'BRL'),
        detalle: 'Cobro de Airbnb del ' + CV2.fmtFecha(l.fecha),
        tono: vencido ? 'urgente' : 'aviso', href: './fiscal.html'
      });
    }

    const s = await getDoc(doc(db, 'config', 'fiscal'));
    const pasos = s.exists() ? (s.data().pasos ?? {}) : {};
    const todos = CV2.PASOS_FISCALES;
    const faltan = todos.filter((p) => !pasos[p.k]?.hecho);
    if (faltan.length) {
      items.push({
        icono: 'gavel',
        titulo: faltan.length + ' de ' + todos.length + ' trámites sin resolver',
        detalle: 'Hay que tenerlos listos antes de la primera declaración de lo que entra por Airbnb',
        tono: 'aviso', href: './fiscal.html'
      });
    }
    agregar('fiscal', 'Impuestos', 'account_balance', './fiscal.html', recortar(items, 6, './fiscal.html'));
  } catch (e) { console.warn('fiscal', e); }
}

// ── 7 · Recuerdos esperando moderación ───────────────────────
// Un recuerdo pendiente NO se ve en el sitio hasta que alguien lo aprueba.
// Sin este bloque, la única forma de enterarse era entrar a Recuerdos a
// mirar — y algo que hay que ir a buscar, tarde o temprano no se busca.
if (CV2.puede('contenido')) {
  try {
    // Un solo where de igualdad: sin orderBy no hace falta índice compuesto.
    const snap = await getDocs(query(collection(db, 'recuerdos'),
      where('estado', '==', 'pendiente')));
    const pend = [];
    snap.forEach((d) => pend.push({ id: d.id, ...d.data() }));
    pend.sort((a, b) => ms(b.creadoEn) - ms(a.creadoEn));
    agregar('recuerdos', 'Recuerdos por revisar', 'auto_stories', './recuerdos.html',
      recortar(pend.map((r) => ({
        icono: 'rate_review',
        titulo: (r.nombre || 'Un huésped') + ' dejó un recuerdo',
        detalle: (r.texto || '').slice(0, 90),
        tono: 'aviso', href: './recuerdos.html',
        nuevo: esNuevo(r.creadoEn), cuando: haceCuanto(r.creadoEn)
      })), 5, './recuerdos.html'));
  } catch (e) { console.warn('recuerdos', e); }
}

// ── Render ───────────────────────────────────────────────────
// El orden lo manda CV2.NAV: la portada se lee igual que el menú.
// Dentro de una misma sección mandan las atrasadas: el sort de JS es
// estable, así que conservan el orden en que se agregaron.
const orden = CV2.NAV.map((n) => n.id);
bloques.sort((a, b) => orden.indexOf(a.id) - orden.indexOf(b.id));

const totalItems = bloques.reduce((a, b) => a + b.items.length, 0);
const nuevos = bloques.reduce((a, b) => a + b.items.filter((i) => i.nuevo).length, 0);

$('sub').textContent = totalItems
  ? (nuevos ? nuevos + ' novedad(es) desde la última vez · ' : '') + totalItems + ' cosa(s) para mirar'
  : 'No hay nada pendiente.';

$('cuerpo').innerHTML = bloques.length
  ? bloques.map((b) => `
    <div class="bloque">
      <h2><span class="material-icons">${esc(b.icono)}</span>${esc(b.titulo)}
        <a href="${esc(b.href)}">ver todo →</a></h2>
      ${b.items.map(fila).join('')}
    </div>`).join('')
  : `<div class="limpio">
      <span class="material-icons">task_alt</span>
      <b>Todo al día.</b><br>
      <span style="font-size:.88rem;">No hay nada urgente ni mensajes sin leer.</span>
    </div>`;

// Se marca la visita DESPUÉS de pintar: lo que se acaba de mostrar como
// "nuevo" ya se vio, y la próxima vez solo aparecerá lo que llegue después.
try {
  await updateDoc(doc(db, 'usuarios', u.uid), { ultimaVisitaInicio: serverTimestamp() });
} catch (e) {
  // Si la regla todavía no está publicada, la página funciona igual:
  // simplemente todo se sigue viendo como nuevo.
  console.warn('marca de visita:', e);
}
</script>
</body>
</html>
