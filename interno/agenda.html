<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  /* La barra de semana viaja con la cabecera: cambiar de semana es el gesto
     más repetido y no puede obligar a subir hasta arriba. */
  /* La barra de pestañas de abajo tapa 46px que 'cv-conbarra' no contempla:
     sin esto, el domingo queda escondido detrás y no hay forma de soltar
     nada ahí. */
  .contenedor { padding-bottom: 54px; }

  .semana { position: sticky; top: var(--cv-techo); z-index: 80;
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    background: var(--crema); }
  .semana .rango { flex: 1; text-align: center; font-size: .9rem; font-weight: 600; }
  .semana button { min-width: 44px; min-height: 44px; border: 1px solid var(--linea);
    background: #fff; border-radius: 10px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; font-family: inherit; }

  /* ── Los días ── */
  .dia { margin-bottom: 12px; }
  .dia > h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px;
    font-size: .85rem; text-transform: capitalize; }
  .dia > h2 .num { font-size: 1.05rem; font-weight: 700; }
  .dia > h2 .cuenta { margin-left: auto; font-size: .73rem; color: var(--gris);
    font-weight: 400; text-transform: none; }
  .dia.es-hoy > h2 { color: var(--verde-osc); }
  .dia.es-hoy > h2 .num { background: var(--verde); color: #fff; border-radius: 9px;
    padding: 1px 8px; }
  .dia.finde > h2 { color: var(--gris); }

  /* ── Franjas: mañana y tarde ── */
  .franja { border-left: 3px solid var(--linea); padding: 3px 0 3px 9px;
    margin-bottom: 4px; min-height: 46px; border-radius: 0 8px 8px 0;
    transition: background .12s, border-color .12s; }
  .dia.es-hoy .franja { border-left-color: var(--verde); }
  .franja > .rot { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--gris); margin-bottom: 3px; }
  .franja.encima { background: var(--verde-claro); border-left-color: var(--verde); }
  .franja .nada { color: var(--linea); font-size: .74rem; padding: 5px 0; }

  /* ── La pastilla ── */
  .pas { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio);
    margin-bottom: 5px; box-shadow: var(--sombra); overflow: hidden; }
  .pas.arrastrando { opacity: .35; }
  .pas-fila { display: flex; align-items: center; gap: 8px; padding: 7px 6px 7px 4px;
    min-height: 52px; }
  .pas-agarre { flex: 0 0 auto; width: 34px; height: 44px; display: flex;
    align-items: center; justify-content: center; color: var(--gris);
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pas-agarre:active { cursor: grabbing; }
  /* Objetivo táctil de 44px alrededor de una casilla de 22: la casilla sola
     es la mitad del mínimo (§6.0). */
  .pas-check { flex: 0 0 auto; width: 44px; height: 44px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; }
  .pas-check input { width: 22px; height: 22px; margin: 0; cursor: pointer; }
  .pas-check input:disabled { opacity: .45; cursor: default; }
  .pas-hora { flex: 0 0 42px; text-align: right; font-size: .8rem; font-weight: 700;
    line-height: 1.2; }
  .pas-hora.sin { color: var(--gris); font-weight: 400; font-size: .7rem; }
  .pas-sem { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .pas-txt { flex: 1; min-width: 0; text-decoration: none; color: var(--tinta); }
  .pas-txt b { display: block; font-size: .88rem; font-weight: 600; overflow-wrap: anywhere; }
  .pas-txt small { display: block; color: var(--gris); font-size: .74rem;
    line-height: 1.4; overflow-wrap: anywhere; }
  .pas-mas { flex: 0 0 auto; width: 40px; height: 44px; border: 0; background: none;
    color: var(--gris); border-radius: 9px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-family: inherit; }
  .pas-mas:active { background: rgba(34,48,31,.08); }
  .chip { font-size: .65rem; padding: 1px 6px; border-radius: 999px;
    background: var(--crema); color: var(--gris); white-space: nowrap; }
  .chip.mio { background: var(--verde-claro); color: var(--verde-osc); }

  /* La nota personal, PEGADA a su pastilla: es de esa actividad y de nadie
     más. Sin margen entre las dos, y con el mismo borde. */
  .pas-nota { border-top: 1px dashed var(--linea); padding: 6px 10px 7px;
    font-size: .78rem; color: var(--verde-osc); background: #fbfcfa;
    display: flex; gap: 6px; align-items: flex-start; }
  .pas-nota .material-icons { font-size: 15px; margin-top: 1px; flex: none; }

  /* El editor de la pastilla, también pegado. */
  .pas-ed { border-top: 1px solid var(--linea); padding: 10px; background: var(--crema); }
  .pas-ed .l { display: flex; gap: 7px; margin-bottom: 7px; }
  .pas-ed label { font-size: .72rem; font-weight: 600; color: var(--gris);
    display: block; margin-bottom: 2px; }
  .pas-ed input, .pas-ed select { width: 100%; box-sizing: border-box; font-size: 16px;
    padding: 8px; border: 1px solid var(--linea); border-radius: 8px; background: #fff;
    font-family: inherit; }
  .pas-ed .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  .pas-ed .acciones button { min-height: 40px; padding: 8px 12px; border-radius: 9px;
    border: 1px solid var(--linea); background: #fff; font-size: .82rem; cursor: pointer;
    font-family: inherit; }
  .pas-ed .acciones .ok { background: var(--verde); border-color: var(--verde); color: #fff; }
  .pas-ed .ayuda { font-size: .72rem; color: var(--gris); margin: 0 0 8px; line-height: 1.5; }

  /* ── Las tres pestañas, fijas arriba de la barra ── */
  .tabs { background: #fff; border-top: 1px solid var(--linea);
    box-shadow: 0 -2px 12px rgba(34,48,31,.07); }
  .tabs-in { display: flex; max-width: 560px; margin: 0 auto; }
  .tab { flex: 1; min-height: 46px; border: 0; background: none; cursor: pointer;
    font-family: inherit; font-size: .78rem; color: var(--gris);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; border-top: 3px solid transparent; padding: 2px; }
  .tab.activo { color: var(--verde-osc); border-top-color: var(--verde); font-weight: 700; }
  .tab small { font-size: .62rem; }
  /* Las pestañas son las dos vistas Y los dos destinos: se arrastra de una a
     la otra para sumar o sacar. Mientras se arrastra cambian de aspecto para
     decir qué hace soltar en cada una. */
  body.arrastrando .tab { border-top-color: var(--linea); color: var(--tinta); }
  body.arrastrando .tab.encima { background: var(--verde-claro); border-top-color: var(--verde); }
  body.arrastrando .tab.encima.saca { background: #fdeceb; border-top-color: var(--rojo); }
  /* Mientras se arrastra, la pestaña de destino se lee de un vistazo. */
  body.arrastrando .tab small { visibility: hidden; }

  /* El fantasma que sigue al dedo. */
  .fantasma { position: fixed; z-index: 200; pointer-events: none; opacity: .95;
    box-shadow: 0 8px 24px rgba(0,0,0,.28); border-radius: var(--radio);
    background: #fff; border: 1px solid var(--verde); overflow: hidden; }

  /* El árbol de origen: todo desplegado, para agarrar y llevar. Usa la
     sangría del sistema de diseño (.cv-nodo-hijos) para que se lea igual que
     Actividades — es el mismo árbol, visto desde otro lado. */
  /* El árbol de origen. Hasta ahora venía TODO desplegado, siempre: con un
     proyecto de treinta actividades eso son treinta filas para llegar al
     siguiente proyecto, y armar la semana era desplazarse. Ahora las ramas se
     pliegan y lo plegado se recuerda mientras dure la visita, incluso si se
     sale a crear una actividad y se vuelve. Abierto sigue siendo lo normal:
     solo se guarda lo que la persona cerró a propósito. */
  .arb-proy { display: flex; align-items: center; gap: 4px; margin: 12px 0 4px; }
  .arb-proy .nom { flex: 1; min-width: 0; font-size: .8rem; font-weight: 700;
    color: var(--verde-osc); text-transform: uppercase; letter-spacing: .03em;
    overflow-wrap: anywhere; }
  .arb-vacio { color: var(--gris); font-size: .8rem; padding: 6px 0 10px; }
  .pas.ya { border-color: var(--verde); background: var(--verde-claro); }

  /* El triángulo y el + comparten forma y tamaño en las dos alturas del árbol
     —encabezado de proyecto y fila— para que la columna se lea derecha. */
  .arb-btn { flex: 0 0 auto; width: 38px; height: 44px; border: 0; background: none;
    color: var(--gris); border-radius: 9px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-family: inherit; }
  .arb-btn:active { background: rgba(34,48,31,.08); }
  .arb-btn.vacio-hueco { pointer-events: none; opacity: 0; }
  .arb-btn .material-icons { font-size: 21px; }
  .arb-cuenta { font-size: .68rem; color: var(--gris); background: var(--crema);
    border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .arb-acc { display: flex; gap: 6px; align-items: center; margin: 4px 0 10px; }
  .arb-acc button { min-height: 38px; padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--linea); background: #fff; font-size: .78rem;
    cursor: pointer; font-family: inherit; color: var(--tinta);
    display: inline-flex; align-items: center; gap: 5px; }
  .arb-acc .material-icons { font-size: 17px; }

  /* La recién creada: un destello que dice "es esta", igual que en
     Actividades. Se apaga solo — un resaltado permanente se vuelve ruido. */
  @keyframes cv-llegada {
    0%   { box-shadow: 0 0 0 0 rgba(45, 90, 39, .55); }
    100% { box-shadow: 0 0 0 14px rgba(45, 90, 39, 0); }
  }
  .pas.recien { animation: cv-llegada 1.3s ease-out 2; border-color: var(--verde); }

  .vencidas { background: #fdeceb; border: 1px solid #f0b8b4; border-radius: var(--radio);
    padding: 10px 12px; margin-bottom: 14px; }
  .vencidas h2 { margin: 0 0 6px; font-size: .82rem; color: #8e2b2b;
    text-transform: uppercase; letter-spacing: .04em; }
  .aviso { background: var(--crema); border-radius: 10px; padding: 11px 13px;
    font-size: .83rem; line-height: 1.55; margin: 0 0 12px; color: var(--gris); }
  .cargando { text-align: center; color: var(--gris); padding: 30px; }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <h1 style="margin-bottom:2px;">Agenda</h1>

  <div class="semana">
    <button id="ant" title="Semana anterior"><span class="material-icons">chevron_left</span></button>
    <span class="rango" id="rango">—</span>
    <button id="sig" title="Semana siguiente"><span class="material-icons">chevron_right</span></button>
    <button id="ahora" title="Esta semana"><span class="material-icons">today</span></button>
  </div>

  <div id="cuerpo"><div class="cargando">Cargando…</div></div>
</div>

<!-- Fijas justo arriba de la barra de navegación (.cv-pegado-abajo del
     sistema de diseño). Son las DOS VISTAS y los DOS DESTINOS: se arrastra de
     Actividades a Mi semana para sumar, y al revés para sacar. -->
<div class="cv-pegado-abajo tabs" id="tabs">
  <div class="tabs-in">
    <button class="tab activo" data-tab="semana">Mi semana<small id="hAgenda">—</small></button>
    <button class="tab" data-tab="arbol">Actividades<small>soltá acá para sacar</small></button>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════
// AGENDA — la semana de CADA UNO, armada a mano.
//
// Actividades es el árbol del trabajo: qué existe y de qué cuelga. La Agenda
// es otra cosa: CUÁNDO lo va a hacer esta persona. Son dos preguntas
// distintas sobre los mismos datos, y por eso la agenda guarda sus propias
// respuestas SIN tocar la actividad.
//
// LO QUE SE GUARDA POR PERSONA, en estado_usuario/{uid}.agenda:
//   { <actId>: { dia, franja, hora, nota } }
// Que la clave exista significa "está en mi agenda". Los cuatro campos son
// opcionales y son SOLO MÍOS: mover una actividad al martes a la tarde no le
// cambia la fecha a nadie más, y la nota que escribo no la lee el equipo.
// Es la diferencia entre una agenda y una lista compartida.
//
// POR QUÉ ARRASTRAR CON UN AGARRE Y NO CON PULSACIÓN LARGA: la pastilla
// entera tiene que seguir abriendo la actividad de un toque. Dos gestos
// compitiendo en la misma zona es lo que arreglamos en Actividades (§3.16b).
// El agarre ⠿ es una zona propia, de 44px, y nada más pasa por ahí.
//
// EL ARRASTRE ES A MANO, con eventos de puntero. La API de arrastrar del
// navegador no existe en el teléfono, que es el aparato para el que está
// hecho esto.
// ═══════════════════════════════════════════════════════════
import { db, doc, getDoc, setDoc, deleteField, serverTimestamp, onSnapshot } from './firebase-init.js';
import { Core } from './actividades-core.js';
import { CV2 } from './nucleo.js';

CV2.registrarSW();
const u = await CV2.verificarAuth();
CV2.renderNav('agenda');

const SELLO = 'agenda-6';
const $ = (id) => document.getElementById(id);
const esc = CV2.esc;

let todas = [];
let mia = {};              // { actId: {dia, franja, hora, nota} }
let vista = 'semana';   // 'semana' | 'arbol'
let lunes = null;
let editando = null;       // actId con el editor de pastilla abierto

// ── Lo que está PLEGADO en el árbol ──────────────────────
// Solo se guarda lo cerrado a propósito: abierto es lo normal. Va en el
// navegador y no en estado_usuario porque es cómo estoy mirando la pantalla
// ahora, no una preferencia: no tiene por qué viajar al teléfono de al lado
// ni gastar una escritura por cada triángulo. Sobrevive a la ida y vuelta a
// Actividades, que es lo único que hace falta.
let plegado = {};
try {
  plegado = JSON.parse(sessionStorage.getItem('cv2-agenda-plegado') || '{}') || {};
} catch { plegado = {}; }
function guardarPlegado() {
  // En navegación privada de iOS escribir acá puede tirar excepción. Que no se
  // recuerde el plegado es molesto; que reviente la pantalla, no.
  try { sessionStorage.setItem('cv2-agenda-plegado', JSON.stringify(plegado)); } catch { /* da igual */ }
}

// ── La vuelta desde Actividades ──────────────────────────
// ?vuelta=<id> — se acaba de crear una actividad desde acá. Se abre en la
// vista del árbol, se busca la nueva y se la señala. La dirección se limpia
// enseguida: recargar no tiene que volver a destellar algo que ya se vio.
const _q = new URLSearchParams(location.search);
const vuelta = _q.get('vuelta');
let recienId = (vuelta && vuelta !== '1') ? vuelta : null;
let recienHecha = false;
if (vuelta) {
  vista = 'arbol';
  history.replaceState(null, '', location.pathname);
}

const hoy = CV2.hoyISO();
const sumar = (iso, n) => {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};
const dias = (a, b) => Math.round(
  (new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);

// El domingo pertenece a la semana que ARRANCÓ seis días antes: si no,
// aparecería solo, al principio de una semana que ya terminó.
function lunesDe(iso) {
  const d = new Date(iso + 'T12:00:00');
  const w = d.getDay();
  return sumar(iso, w === 0 ? -6 : 1 - w);
}
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const nombreDia = (iso) => DIAS[new Date(iso + 'T12:00:00').getDay()];
const numDia = (iso) => Number(iso.slice(8, 10));
const mesDe = (iso) => MESES[Number(iso.slice(5, 7)) - 1];

const esLimpieza = (it) => !!(it.reservaId && it.fase);
function marca(it) {
  if (it.faltantesData) return '🛒 ';
  if (it.reservaId && it.fase === 'salida') return '📤 ';
  if (it.reservaId && it.fase === 'entrada') return '🧹 ';
  return '';
}
function esMia(it) {
  if (esLimpieza(it)) return true;
  if (it.creadoPor === u.uid) return true;
  return Array.isArray(it.competencias) && it.competencias.indexOf(u.uid) !== -1;
}

// El mismo semáforo que Actividades, copiado tal cual: si acá se calculara
// distinto, las dos pantallas dirían cosas diferentes de la misma actividad.
function semaforo(it) {
  if (it.hecho) return { c: '#9aa69a', t: 'Terminada' };
  if (it.prioridad === 'rojo') return { c: '#c0271f', t: 'Urgente' };
  const ciclo = it.recurrenciaDias ?? 0;
  if (ciclo > 0 && it.fechaInicio) {
    if (it.fechaInicio > hoy) return { c: '#cdd6cb', t: 'Vuelve el ' + CV2.fmtFecha(it.fechaInicio) };
    const a = dias(it.fechaInicio, hoy);
    if (a <= Math.max(1, Math.round(ciclo * 0.25))) return { c: '#1f7a32', t: 'Toca hacerla' };
    if (a <= ciclo) return { c: '#b8860b', t: 'Atrasada ' + a + 'd' };
    return { c: '#c0271f', t: 'Muy atrasada (' + a + 'd)' };
  }
  if (it.fechaVencimiento && it.fechaVencimiento < hoy) return { c: '#c0271f', t: 'Vencida' };
  if (it.fechaVencimiento) {
    const d = dias(hoy, it.fechaVencimiento);
    if (d <= 3) return { c: '#b8860b', t: 'Vence en ' + d + ' día(s)' };
  }
  if (it.prioridad === 'amarillo') return { c: '#b8860b', t: 'Importante' };
  if (it.fechaInicio && it.fechaInicio > hoy) return { c: '#cdd6cb', t: 'Programada ' + CV2.fmtFecha(it.fechaInicio) };
  return { c: '#1f7a32', t: 'Al día' };
}

// ── Dónde va cada actividad ──────────────────────────────
// Lo MÍO manda sobre lo de la actividad. Si moví algo al jueves a la tarde,
// va ahí aunque su fecha diga otra cosa: la actividad es del equipo, la
// agenda es mía.
function tramoDe(it) {
  const m = mia[it.id] || {};
  if (m.dia) return { desde: m.dia, hasta: m.dia, movida: true };
  if (it.hecho) return null;
  const ciclo = it.recurrenciaDias ?? 0;
  if (ciclo > 0) return it.fechaInicio ? { desde: it.fechaInicio, hasta: it.fechaInicio } : null;
  const ini = it.fechaInicio || it.fechaVencimiento;
  const fin = it.fechaVencimiento || it.fechaInicio;

  // SIN FECHA Y EN MI AGENDA: FLOTA EN HOY. No se le guarda un día — flota,
  // y por eso sigue apareciendo hoy mañana también, hasta que pase una de
  // cuatro cosas: le doy un día, la destildo, alguien la borra, o alguien la
  // da por hecha. Es una bandeja de entrada, no un olvido.
  // Guardarle 'dia: hoy' al agregarla la habría dejado clavada en una fecha
  // que nadie eligió, y en tres días estaría "atrasada" sin que nadie la
  // hubiera atrasado.
  if (!ini) return (it.id in mia) ? { desde: hoy, hasta: hoy, flotante: true } : null;

  return (fin && fin > ini) ? { desde: ini, hasta: fin } : { desde: ini, hasta: ini };
}
const horaDe = (it) => (mia[it.id] && mia[it.id].hora) || it.hora || '';
// Sin franja elegida se deduce de la hora; sin hora, mañana. Las tareas de
// la casa se hacen temprano salvo que alguien diga lo contrario.
function franjaDe(it) {
  const m = mia[it.id] || {};
  if (m.franja) return m.franja;
  const h = horaDe(it);
  return (h && h >= '13:00') ? 'tarde' : 'manana';
}

// En la semana solo entra lo que la persona puso, más las limpiezas: una
// limpieza tiene detrás la llegada de un huésped y no se elige.
const enMiSemana = (it) => (it.id in mia) || esLimpieza(it);

// ── Guardar lo mío ───────────────────────────────────────
// setDoc con merge NO borra claves ausentes de un mapa: para sacar algo hay
// que pedir deleteField() de esa clave (§4). Escribir el mapa entero sería
// pisar lo que se haya guardado desde otra pestaña.
async function guardarMio(actId, campos) {
  const antes = mia[actId] ? { ...mia[actId] } : null;
  if (campos === null) delete mia[actId];
  else mia[actId] = { ...(mia[actId] || {}), ...campos };
  render();
  try {
    await setDoc(doc(db, 'estado_usuario', u.uid), {
      agenda: { [actId]: campos === null ? deleteField() : mia[actId] },
      actualizadoEn: serverTimestamp()
    }, { merge: true });
  } catch (e) {
    // Se deshace en pantalla: dejar el cambio a la vista cuando no se guardó
    // es prometer algo que no pasó.
    if (antes) mia[actId] = antes; else delete mia[actId];
    render();
    CV2.toast('No se pudo guardar: ' + (e.code ?? e.message), 'error');
  }
}

// ── Pintar ───────────────────────────────────────────────
function pastillaHTML(it, dia, tr) {
  const m = mia[it.id] || {};
  const s = semaforo(it);
  const h = horaDe(it);
  const largo = tr.hasta > tr.desde;
  const cual = largo ? dias(tr.desde, dia) + 1 : 0;
  const total = largo ? dias(tr.desde, tr.hasta) + 1 : 0;
  const abierto = editando === it.id;

  return '<div class="pas' + '" data-pas="' + esc(it.id) + '" data-dia="' + esc(dia) + '">'
    + '<div class="pas-fila">'
    + '<span class="pas-agarre" data-agarre="' + esc(it.id) + '" title="Arrastrar">'
    + '<span class="material-icons">drag_indicator</span></span>'
    + (h ? '<span class="pas-hora">' + esc(h) + '</span>'
         : '<span class="pas-hora sin">—</span>')
    + '<span class="pas-sem" style="background:' + s.c + '" title="' + esc(s.t) + '"></span>'
    + '<a class="pas-txt" href="./actividades.html?a=' + encodeURIComponent(it.id) + '&editar=1">'
    + '<b>' + marca(it) + esc(it.titulo || '(sin título)') + '</b>'
    + '<small>' + esc(s.t)
    + (largo ? ' · <span class="chip">día ' + cual + '/' + total + '</span>' : '')
    + (tr.movida ? ' · <span class="chip mio">movida por vos</span>' : '')
    + (tr.flotante ? ' · <span class="chip">sin fecha · queda en hoy</span>' : '')
    + '</small></a>'
    + '<button class="pas-mas" data-editar="' + esc(it.id) + '" title="Ajustar en mi agenda">'
    + '<span class="material-icons">' + (abierto ? 'expand_less' : 'tune') + '</span></button>'
    + '</div>'
    + (m.nota && !abierto
      ? '<div class="pas-nota"><span class="material-icons">sticky_note_2</span>'
        + esc(m.nota) + '</div>'
      : '')
    + (abierto ? editorHTML(it, m) : '')
    + '</div>';
}

function editorHTML(it, m) {
  return '<div class="pas-ed">'
    + '<p class="ayuda">Esto cambia <b>solo tu agenda</b>. La actividad no se toca: '
    + 'nadie más ve estos cambios.</p>'
    + '<div class="l">'
    + '<div style="flex:1;"><label>Día</label>'
    + '<input type="date" data-ed="dia" value="' + esc(m.dia || '') + '"></div>'
    + '<div style="flex:0 0 100px;"><label>Hora</label>'
    + '<input type="time" data-ed="hora" value="' + esc(m.hora || '') + '"></div>'
    + '</div>'
    + '<div class="l"><div style="flex:1;"><label>Franja</label>'
    + '<select data-ed="franja">'
    + '<option value="">según la hora</option>'
    + '<option value="manana"' + (m.franja === 'manana' ? ' selected' : '') + '>Mañana</option>'
    + '<option value="tarde"' + (m.franja === 'tarde' ? ' selected' : '') + '>Tarde</option>'
    + '</select></div></div>'
    + '<div class="l"><div style="flex:1;"><label>Tu nota</label>'
    + '<input type="text" data-ed="nota" maxlength="140" placeholder="para vos: traer la escalera…" '
    + 'value="' + esc(m.nota || '') + '"></div></div>'
    + '<div class="acciones">'
    + '<button class="ok" data-guardar="' + esc(it.id) + '">Guardar</button>'
    + '<button data-limpiar="' + esc(it.id) + '">Volver a su fecha</button>'
    + (esLimpieza(it) ? '' : '<button data-sacar="' + esc(it.id) + '">Sacar de mi agenda</button>')
    + '</div></div>';
}

function renderSemana() {
  const domingo = sumar(lunes, 6);
  $('rango').textContent = numDia(lunes) + ' ' + mesDe(lunes)
    + ' — ' + numDia(domingo) + ' ' + mesDe(domingo);
  $('hAgenda').textContent = Object.keys(mia).length + ' marcada(s)';

  // Lo hecho se va de la semana, lo haya cerrado quien lo haya cerrado. La
  // marca en 'mia' se queda: si es recurrente y vuelve, vuelve agendada.
  const cand = todas
    .filter((it) => !it.hecho && it.parentId && enMiSemana(it))
    .map((it) => ({ it, tr: tramoDe(it) }))
    .filter((x) => x.tr);

  let h = '';

  // Las vencidas van arriba y fuera de la semana: en su día real
  // desaparecerían al pasar de semana, y son las que no hay que perder.
  if (lunes <= hoy && hoy <= domingo) {
    const v = cand.filter((x) => x.tr.hasta < hoy && !x.it.hecho);
    if (v.length) {
      h += '<div class="vencidas"><h2>Vencidas · ' + v.length + '</h2>'
        + v.sort((a, b) => a.tr.hasta.localeCompare(b.tr.hasta))
           .map((x) => pastillaHTML(x.it, x.tr.hasta, x.tr)).join('')
        + '</div>';
    }
  }

  let total = 0;
  for (let i = 0; i < 7; i++) {
    const d = sumar(lunes, i);
    const delDia = cand.filter((x) =>
      x.tr.desde <= d && d <= x.tr.hasta && (x.tr.hasta >= hoy || x.tr.movida));
    total += delDia.length;

    h += '<div class="dia' + (d === hoy ? ' es-hoy' : '') + (i >= 5 ? ' finde' : '') + '">'
      + '<h2><span class="num">' + numDia(d) + '</span>' + esc(nombreDia(d))
      + (d === hoy ? ' · hoy' : '')
      + '<span class="cuenta">' + (delDia.length || '') + '</span></h2>';

    ['manana', 'tarde'].forEach((fr) => {
      const items = delDia.filter((x) => franjaDe(x.it) === fr)
        .sort((a, b) => (horaDe(a.it) || '99:99').localeCompare(horaDe(b.it) || '99:99')
          || String(a.it.titulo ?? '').localeCompare(String(b.it.titulo ?? '')));
      h += '<div class="franja" data-zona="' + d + '|' + fr + '">'
        + '<div class="rot">' + (fr === 'manana' ? 'mañana' : 'tarde') + '</div>'
        + (items.length ? items.map((x) => pastillaHTML(x.it, d, x.tr)).join('')
                        : '<div class="nada">—</div>')
        + '</div>';
    });
    h += '</div>';
  }

  if (!total) {
    h += '<div class="aviso">Tu semana está vacía. Tocá <b>Actividades</b> acá abajo, '
      + 'agarrá una del <span class="material-icons" style="font-size:15px;vertical-align:-3px;">drag_indicator</span> '
      + 'y soltala en <b>Mi semana</b>.</div>';
  }

  h += '<p style="color:var(--gris);font-size:.72rem;text-align:center;margin:18px 0 0;">'
    + esc(SELLO) + ' · motor ' + esc(CV2.VERSION ?? '?') + '</p>';
  $('cuerpo').innerHTML = h;
}

// ── El árbol de origen ───────────────────────────────────
// TODAS las actividades en cascada, con las ramas que se pliegan: un depósito
// del que se agarra, pero que no obliga a pasar por treinta filas para llegar
// al proyecto siguiente. Las que ya están en la semana se ven en verde, para
// no ponerlas dos veces.
const estaAbierto = (id) => plegado[id] !== true;

function contarRama(id, hijosDe) {
  let n = 0;
  const bajar = (pid, nivel) => {
    if (nivel > 12) return;
    (hijosDe[pid] || []).forEach((h) => { n++; bajar(h.id, nivel + 1); });
  };
  bajar(id, 0);
  return n;
}

function pastillaArbolHTML(it, hijos, cuantos) {
  const ya = enMiSemana(it);
  // Las limpiezas están siempre y no se destildan: tienen detrás la llegada
  // de un huésped (§10 · F1). Se ven marcadas y en gris.
  const fija = esLimpieza(it);
  const s = semaforo(it);
  const f = it.fechaInicio || it.fechaVencimiento;
  const abierta = estaAbierto(it.id);
  // CASILLA, no agarre. Agregar es una decisión de sí o no, y una casilla la
  // dice en un toque; arrastrar desde una lista larga hasta una pestaña de
  // abajo obliga a recorrer media pantalla con el dedo apretado. El arrastre
  // se queda donde sirve: mover algo DENTRO de la semana.
  return '<div class="pas' + (ya ? ' ya' : '')
      + (recienId === it.id ? ' recien' : '') + '" data-pas="' + esc(it.id) + '">'
    + '<div class="pas-fila">'
    // El hueco vacío cuando no hay hijos mantiene derecha la columna de
    // casillas: sin él, cada fila sin rama se corría 38px y el árbol se leía
    // como un zigzag.
    + (hijos
      ? '<button class="arb-btn" data-plegar="' + esc(it.id) + '" title="'
        + (abierta ? 'Plegar' : 'Desplegar') + '"><span class="material-icons">'
        + (abierta ? 'expand_more' : 'chevron_right') + '</span></button>'
      : '<span class="arb-btn vacio-hueco"></span>')
    + '<label class="pas-check" title="' + (ya ? 'Sacar de mi semana' : 'Poner en mi semana') + '">'
    + '<input type="checkbox" data-check="' + esc(it.id) + '"' + (ya ? ' checked' : '')
    + (fija ? ' disabled' : '') + '></label>'
    + '<span class="pas-sem" style="background:' + s.c + '" title="' + esc(s.t) + '"></span>'
    + '<a class="pas-txt" href="./actividades.html?a=' + encodeURIComponent(it.id) + '&editar=1">'
    + '<b>' + marca(it) + esc(it.titulo || '(sin título)') + '</b>'
    + '<small>' + (f ? CV2.fmtFecha(f) : 'sin fecha')
    + (it.hora ? ' · ' + esc(it.hora) : '')
    + (esMia(it) ? ' · <span class="chip mio">tuya</span>' : '')
    + (fija ? ' · <span class="chip mio">siempre en tu semana</span>'
            : (ya ? ' · <span class="chip mio">en tu semana</span>' : ''))
    + (!f && ya && !fija ? ' · <span class="chip">queda en hoy</span>' : '')
    + (hijos && !abierta ? ' · <span class="chip">' + cuantos + ' adentro</span>' : '')
    + '</small></a>'
    // Agregar un sub-ítem SIN salir del hilo: lleva al mismo formulario de
    // Actividades con este padre ya elegido y vuelve acá al guardar.
    + '<button class="arb-btn" data-nueva="' + esc(it.id) + '" title="Agregar una actividad acá adentro">'
    + '<span class="material-icons">add</span></button>'
    + '</div></div>';
}

function ramaHTML(id, hijosDe, nivel) {
  const hijos = hijosDe[id] || [];
  if (!hijos.length || nivel > 12) return '';
  return '<div class="cv-nodo-hijos">' + hijos.map((it) => {
    const misHijos = (hijosDe[it.id] || []).length;
    return pastillaArbolHTML(it, misHijos > 0, contarRama(it.id, hijosDe))
      + (estaAbierto(it.id) ? ramaHTML(it.id, hijosDe, nivel + 1) : '');
  }).join('') + '</div>';
}

function renderArbol() {
  const hijosDe = {};
  const raices = [];
  todas.filter((it) => !it.hecho).forEach((it) => {
    if (!it.parentId) raices.push(it);
    else (hijosDe[it.parentId] = hijosDe[it.parentId] || []).push(it);
  });
  Object.values(hijosDe).forEach((a) => a.sort((x, y) =>
    (x.orden ?? 0) - (y.orden ?? 0)
    || String(x.titulo ?? '').localeCompare(String(y.titulo ?? ''))));
  // Las limpiezas primero, igual que en Actividades (§10 · F1).
  raices.sort((a, b) => (a.id === 'proj-limpiezas' ? 0 : 1) - (b.id === 'proj-limpiezas' ? 0 : 1)
    || String(a.titulo ?? '').localeCompare(String(b.titulo ?? '')));

  let h = '<div class="aviso"><b>Tildá</b> lo que quieras tener en tu semana. '
    + 'Destildá para sacarlo.<br>'
    + 'Lo que <b>no tiene fecha</b> te va a aparecer <b>hoy</b>, todos los días, hasta '
    + 'que le des un día en tu semana, lo destildes, o alguien lo dé por hecho.<br>'
    + 'Las <b>limpiezas</b> están siempre y no se destildan.<br>'
    + 'Con <span class="material-icons" style="font-size:15px;vertical-align:-3px;">add</span> '
    + 'creás una actividad nueva ahí mismo y volvés acá.</div>'
    + '<div class="arb-acc">'
    + '<button data-todo="plegar"><span class="material-icons">unfold_less</span>Plegar todo</button>'
    + '<button data-todo="desplegar"><span class="material-icons">unfold_more</span>Desplegar todo</button>'
    + '</div>';

  if (!raices.length) return h + '<div class="arb-vacio">No hay actividades.</div>';

  raices.forEach((r) => {
    const cuantos = contarRama(r.id, hijosDe);
    const abierta = estaAbierto(r.id);
    h += '<div class="arb-proy">'
      + '<button class="arb-btn" data-plegar="' + esc(r.id) + '" title="'
      + (abierta ? 'Plegar' : 'Desplegar') + '"><span class="material-icons">'
      + (abierta ? 'expand_more' : 'chevron_right') + '</span></button>'
      + '<span class="nom">📁 ' + esc(r.titulo || r.id) + '</span>'
      + '<span class="arb-cuenta">' + cuantos + '</span>'
      + '<button class="arb-btn" data-nueva="' + esc(r.id) + '" title="Agregar una actividad a este proyecto">'
      + '<span class="material-icons">add</span></button>'
      + '</div>';
    if (!abierta) return;
    h += ramaHTML(r.id, hijosDe, 1) || '<div class="arb-vacio">— sin nada adentro</div>';
  });
  return h;
}

function render() {
  // Se conserva el desplazamiento: tildar en una lista larga y volver arriba
  // de golpe obliga a buscar dónde se estaba después de cada toque.
  const y = window.scrollY;
  $('hAgenda').textContent = Object.keys(mia).length + ' en tu semana';
  document.querySelector('.semana').style.display = vista === 'semana' ? '' : 'none';
  if (vista === 'arbol') {
    $('cuerpo').innerHTML = renderArbol()
      + '<p style="color:var(--gris);font-size:.72rem;text-align:center;margin:18px 0 0;">'
      + esc(SELLO) + ' · motor ' + esc(CV2.VERSION ?? '?') + '</p>';
    window.scrollTo(0, y);
    mostrarReciente();
    return;
  }
  renderSemana();
  window.scrollTo(0, y);
}

// La recién creada, a la vista. Se hace UNA vez y después se olvida: repetir
// el destello en cada repintado sería un parpadeo permanente.
function mostrarReciente() {
  if (!recienId || recienHecha || vista !== 'arbol') return;
  const el = document.querySelector('[data-pas="' + CSS.escape(recienId) + '"]');
  if (!el) return;   // todavía no llegó por el onSnapshot: se intenta al siguiente
  recienHecha = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  CV2.toast('Creada · tildala si va en tu semana', 'success');
  setTimeout(() => { recienId = null; render(); }, 2800);
}

// ═══ ARRASTRAR ════════════════════════════════════════════
// A mano con eventos de puntero: la API de arrastrar del navegador no existe
// en el teléfono. Un solo puntero por vez; el 'touch-action: none' del agarre
// impide que el dedo desplace la página mientras se mueve una pastilla.
let arr = null;   // { id, fantasma, zona, tab }

function zonaBajo(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return { zona: null, tab: null };
  const z = el.closest('[data-zona]');
  const t = el.closest('[data-tab]');
  return { zona: z, tab: t };
}

function limpiarResaltes() {
  document.querySelectorAll('.franja.encima').forEach((e) => e.classList.remove('encima'));
  document.querySelectorAll('.tab.encima').forEach((e) => {
    e.classList.remove('encima'); e.classList.remove('saca');
  });
}

document.addEventListener('pointerdown', (ev) => {
  const ag = ev.target.closest('[data-agarre]');
  if (!ag) return;
  const id = ag.dataset.agarre;
  const pas = ag.closest('.pas');
  if (!pas) return;

  ev.preventDefault();
  const r = pas.getBoundingClientRect();
  const f = pas.cloneNode(true);
  f.className = 'fantasma';
  f.style.width = r.width + 'px';
  f.style.left = r.left + 'px';
  f.style.top = r.top + 'px';
  document.body.appendChild(f);
  pas.classList.add('arrastrando');
  document.body.classList.add('arrastrando');

  arr = { id, fantasma: f, pas, dx: ev.clientX - r.left, dy: ev.clientY - r.top,
    zona: null, tab: null };
  ag.setPointerCapture(ev.pointerId);
});

document.addEventListener('pointermove', (ev) => {
  if (!arr) return;
  ev.preventDefault();
  arr.fantasma.style.left = (ev.clientX - arr.dx) + 'px';
  arr.fantasma.style.top = (ev.clientY - arr.dy) + 'px';

  // Desplazamiento automático cerca de los bordes: una semana no entra en
  // una pantalla de teléfono, y sin esto no se puede soltar en el viernes.
  const alto = window.innerHeight;
  if (ev.clientY < 110) window.scrollBy(0, -14);
  else if (ev.clientY > alto - 150) window.scrollBy(0, 14);

  limpiarResaltes();
  arr.fantasma.style.display = 'none';
  const { zona, tab } = zonaBajo(ev.clientX, ev.clientY);
  arr.fantasma.style.display = '';
  arr.zona = zona; arr.tab = tab;
  if (zona) zona.classList.add('encima');
  if (tab) {
    tab.classList.add('encima');
    if (tab.dataset.tab !== 'agenda') tab.classList.add('saca');
  }
});

document.addEventListener('pointerup', async (ev) => {
  if (!arr) return;
  const { id, zona, tab, fantasma, pas } = arr;
  fantasma.remove();
  pas.classList.remove('arrastrando');
  document.body.classList.remove('arrastrando');
  limpiarResaltes();
  arr = null;

  const it = todas.find((x) => x.id === id);
  if (!it) return;

  if (tab) {
    // Desde el árbol ya no se arrastra —ahí se tilda—, así que soltar en
    // 'Mi semana' no tiene nada que hacer: lo que se arrastra ya está en la
    // semana. Soltar en 'Actividades' la saca.
    if (tab.dataset.tab === 'semana') return;
    if (esLimpieza(it)) {
      CV2.toast('Las limpiezas no se sacan: tienen una llegada detrás', 'error');
      return;
    }
    if (!(id in mia)) return;
    await guardarMio(id, null);
    CV2.toast('Sacada de tu semana');
    return;
  }

  if (zona) {
    const [dia, franja] = zona.dataset.zona.split('|');
    // Mover a una franja sin hora propia NO inventa una hora: solo dice en
    // qué mitad del día va. Poner "13:00" porque alguien soltó en la tarde
    // sería inventar un dato que nadie escribió.
    await guardarMio(id, { dia, franja });
  }
});

document.addEventListener('pointercancel', () => {
  if (!arr) return;
  arr.fantasma.remove();
  arr.pas.classList.remove('arrastrando');
  document.body.classList.remove('arrastrando');
  limpiarResaltes();
  arr = null;
});

// ═══ Toques ═══════════════════════════════════════════════
// La casilla va por 'change' y no por 'click': así responde igual al toque,
// al teclado y a los lectores de pantalla.
$('cuerpo').addEventListener('change', async (ev) => {
  const c = ev.target.closest('[data-check]');
  if (!c) return;
  const id = c.dataset.check;
  const it = todas.find((x) => x.id === id);
  if (!it) return;
  if (c.checked) {
    // No se le guarda ningún día: si no tiene fecha propia, flota en hoy.
    await guardarMio(id, {});
    const sinFecha = !(it.fechaInicio || it.fechaVencimiento);
    CV2.toast(sinFecha ? 'En tu semana · te aparece hoy hasta que le des un día'
                       : 'En tu semana');
  } else {
    await guardarMio(id, null);
    CV2.toast('Sacada de tu semana');
  }
});

$('cuerpo').addEventListener('click', async (ev) => {
  // ── Plegar y desplegar ──
  const pl = ev.target.closest('[data-plegar]');
  if (pl) {
    const id = pl.dataset.plegar;
    if (plegado[id]) delete plegado[id]; else plegado[id] = true;
    guardarPlegado();
    render();
    return;
  }

  const td = ev.target.closest('[data-todo]');
  if (td) {
    if (td.dataset.todo === 'plegar') {
      // Se pliega TODO lo que tiene algo adentro, no solo los proyectos: si
      // solo se plegaran las raíces, un proyecto con sub-ramas al desplegarlo
      // volvería a escupir la lista entera.
      const conHijos = {};
      todas.forEach((it) => { if (it.parentId) conHijos[it.parentId] = true; });
      Object.keys(conHijos).forEach((id) => { plegado[id] = true; });
    } else {
      plegado = {};
    }
    guardarPlegado();
    render();
    window.scrollTo(0, 0);
    return;
  }

  // ── Crear una actividad sin perder el hilo ──
  // Se va al formulario de Actividades con este padre ya elegido y se vuelve
  // acá al guardar. El formulario NO se copia: es el mismo, con alcance,
  // recurrencia, tarifa y fechas. Dos copias se desincronizan a la primera
  // modificación de una de las dos.
  const nu = ev.target.closest('[data-nueva]');
  if (nu) {
    // La rama donde se crea queda ABIERTA: si estaba plegada, al volver la
    // actividad nueva estaría escondida justo adentro de lo que se cerró.
    delete plegado[nu.dataset.nueva];
    // Lo que está plegado se guarda ANTES de irse: al volver, la pantalla
    // tiene que estar como se dejó.
    guardarPlegado();
    location.href = './actividades.html?nueva=' + encodeURIComponent(nu.dataset.nueva)
      + '&volver=agenda';
    return;
  }

  const ed = ev.target.closest('[data-editar]');
  if (ed) { editando = editando === ed.dataset.editar ? null : ed.dataset.editar; render(); return; }

  const g = ev.target.closest('[data-guardar]');
  if (g) {
    const id = g.dataset.guardar;
    const caja = g.closest('.pas-ed');
    const v = (k) => (caja.querySelector('[data-ed="' + k + '"]') || {}).value || '';
    editando = null;
    await guardarMio(id, {
      dia: v('dia') || null, hora: v('hora') || null,
      franja: v('franja') || null, nota: v('nota').trim() || null
    });
    return;
  }

  const l = ev.target.closest('[data-limpiar]');
  if (l) {
    const id = l.dataset.limpiar;
    editando = null;
    // Vuelve a su fecha real pero SIGUE en la agenda: sacar es otra cosa.
    await guardarMio(id, { dia: null, hora: null, franja: null });
    CV2.toast('Vuelve a su fecha propia');
    return;
  }

  const sa = ev.target.closest('[data-sacar]');
  if (sa) {
    editando = null;
    await guardarMio(sa.dataset.sacar, null);
    CV2.toast('Sacada de tu agenda');
  }
});

$('tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]');
  if (!b || arr) return;
  vista = b.dataset.tab;
  editando = null;
  $('tabs').querySelectorAll('.tab').forEach((x) => x.classList.toggle('activo', x === b));
  render();
  window.scrollTo(0, 0);
});

$('ant').addEventListener('click', () => { lunes = sumar(lunes, -7); render(); });
$('sig').addEventListener('click', () => { lunes = sumar(lunes, 7); render(); });
$('ahora').addEventListener('click', () => { lunes = lunesDe(hoy); render(); });

// ═══ Cargas — AL FINAL ════════════════════════════════════
lunes = lunesDe(hoy);

// Si se vuelve de crear una actividad, la pestaña activa es la del árbol: la
// vista ya se fijó arriba, pero la barra de abajo no se entera sola.
$('tabs').querySelectorAll('.tab').forEach((x) =>
  x.classList.toggle('activo', x.dataset.tab === vista));

try {
  const eu = await getDoc(doc(db, 'estado_usuario', u.uid));
  const g = eu.exists() ? eu.data().agenda : null;
  // Compatibilidad: la primera versión guardaba un ARRAY de ids. Se convierte
  // a mapa al vuelo, sin migración: un array viejo se lee igual de bien.
  if (Array.isArray(g)) g.forEach((id) => { mia[id] = {}; });
  else if (g && typeof g === 'object') mia = g;
} catch (e) { console.warn('estado_usuario', e); }

// La MISMA consulta que Actividades: su regla espeja exactamente esas cuatro
// ramas y una consulta sin filtrar se rechaza entera.
onSnapshot(Core.consultaActividades(u, CV2.esAdmin()), (snap) => {
  // LO ELIMINADO NO ENTRA. Eliminar una actividad marca 'eliminado' en UN
  // documento y su rama entera se va con él: acá se aplica el mismo corte que
  // en Actividades, o una actividad mandada a la papelera seguiría apareciendo
  // en la agenda de todos.
  const crudo = {};
  snap.forEach((d) => { crudo[d.id] = { id: d.id, ...d.data() }; });
  const enterrado = (it) => {
    let cur = it, g = 0;
    while (cur && g++ < 25) {
      if (cur.eliminado) return true;
      cur = cur.parentId ? crudo[cur.parentId] : null;
    }
    return false;
  };
  todas = Object.values(crudo).filter((it) => !enterrado(it));
  render();
}, (e) => {
  console.error(e);
  $('cuerpo').innerHTML = '<div class="cargando">No se pudo cargar la agenda ('
    + esc(e.code ?? e.message) + ').</div>';
});
</script>
</body>
</html>
