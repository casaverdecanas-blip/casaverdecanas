<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  .semana { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .semana .rango { flex: 1; text-align: center; font-size: .9rem; font-weight: 600; }
  .semana button { min-width: 44px; min-height: 44px; border: 1px solid var(--linea);
    background: #fff; border-radius: 10px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; font-family: inherit; }

  .filtros { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px;
    -webkit-overflow-scrolling: touch; }
  .fchip { flex: 0 0 auto; min-height: 40px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--linea); background: #fff; font-size: .84rem;
    color: var(--tinta); cursor: pointer; font-family: inherit; }
  .fchip.activo { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 600; }

  .dia { margin-bottom: 10px; }
  .dia > h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 5px;
    font-size: .86rem; text-transform: capitalize; }
  .dia > h2 .num { font-size: 1.1rem; font-weight: 700; }
  .dia > h2 .cuenta { margin-left: auto; font-size: .74rem; color: var(--gris);
    font-weight: 400; text-transform: none; }
  .dia.es-hoy > h2 { color: var(--verde-osc); }
  .dia.es-hoy > h2 .num { background: var(--verde); color: #fff; border-radius: 9px;
    padding: 1px 8px; }
  .dia.finde > h2 { color: var(--gris); }

  .franja { border-left: 3px solid var(--linea); padding-left: 10px; }
  .dia.es-hoy .franja { border-left-color: var(--verde); }

  .ag { display: flex; align-items: center; gap: 9px; background: #fff;
    border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 8px 6px 8px 10px; margin-bottom: 5px; min-height: 52px;
    box-shadow: var(--sombra); text-decoration: none; color: var(--tinta); }
  .ag:active { filter: brightness(.97); }
  .ag .hora { flex: 0 0 46px; text-align: right; font-size: .82rem; font-weight: 700;
    color: var(--tinta); line-height: 1.25; }
  .ag .hora small { display: block; font-weight: 400; font-size: .68rem; color: var(--gris); }
  .ag .hora.sin { color: var(--gris); font-weight: 400; font-size: .72rem; }
  .ag .sem { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ag .txt { flex: 1; min-width: 0; }
  .ag .txt b { display: block; font-size: .89rem; font-weight: 600; overflow-wrap: anywhere; }
  .ag .txt small { display: block; color: var(--gris); font-size: .75rem;
    line-height: 1.45; overflow-wrap: anywhere; }
  .ag .material-icons.ir { color: var(--gris); font-size: 18px; flex: none; }
  .tramo-chip { font-size: .66rem; padding: 1px 6px; border-radius: 999px;
    background: var(--crema); color: var(--gris); white-space: nowrap; }

  .dia-vacio { color: var(--gris); font-size: .78rem; padding: 4px 0 8px; }
  .vencidas { background: #fdeceb; border: 1px solid #f0b8b4; border-radius: var(--radio);
    padding: 11px 13px; margin-bottom: 14px; }
  .vencidas h2 { margin: 0 0 6px; font-size: .84rem; color: #8e2b2b;
    text-transform: uppercase; letter-spacing: .04em; }
  .aviso { background: var(--crema); border-radius: 10px; padding: 11px 13px;
    font-size: .83rem; line-height: 1.55; margin: 0 0 12px; color: var(--gris); }
  .cargando { text-align: center; color: var(--gris); padding: 30px; }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <h1>Agenda</h1>

  <div class="semana">
    <button id="ant" title="Semana anterior"><span class="material-icons">chevron_left</span></button>
    <span class="rango" id="rango">—</span>
    <button id="sig" title="Semana siguiente"><span class="material-icons">chevron_right</span></button>
    <button id="ahora" title="Volver a esta semana"><span class="material-icons">today</span></button>
  </div>

  <div class="filtros" id="filtros">
    <button class="fchip activo" data-f="agenda">En mi agenda</button>
    <button class="fchip" data-f="mias">Las mías</button>
    <button class="fchip" data-f="todas">Todo lo que veo</button>
  </div>

  <div id="cuerpo"><div class="cargando">Cargando…</div></div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════
// AGENDA — la semana, día por día, por hora.
//
// Actividades muestra el ÁRBOL: proyectos, ítems, sub-ítems. Es la vista
// correcta para organizar y la equivocada para arrancar el día — hay que
// abrir cada rama para descubrir qué toca.
//
// Cuatro decisiones que la definen:
//  · SEMANA COMPLETA, de lunes a domingo. Una lista de "próximos 7 días" no
//    deja ver que el jueves está cargado y el viernes vacío.
//  · UNA ACTIVIDAD PUEDE OCUPAR VARIOS DÍAS. Si su vencimiento es posterior
//    a su inicio, aparece en CADA día del tramo, diciendo cuál de todos es.
//  · CADA UNO ELIGE QUÉ VE. El filtro por defecto es "En mi agenda": solo lo
//    que la persona marcó con el botón 📅 en Actividades. Es la diferencia
//    entre una agenda y un listado de todo lo que existe.
//  · TOCAR ABRE LA EDICIÓN, no el detalle. Desde acá lo que se quiere hacer
//    casi siempre es mover la fecha o la hora.
//
// NO es el Calendario: ese muestra la OCUPACIÓN de las cabañas y sale de las
// reservas. Este es el trabajo, y sale de las actividades.
// ═══════════════════════════════════════════════════════════
import { db, doc, getDoc, onSnapshot } from './firebase-init.js';
import { Core } from './actividades-core.js';
import { CV2 } from './nucleo.js';

CV2.registrarSW();
const u = await CV2.verificarAuth();
CV2.renderNav('agenda');

const SELLO = 'agenda-2';
const $ = (id) => document.getElementById(id);
const esc = CV2.esc;

let todas = [];
let enAgenda = new Set();
let filtro = 'agenda';
let lunes = null;          // lunes de la semana que se está mirando

const hoy = CV2.hoyISO();
const sumar = (iso, n) => {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};
const dias = (a, b) => Math.round(
  (new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);

// El lunes de la semana de una fecha. getDay() devuelve 0 para domingo, así
// que el domingo pertenece a la semana que ARRANCÓ seis días antes — si no,
// aparecería solo, al principio de una semana que ya terminó.
function lunesDe(iso) {
  const d = new Date(iso + 'T12:00:00');
  const dow = d.getDay();
  return sumar(iso, dow === 0 ? -6 : 1 - dow);
}

const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const nombreDia = (iso) => DIAS[new Date(iso + 'T12:00:00').getDay()];
const numeroDia = (iso) => Number(iso.slice(8, 10));
const mesDe = (iso) => MESES[Number(iso.slice(5, 7)) - 1];

// ── Qué días ocupa una actividad ─────────────────────────
// Ocupa un TRAMO cuando su vencimiento es posterior a su inicio: ahí aparece
// en cada día del tramo. Si no, ocupa un solo día.
// Una recurrente ocupa el día en que vuelve — su 'fechaInicio', que el cierre
// de ciclo reprograma solo.
function tramoDe(it) {
  if (it.hecho) return null;
  const ciclo = it.recurrenciaDias ?? 0;
  if (ciclo > 0) {
    const f = it.fechaInicio;
    return f ? { desde: f, hasta: f } : null;
  }
  const ini = it.fechaInicio || it.fechaVencimiento;
  const fin = it.fechaVencimiento || it.fechaInicio;
  if (!ini) return null;
  return (fin && fin > ini) ? { desde: ini, hasta: fin } : { desde: ini, hasta: ini };
}

// El mismo semáforo que Actividades, copiado tal cual: si acá se calculara
// distinto, las dos pantallas dirían cosas diferentes de la misma actividad
// y no habría forma de saber cuál miente.
function semaforo(it) {
  if (it.hecho) return { c: '#9aa69a', t: 'Terminada' };
  if (it.prioridad === 'rojo') return { c: '#c0271f', t: 'Urgente' };
  const ciclo = it.recurrenciaDias ?? 0;
  if (ciclo > 0 && it.fechaInicio) {
    if (it.fechaInicio > hoy) return { c: '#cdd6cb', t: 'Vuelve el ' + CV2.fmtFecha(it.fechaInicio) };
    const atraso = dias(it.fechaInicio, hoy);
    if (atraso <= Math.max(1, Math.round(ciclo * 0.25))) return { c: '#1f7a32', t: 'Toca hacerla' };
    if (atraso <= ciclo) return { c: '#b8860b', t: 'Atrasada ' + atraso + 'd' };
    return { c: '#c0271f', t: 'Muy atrasada (' + atraso + 'd)' };
  }
  if (it.fechaVencimiento && it.fechaVencimiento < hoy) return { c: '#c0271f', t: 'Vencida' };
  if (it.fechaVencimiento) {
    const d = dias(hoy, it.fechaVencimiento);
    if (d <= 3) return { c: '#b8860b', t: 'Vence en ' + d + ' día(s)' };
  }
  if (it.prioridad === 'amarillo') return { c: '#b8860b', t: 'Importante' };
  if (it.fechaInicio && it.fechaInicio > hoy) return { c: '#cdd6cb', t: 'Programada ' + CV2.fmtFecha(it.fechaInicio) };
  return { c: '#1f7a32', t: 'Al día' };
}

const esLimpieza = (it) => !!(it.reservaId && it.fase);
function marca(it) {
  if (it.faltantesData) return '🛒 ';
  if (it.reservaId && it.fase === 'salida') return '📤 ';
  if (it.reservaId && it.fase === 'entrada') return '🧹 ';
  return '';
}

// "Las mías": creadas, asignadas, y TODAS las limpiezas — una limpieza no se
// le asigna a nadie y la tiene que ver quien vaya a hacerla.
function esMia(it) {
  if (esLimpieza(it)) return true;
  if (it.creadoPor === u.uid) return true;
  return Array.isArray(it.competencias) && it.competencias.indexOf(u.uid) !== -1;
}

// En "mi agenda" entran las que la persona marcó Y las limpiezas: una
// limpieza tiene detrás la fecha de llegada de un huésped y no se elige.
function pasaFiltro(it) {
  if (filtro === 'agenda') return enAgenda.has(it.id) || esLimpieza(it);
  if (filtro === 'mias') return esMia(it);
  return true;
}

// ── Render ───────────────────────────────────────────────
function filaHTML(it, dia, tramo) {
  const s = semaforo(it);
  const largo = tramo.hasta > tramo.desde;
  const cual = largo ? (dias(tramo.desde, dia) + 1) : 0;
  const total = largo ? (dias(tramo.desde, tramo.hasta) + 1) : 0;

  const hora = it.hora
    ? '<span class="hora">' + esc(it.hora)
      + (it.duracionHoras ? '<small>' + esc(CV2.fmtHM(it.duracionHoras)) + '</small>' : '')
      + '</span>'
    : '<span class="hora sin">sin hora</span>';

  // Va derecho a la EDICIÓN: desde la agenda lo que se quiere hacer casi
  // siempre es mover la fecha o la hora.
  return '<a class="ag" href="./actividades.html?a=' + encodeURIComponent(it.id) + '&editar=1">'
    + hora
    + '<span class="sem" style="background:' + s.c + '" title="' + esc(s.t) + '"></span>'
    + '<span class="txt"><b>' + marca(it) + esc(it.titulo || '(sin título)') + '</b>'
    + '<small>' + esc(s.t)
    + (it.detalle ? ' · ' + esc(it.detalle) : '')
    + '</small></span>'
    + (largo ? '<span class="tramo-chip">día ' + cual + '/' + total + '</span>' : '')
    + '<span class="material-icons ir">edit</span></a>';
}

function render() {
  const domingo = sumar(lunes, 6);
  $('rango').textContent = numeroDia(lunes) + ' ' + mesDe(lunes)
    + ' — ' + numeroDia(domingo) + ' ' + mesDe(domingo);

  const candidatas = todas.filter((it) => !it.hecho && it.parentId && pasaFiltro(it))
    .map((it) => ({ it, tr: tramoDe(it) }))
    .filter((x) => x.tr);

  let h = '';

  // Las vencidas van ARRIBA y fuera de la semana. Si quedaran en su día real,
  // al pasar de semana desaparecerían de la vista — y son justamente las que
  // no hay que perder de vista. Solo se muestran en la semana de hoy.
  if (lunes <= hoy && hoy <= domingo) {
    const vencidas = candidatas.filter((x) => x.tr.hasta < hoy);
    if (vencidas.length) {
      h += '<div class="vencidas"><h2>Vencidas · ' + vencidas.length + '</h2>'
        + vencidas
          .sort((a, b) => a.tr.hasta.localeCompare(b.tr.hasta))
          .map((x) => filaHTML(x.it, x.tr.hasta, x.tr)).join('')
        + '</div>';
    }
  }

  let totalSemana = 0;
  for (let i = 0; i < 7; i++) {
    const d = sumar(lunes, i);
    const delDia = candidatas
      .filter((x) => x.tr.desde <= d && d <= x.tr.hasta && x.tr.hasta >= hoy)
      // Lo que tiene hora manda sobre lo que se puede hacer en cualquier
      // momento del día: sin hora va al final.
      .sort((a, b) => (a.it.hora || '99:99').localeCompare(b.it.hora || '99:99')
        || String(a.it.titulo ?? '').localeCompare(String(b.it.titulo ?? '')));
    totalSemana += delDia.length;
    const finde = i >= 5;

    h += '<div class="dia' + (d === hoy ? ' es-hoy' : '') + (finde ? ' finde' : '') + '">'
      + '<h2><span class="num">' + numeroDia(d) + '</span>' + esc(nombreDia(d))
      + (d === hoy ? ' · hoy' : '')
      + '<span class="cuenta">' + (delDia.length || '') + '</span></h2>';
    h += delDia.length
      ? '<div class="franja">' + delDia.map((x) => filaHTML(x.it, d, x.tr)).join('') + '</div>'
      : '<div class="dia-vacio">—</div>';
    h += '</div>';
  }

  if (!totalSemana) {
    h += '<div class="aviso">' + (filtro === 'agenda'
      ? 'No tenés nada en tu agenda esta semana. Poné actividades con el botón '
        + '<b>📅</b> del detalle, en <b>Tareas</b>. Las limpiezas aparecen solas.'
      : 'Nada con fecha en esta semana.') + '</div>';
  }

  h += '<p style="color:var(--gris);font-size:.72rem;text-align:center;margin:20px 0 0;">'
    + esc(SELLO) + ' · motor ' + esc(CV2.VERSION ?? '?') + '</p>';
  $('cuerpo').innerHTML = h;
}

// ── Gestos ───────────────────────────────────────────────
$('ant').addEventListener('click', () => { lunes = sumar(lunes, -7); render(); });
$('sig').addEventListener('click', () => { lunes = sumar(lunes, 7); render(); });
$('ahora').addEventListener('click', () => { lunes = lunesDe(hoy); render(); });
$('filtros').addEventListener('click', (ev) => {
  const b = ev.target.closest('.fchip');
  if (!b) return;
  filtro = b.dataset.f;
  $('filtros').querySelectorAll('.fchip').forEach((x) => x.classList.toggle('activo', x === b));
  render();
});

// ═══ Cargas — AL FINAL ════════════════════════════════════
lunes = lunesDe(hoy);

// Lo que esta persona eligió ver. Si falla, se sigue con el conjunto vacío:
// una agenda que igual muestra las limpiezas es mejor que una pantalla de
// error (§3.9 — nada decorativo en el camino crítico).
try {
  const eu = await getDoc(doc(db, 'estado_usuario', u.uid));
  enAgenda = new Set(eu.exists() ? (eu.data().agenda ?? []) : []);
} catch (e) { console.warn('estado_usuario', e); }

// La MISMA consulta que Actividades: si acá se pidiera distinto, la agenda
// mostraría cosas que la otra pantalla no, o al revés. Su regla de Firestore
// espeja exactamente esas cuatro ramas — sin filtrar se rechaza entera.
onSnapshot(Core.consultaActividades(u, CV2.esAdmin()), (snap) => {
  todas = [];
  snap.forEach((d) => todas.push({ id: d.id, ...d.data() }));
  render();
}, (e) => {
  console.error(e);
  $('cuerpo').innerHTML = '<div class="cargando">No se pudo cargar la agenda ('
    + esc(e.code ?? e.message) + ').</div>';
});
</script>
</body>
</html>
