<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Casa Verde · Comprobante de reserva</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<!--
  EL COMPROBANTE DE RESERVA (comprobante-1, 3-nov-2026, pedido de Mauro).

  Una hoja A4 formal con los datos de UNA reserva —y de las otras cabañas de
  su mismo acuerdo—, lista para imprimir o guardar en PDF y mandarle al
  huésped. Se abre desde el botón «📄 Comprobante» de cada tarjeta de
  Reservas, en una pestaña nueva: comprobante.html?r=<id de la reserva>.

  Sigue el molde de llegada.html: pasa por CV2.verificarAuth, pide el permiso
  `reservas` y lee `reservas/`, el acuerdo en `grupos/` y el alojamiento en
  `cabanas/`. NO ESCRIBE NADA: es una vista.

  ── LO QUE LLEVA Y LO QUE NO ─────────────────────────────────────────────────
  · El nombre de quien reserva, la cabaña o las cabañas, la entrada y la
    salida con su hora, las noches y el estado. La estadía de arriba es la del
    acuerdo entero: de la primera entrada a la última salida.
  · NO lleva cuántas personas son (comprobante-2, Mauro: «no es necesario que
    figure ninguna cantidad… sólo el nombre de la persona que reserva»): en un
    acuerdo con cabañas en fechas distintas sumarlas daba gente que nunca
    estuvo junta (Darío: 14 adultos y 4 niños).
  · Los IMPORTES sólo si se marca «Incluir importes»: el comprobante NO es un
    recibo, y la cláusula del pie lo dice. Arranca apagado a propósito.
  · Ni teléfono ni mail del huésped: el documento sale de la casa y viaja.
  · Idioma: el del huésped si se sabe (como la bienvenida de llegada.html),
    con selector es / pt / en.
  · Una reserva en presupuesto o anulada lo dice ARRIBA, en grande: un
    comprobante de algo que no está confirmado no puede parecer uno que sí.

  Imprimir es window.print(): @media print deja sólo la hoja, sin la barra
  del panel ni los botones, en A4.
-->
<style>
  :root { --selva: #225b38; --selva-clara: #9aba94; --terracota: #b86d4c; --terracota-osc: #9c5738; }
  .barra-doc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
  .barra-doc label { display: flex; gap: 6px; align-items: center; font-size: .85rem; }
  .barra-doc select { font: inherit; padding: 6px 8px; border: 1px solid var(--linea); border-radius: 8px; }
  .volver { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 7px 12px;
    background: var(--verde-claro); border-radius: 10px; color: var(--verde-osc); text-decoration: none;
    font-size: .88rem; font-weight: 600; }
  .vacio { text-align: center; color: var(--gris); padding: 30px 10px; }

  /* ── la hoja ── */
  .hoja-marco { overflow-x: auto; padding-bottom: 12px; }
  #hoja { box-sizing: border-box; width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff;
    color: #22301f; padding: 18mm 18mm 16mm; box-shadow: 0 2px 14px rgba(34,48,31,.18);
    font-family: Georgia, 'Times New Roman', serif; font-size: 11pt; line-height: 1.45;
    display: flex; flex-direction: column; position: relative; }
  #hoja .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12mm;
    border-bottom: 2.5pt solid var(--selva); padding-bottom: 6mm; }
  #hoja .cab img { height: 22mm; width: auto; }
  #hoja .cab .casa { text-align: right; font-family: system-ui, sans-serif; font-size: 9pt; color: #4b5a47; }
  #hoja .cab .casa b { color: var(--selva); font-size: 11pt; display: block; }
  #hoja h1 { font-size: 20pt; font-weight: normal; color: var(--selva); margin: 9mm 0 1mm; letter-spacing: .02em; }
  #hoja .ref { font-family: system-ui, sans-serif; font-size: 9pt; color: #6b7566; }
  #hoja .ref b { color: var(--terracota-osc); }
  #hoja .aviso-estado { margin: 6mm 0 0; padding: 3mm 4mm; border: 1.5pt solid var(--terracota);
    color: var(--terracota-osc); font-family: system-ui, sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; font-size: 10pt; text-align: center; }
  #hoja h2 { font-family: system-ui, sans-serif; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .12em;
    color: var(--terracota-osc); margin: 8mm 0 2.5mm; border-bottom: .6pt solid var(--selva-clara); padding-bottom: 1.2mm; }
  #hoja dl { display: grid; grid-template-columns: 42mm 1fr; gap: 1.8mm 6mm; margin: 0; }
  #hoja dt { color: #6b7566; font-family: system-ui, sans-serif; font-size: 9pt; padding-top: .6mm; }
  #hoja dd { margin: 0; }
  #hoja .fechas { display: grid; grid-template-columns: 1fr 1fr 28mm; gap: 5mm; }
  #hoja .fechas div { border: .8pt solid var(--selva-clara); border-radius: 2mm; padding: 3mm 4mm; }
  #hoja .fechas small { display: block; font-family: system-ui, sans-serif; font-size: 8pt; text-transform: uppercase;
    letter-spacing: .1em; color: var(--selva); }
  #hoja .fechas b { display: block; font-size: 12.5pt; font-weight: normal; margin-top: 1mm; }
  #hoja .fechas span { font-family: system-ui, sans-serif; font-size: 9pt; color: #4b5a47; }
  #hoja table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  #hoja td, #hoja th { padding: 1.6mm 0; border-bottom: .5pt solid #dde5da; text-align: left; }
  #hoja th { font-family: system-ui, sans-serif; font-size: 8.5pt; color: #6b7566; font-weight: 600; }
  #hoja td.n, #hoja th.n { text-align: right; }
  #hoja .pie { margin-top: auto; padding-top: 10mm; }
  #hoja .clausula { font-size: 8.5pt; line-height: 1.5; color: #4b5a47; border-top: .6pt solid var(--selva-clara);
    padding-top: 3mm; text-align: justify; }
  #hoja .web { margin-top: 3mm; display: flex; justify-content: space-between; font-family: system-ui, sans-serif;
    font-size: 8.5pt; color: var(--selva); }

  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
    body * { visibility: hidden !important; }
    #hoja, #hoja * { visibility: visible !important; }
    #hoja { position: absolute; left: 0; top: 0; margin: 0; box-shadow: none; width: 210mm; min-height: 297mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .hoja-marco { overflow: visible; }
    #hoja { zoom: 1 !important; }
  }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <div class="barra-doc" id="barra">
    <a class="volver" id="volver" href="./reservas.html"><span class="material-icons">arrow_back</span> Reservas</a>
    <label>Idioma
      <select id="idioma"><option value="es">Español</option><option value="pt">Português</option><option value="en">English</option></select></label>
    <label><input type="checkbox" id="importes"> Incluir importes</label>
    <button class="btn btn-primario" id="imprimir"><span class="material-icons">print</span> Imprimir / Guardar en PDF</button>
  </div>
  <div class="hoja-marco"><div id="todo"><div class="vacio">Cargando…</div></div></div>
  <p class="texto-gris" id="sello" style="font-size:.7rem;text-align:center;margin-top:18px;"></p>
</div>

<script type="module">
import { db, collection, query, where, getDocs, doc, getDoc } from './firebase-init.js';
import { CV2 } from './nucleo.js';

CV2.registrarSW();
const u = await CV2.verificarAuth();
CV2.renderNav('reservas');

const SELLO = 'comprobante-2';
const $ = (id) => document.getElementById(id);
const esc = CV2.esc;
$('sello').textContent = 'pantalla: ' + SELLO + ' · motor: ' + (CV2.VERSION ?? 'nucleo viejo');

const id = new URLSearchParams(location.search).get('r');
$('volver').href = id ? './reservas.html?r=' + encodeURIComponent(id) : './reservas.html';

// ═══ Los textos, en los tres idiomas de la casa ═══════════
const T = {
  es: { titulo: 'Comprobante de reserva', ref: 'Reserva', emitido: 'Emitido el', huesped: 'Huésped', nombre: 'Nombre',
        alojamiento: 'Alojamiento', cabana: 'Cabaña', estadia: 'Estadía', entrada: 'Entrada', salida: 'Salida', noches: 'Noches',
        desde: 'desde las', hasta: 'hasta las', estado: 'Estado', importes: 'Importes (informativos)', total: 'Valor del acuerdo',
        pagado: 'Pagos registrados', saldo: 'Saldo', airbnb: 'Reserva de Airbnb',
        estados: { presupuesto: 'Presupuesto: reserva NO confirmada', confirmada: 'Confirmada', finalizada: 'Finalizada', anulada: 'Reserva ANULADA' },
        clausula: 'Este documento sólo confirma los datos de la reserva y de la estadía. No es una factura ni un comprobante fiscal, no acredita pagos y no tiene valor tributario. Casa Verde no asume con él responsabilidad fiscal ni monetaria alguna. Los importes que figuren son informativos: valen los registros de pago y los documentos fiscales que correspondan, emitidos por separado.' },
  pt: { titulo: 'Comprovante de reserva', ref: 'Reserva', emitido: 'Emitido em', huesped: 'Hóspede', nombre: 'Nome',
        alojamiento: 'Hospedagem', cabana: 'Cabana', estadia: 'Estadia', entrada: 'Check-in', salida: 'Check-out', noches: 'Noites',
        desde: 'a partir das', hasta: 'até as', estado: 'Situação', importes: 'Valores (informativos)', total: 'Valor do acordo',
        pagado: 'Pagamentos registrados', saldo: 'Saldo', airbnb: 'Reserva do Airbnb',
        estados: { presupuesto: 'Orçamento: reserva NÃO confirmada', confirmada: 'Confirmada', finalizada: 'Finalizada', anulada: 'Reserva CANCELADA' },
        clausula: 'Este documento apenas confirma os dados da reserva e da estadia. Não é nota fiscal nem comprovante fiscal, não comprova pagamentos e não tem valor tributário. A Casa Verde não assume com ele nenhuma responsabilidade fiscal ou monetária. Os valores que constarem são informativos: valem os registros de pagamento e os documentos fiscais correspondentes, emitidos separadamente.' },
  en: { titulo: 'Booking confirmation', ref: 'Booking', emitido: 'Issued on', huesped: 'Guest', nombre: 'Name',
        alojamiento: 'Accommodation', cabana: 'Cabin', estadia: 'Stay', entrada: 'Check-in', salida: 'Check-out', noches: 'Nights',
        desde: 'from', hasta: 'until', estado: 'Status', importes: 'Amounts (for information only)', total: 'Agreed price',
        pagado: 'Payments recorded', saldo: 'Balance', airbnb: 'Airbnb booking',
        estados: { presupuesto: 'Quote: booking NOT confirmed', confirmada: 'Confirmed', finalizada: 'Completed', anulada: 'Booking CANCELLED' },
        clausula: 'This document only confirms the details of the booking and the stay. It is not an invoice or a tax document, it does not prove any payment and it has no tax value. Casa Verde assumes no tax or monetary liability through it. Any amounts shown are for information only: the payment records and the corresponding tax documents, issued separately, prevail.' },
};
const LOCALE = { es: 'es-UY', pt: 'pt-BR', en: 'en-US' };
const IDIOMA_DE_PAIS = { Brasil: 'pt', Brazil: 'pt', 'Estados Unidos': 'en', 'United States': 'en' };

let r = null, cliente = null, grupo = null, cabanas = [], hermanas = [], pagos = [];

const nombreCab = (cid, lang) => {
  const n = cabanas.find((c) => c.id === cid)?.nombre;
  return typeof n === 'object' ? (n[lang] ?? n.es ?? n.pt ?? cid) : (n ?? cid);
};
const noches = (x) => Math.max(0, Math.round((new Date(x.checkOut) - new Date(x.checkIn)) / 86400000));
const fechaLarga = (iso, lang) => iso ? new Date(iso + 'T12:00:00')
  .toLocaleDateString(LOCALE[lang], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '—';
const aporte = (p, mon) => Number(p.moneda === mon ? p.monto : (p.montoEquiv ?? p.montoBRL)) || 0;
const codigoAirbnb = () => (String(r.clienteNombre || '').match(/\bHM[A-Z0-9]{6,12}\b/) || [''])[0];
const nombreHuesped = () => cliente?.nombre || String(r.clienteNombre || '')
  .replace(/^Airbnb\s*·?\s*/i, '').replace(/\bHM[A-Z0-9]{6,12}\b/, '').trim();

async function cargar() {
  if (!id) { $('todo').innerHTML = '<div class="vacio">Falta qué reserva mostrar.</div>'; return false; }
  if (!CV2.puede('reservas')) {
    $('todo').innerHTML = '<div class="vacio">El comprobante es para quien atiende las reservas: tu cuenta no tiene ese permiso.</div>';
    return false;
  }
  const s = await getDoc(doc(db, 'reservas', id));
  if (!s.exists()) { $('todo').innerHTML = '<div class="vacio">Esa reserva no existe (¿se borró?).</div>'; return false; }
  r = { id: s.id, ...s.data() };
  const [sCab, sCli, sGr, sHerm, sPag] = await Promise.all([
    getDocs(collection(db, 'cabanas')),
    r.clienteId ? getDoc(doc(db, 'clientes', r.clienteId)) : null,
    r.grupoId ? getDoc(doc(db, 'grupos', r.grupoId)) : null,
    r.grupoId ? getDocs(query(collection(db, 'reservas'), where('grupoId', '==', r.grupoId))) : null,
    // Los mismos pagos que llegada.html: los del acuerdo, o los de la reserva si no tiene.
    r.grupoId ? getDocs(query(collection(db, 'pagos'), where('grupoId', '==', r.grupoId)))
              : getDocs(query(collection(db, 'pagos'), where('reservaId', '==', r.id))),
  ]);
  cabanas = sCab.docs.map((d) => ({ id: d.id, ...d.data() }));
  cliente = sCli && sCli.exists() ? { id: sCli.id, ...sCli.data() } : null;
  grupo = sGr && sGr.exists() ? sGr.data() : null;
  hermanas = sHerm ? sHerm.docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.id !== r.id && x.estado !== 'anulada') : [];
  pagos = sPag.docs.map((d) => ({ id: d.id, ...d.data() })).filter((p) => r.grupoId || !p.grupoId);
  let lang = r.contacto?.idioma || cliente?.idioma || IDIOMA_DE_PAIS[cliente?.pais] || 'es';
  if (!T[lang]) lang = 'es';
  $('idioma').value = lang;
  return true;
}

function pintar() {
  const lang = $('idioma').value, t = T[lang];
  document.documentElement.lang = lang;
  const todas = [r, ...hermanas];
  // La estadía del ACUERDO entero: de la primera entrada a la última salida.
  // Con cabañas en fechas distintas (Darío: 20→28 y 28→30), mostrar sólo las
  // de la reserva que se abrió diría una salida que no es la última.
  const entra = todas.reduce((m, x) => (x.checkIn < m.checkIn ? x : m), r);
  const sale = todas.reduce((m, x) => (x.checkOut > m.checkOut ? x : m), r);
  const rango = { checkIn: entra.checkIn, checkOut: sale.checkOut };
  const cod = codigoAirbnb();
  const mon = grupo?.moneda || r.moneda || 'BRL';
  const total = Number(grupo?.total ?? r.total ?? r.totalBRL ?? 0) || 0;
  const pagado = pagos.reduce((x, p) => x + aporte(p, mon), 0);
  const est = r.estado || 'confirmada';

  let h = `<div id="hoja">
    <div class="cab">
      <img src="./logo-sitio.png" alt="Casa Verde">
      <div class="casa"><b>Casa Verde</b>Canasvieiras · Florianópolis · SC · Brasil<br>casaverdecanas.com.br</div>
    </div>
    <h1>${esc(t.titulo)}</h1>
    <div class="ref">${esc(t.ref)} <b>${esc(cod || r.id)}</b>${cod ? ' · ' + esc(t.airbnb) : ''} · ${esc(t.emitido)} ${esc(fechaLarga(CV2.hoyISO(), lang))}</div>
    ${est === 'presupuesto' || est === 'anulada' ? `<div class="aviso-estado">${esc(t.estados[est])}</div>` : ''}

    <h2>${esc(t.huesped)}</h2>
    <dl>
      <dt>${esc(t.nombre)}</dt><dd>${esc(nombreHuesped() || '—')}</dd>
      <dt>${esc(t.estado)}</dt><dd>${esc(t.estados[est] || est)}</dd>
    </dl>

    <h2>${esc(t.estadia)}</h2>
    <div class="fechas">
      <div><small>${esc(t.entrada)}</small><b>${esc(fechaLarga(rango.checkIn, lang))}</b><span>${esc(t.desde)} ${esc(entra.horaEntrada || '14:00')}</span></div>
      <div><small>${esc(t.salida)}</small><b>${esc(fechaLarga(rango.checkOut, lang))}</b><span>${esc(t.hasta)} ${esc(sale.horaSalida || '10:00')}</span></div>
      <div><small>${esc(t.noches)}</small><b>${noches(rango)}</b></div>
    </div>

    <h2>${esc(t.alojamiento)}</h2>
    <table>
      <tr><th>${esc(t.cabana)}</th><th>${esc(t.entrada)}</th><th>${esc(t.salida)}</th><th class="n">${esc(t.noches)}</th></tr>
      ${todas.map((x) => `<tr><td>${esc(nombreCab(x.cabanaId, lang))}</td><td>${esc(CV2.fmtFecha(x.checkIn))}</td>
        <td>${esc(CV2.fmtFecha(x.checkOut))}</td><td class="n">${noches(x)}</td></tr>`).join('')}
    </table>

    ${$('importes').checked && total > 0 ? `<h2>${esc(t.importes)}</h2>
    <table>
      <tr><td>${esc(t.total)}</td><td class="n">${esc(CV2.fmtMonto(total, mon))}</td></tr>
      <tr><td>${esc(t.pagado)}</td><td class="n">${esc(CV2.fmtMonto(pagado, mon))}</td></tr>
      <tr><td><b>${esc(t.saldo)}</b></td><td class="n"><b>${esc(CV2.fmtMonto(Math.max(0, total - pagado), mon))}</b></td></tr>
    </table>` : ''}

    <div class="pie">
      <div class="clausula">${esc(t.clausula)}</div>
      <div class="web"><span>Casa Verde · Canasvieiras</span><span>casaverdecanas.com.br</span></div>
    </div>
  </div>`;
  $('todo').innerHTML = h;
  document.title = 'Casa Verde · ' + t.titulo + ' · ' + (nombreHuesped() || r.id);
  ajustar();
}

// En el teléfono la hoja A4 (210 mm) no entra: en pantalla se achica para que
// se vea entera; al imprimir vuelve a su tamaño (zoom: 1 en @media print).
function ajustar() {
  const h = $('hoja'); if (!h) return;
  h.style.zoom = '';
  const libre = $('todo').clientWidth;
  if (libre && h.offsetWidth > libre) h.style.zoom = String(libre / h.offsetWidth);
}

$('imprimir').onclick = () => window.print();
$('idioma').onchange = () => r && pintar();
$('importes').onchange = () => r && pintar();
addEventListener('resize', () => r && ajustar());

try { if (await cargar()) pintar(); }
catch (e) { $('todo').innerHTML = `<div class="vacio">${esc(CV2.explicar ? CV2.explicar(e) : (e.code ?? e.message))}</div>`; }
</script>
</body>
</html>
