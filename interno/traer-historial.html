  .opciones input { width: auto; margin-top: 3px; }
  .barra { height: 8px; background: #eef2ec; border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .barra > div { height: 100%; width: 0; background: var(--verde); transition: width .18s; }
  .listado { max-height: 260px; overflow-y: auto; border: 1px solid var(--linea); border-radius: 8px;
             padding: 8px 10px; margin-top: 8px; font-size: .82rem; }
  .listado div { padding: 3px 0; border-bottom: 1px dashed var(--linea); display: flex; gap: 8px; }
  .listado div:last-child { border-bottom: 0; }
  .listado span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--gris); }
  .nueva { color: var(--verde); font-weight: 600; }
  .malo2 { color: #b3261e; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap;
         max-height: 260px; overflow-y: auto; background: #1e1e1e; color: #cde9c2; border-radius: 8px; padding: 10px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <h1 style="margin-bottom:2px;">Traer el historial del sistema viejo</h1>
  <p class="texto-gris" style="font-size:.86rem;margin-top:0;">

    no duplica nada.
  </p>

  <div class="tarjeta">
    <h2>Lo que trae adentro</h2>
    <table class="tabla" id="tablaCarga"></table>
  </div>

  <div class="tarjeta">
    <h2>Cómo escribirlo</h2>
    <div class="opciones">
      <label><input type="checkbox" id="optSesiones" checked>
        <span><b>Sesiones</b> — el registro de realizaciones. Es lo que falta en el 2.0.</span></label>
      <label><input type="checkbox" id="optCrear" checked>
        <span><b>Crear</b> las actividades que no estén en el 2.0.</span></label>
      <label><input type="checkbox" id="optSincronizar" checked>
        <span><b>Poner al día</b> las que ya existen: última realización, quién la hizo y fecha de
          la próxima. Sin esto, el semáforo del 2.0 sigue mostrando fechas viejas.
          <b>Nunca retrocede:</b> si el 2.0 tiene una realización más nueva, no se toca.</span></label>
      <label><input type="checkbox" id="optTextos">
        <span>También sobrescribir título, detalle, días de repetición y prioridad
          (si los editaste en el 2.0, esto los revierte al viejo).</span></label>
    </div>
    <div class="acciones">
      <button class="btn btn-primario" id="btnPlan"><span class="material-icons">fact_check</span> Calcular el plan</button>
    </div>
    <div id="salidaPlan"></div>
  </div>

  <div class="tarjeta oculto" id="tarjetaEscribir">
    <h2>Escribir en la base</h2>
    <div class="acciones">
      <button class="btn btn-primario" id="btnEscribir"><span class="material-icons">cloud_upload</span> Escribir ahora</button>

    </div>
    <div class="barra oculto" id="barra"><div id="barraInt"></div></div>
    <div id="estado" class="texto-gris" style="font-size:.84rem;"></div>
    <div id="log" style="margin-top:10px;"></div>
  </div>
</div>

const log = [];
const anota = (l) => { log.push(l); const e = $('log'); e.textContent = log.join('\n'); e.scrollTop = e.scrollHeight; };
const progreso = (txt, pct) => {
  $('estado').textContent = txt || '';
  $('barra').classList.toggle('oculto', pct == null);
  if (pct != null) $('barraInt').style.width = Math.round(pct) + '%';
};
const clave = (s) => String(s ?? '')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/\s+/g, ' ').trim();

// {__t:"ISO"} → Timestamp; el resto pasa igual
function hidratar(v) {
  if (v === null || v === undefined || typeof v !== 'object') return v;
  if (v.__t) {
    const d = new Date(v.__t);
    return isNaN(d.getTime()) ? null : Timestamp.fromDate(d);
  }
  if (Array.isArray(v)) return v.map(hidratar);
  const o = {};
  for (const k in v) o[k] = hidratar(v[k]);
  return o;
}

async function traducirPersonas() {
  const porEmail = {}, porNombre = {};
  (await getDocs(collection(db, 'usuarios'))).forEach((d) => {
    const x = d.data();
    const reg = { uid: d.id, nombre: x.nombre ?? d.id };
    if (x.email) porEmail[String(x.email).toLowerCase()] = reg;
    if (x.nombre) porNombre[clave(x.nombre)] = reg;
  });
  mapaUid = {};
  sinTraducir = [];
  for (const [viejo, info] of Object.entries(USUARIOS_VIEJOS)) {
    const hallado = porEmail[info.email] ?? porNombre[clave(info.nombre)];
    if (hallado) mapaUid[viejo] = hallado;
    else sinTraducir.push(info.email || viejo);
  }
}

const traducir = (uidViejo, nombreViejo) => mapaUid[uidViejo] ?? { uid: uidViejo, nombre: nombreViejo || '—' };

$('tablaCarga').innerHTML = `
  <tr><td>Export del sistema viejo</td><td>${(RESUMEN.exportadoEn ?? '').slice(0, 10)}</td></tr>
  <tr><td>Actividades (el árbol completo)</td><td>${RESUMEN.actividades}</td></tr>
  <tr><td>De ésas, recurrentes</td><td>${RESUMEN.recurrentes}</td></tr>
  <tr><td>Sesiones (realizaciones)</td><td>${RESUMEN.sesiones}</td></tr>`;

let plan = null;

// ═══ Plan ═════════════════════════════════════════════════
$('btnPlan').addEventListener('click', async () => {
  $('btnPlan').disabled = true;
  $('salidaPlan').innerHTML = '';
  progreso('Leyendo el 2.0…', 25);
  try {
    const porId = {}, porTitulo = {};
    (await getDocs(collection(db, 'actividades'))).forEach((d) => {
      const x = { id: d.id, ...d.data() };
      porId[d.id] = x;
      const k = clave(x.titulo);
      if (k && !porTitulo[k]) porTitulo[k] = x;
    });
    // Doble red anti-duplicados: por ID y por huella (actividad + instante
    // de inicio). Si una importación anterior cambió los IDs, la huella la caza.
    const yaSes = new Set(), huellas = new Set();
    (await getDocs(collection(db, 'sesiones'))).forEach((d) => {
      yaSes.add(d.id);
      const x = d.data();
      const ms = x.inicio?.toMillis?.();
      if (x.actividadId && ms) huellas.add(x.actividadId + '|' + ms);
    });
    await traducirPersonas();
    progreso('Armando el plan…', 70);

    const p = { crear: [], sincronizar: [], enlazadas: [], sesiones: [],
                mapa: {}, omitidas: { yaEstaba: 0, sinActividad: 0, duplicada: 0 }, sinPadre: [] };

    for (const a of ACTIVIDADES) {
      const existente = porId[a.id] ?? porTitulo[clave(a.datos.titulo)];
      if (existente) {
        p.mapa[a.id] = existente.id;
        p.enlazadas.push({ titulo: a.datos.titulo, mismoId: existente.id === a.id });
        const cambios = {};
        // Poner al día SOLO si el viejo tiene un dato y es más reciente que
        // el del 2.0. Antes se copiaba siempre, y sobre una actividad que
        // ya se hizo en el 2.0 —o sobre un proyecto, que nunca tiene
        // realización— eso pisaba con null y borraba trabajo bueno.
        if ($('optSincronizar').checked) {
          const nueva = a.datos.ultimaRealizacion;
          const actual = existente.ultimaRealizacion ?? null;
          if (nueva && (!actual || nueva > actual)) {
            cambios.ultimaRealizacion = nueva;
            cambios.ultimaRealizacionNombre = a.datos.ultimaRealizacionNombre;
            cambios.ultimaRealizacionConCrono = a.datos.ultimaRealizacionConCrono;
            if (a.datos.ultimoCierreEn) cambios.ultimoCierreEn = a.datos.ultimoCierreEn;
            if (a.datos.fechaInicio) cambios.fechaInicio = a.datos.fechaInicio;
          }
        }
        if ($('optTextos').checked) {
          cambios.titulo = a.datos.titulo;
          cambios.detalle = a.datos.detalle;
          cambios.recurrenciaDias = a.datos.recurrenciaDias;
          cambios.prioridad = a.datos.prioridad;
        }
        if (Object.keys(cambios).length) {
          p.sincronizar.push({ id: existente.id, titulo: a.datos.titulo, datos: cambios });
        }
      } else if ($('optCrear').checked) {
        p.mapa[a.id] = a.id;
        const datos = { ...a.datos, creadoPor: traducir(a.datos.creadoPor, '').uid };
        if (datos.parentId && !porId[datos.parentId]) {
          p.sinPadre.push(datos.titulo);           // el proyecto no está en el 2.0
        }
        p.crear.push({ id: a.id, titulo: datos.titulo, datos });
      }
    }

    if ($('optSesiones').checked) {
      for (const s of SESIONES) {
        const nid = p.mapa[s.datos.actividadId] ?? (porId[s.datos.actividadId] ? s.datos.actividadId : null);
        if (!nid) { p.omitidas.sinActividad++; continue; }
        if (yaSes.has(s.id)) { p.omitidas.yaEstaba++; continue; }
        const ms = s.datos.inicio?.__t ? new Date(s.datos.inicio.__t).getTime() : null;
        if (ms && huellas.has(nid + '|' + ms)) { p.omitidas.duplicada++; continue; }
        const titulo = porId[nid]?.titulo ?? s.datos.actividadTitulo;
        const quien = traducir(s.datos.uid, s.datos.nombre);
        p.sesiones.push({ id: s.id, datos: {
          ...s.datos, actividadId: nid, actividadTitulo: titulo,
          uid: quien.uid, nombre: quien.nombre,
          uidViejo: s.datos.uid,
          creadoPor: traducir(s.datos.creadoPor, '').uid
        } });
      }
    }

    plan = p;
    const total = p.crear.length + p.sincronizar.length + p.sesiones.length;

    const lista = (arr, clase, txt) => arr.length
      ? `<div class="listado">${arr.map((a) => `<div class="${clase}">${txt(a)}</div>`).join('')}</div>` : '';

    $('salidaPlan').innerHTML = `
      <table class="tabla">
        <tr><td>Recurrentes a crear</td><td>${p.crear.length}</td></tr>
        <tr><td>Ya existen en el 2.0</td><td>${p.enlazadas.length}</td></tr>
        <tr><td>De ésas, a poner al día</td><td>${p.sincronizar.length}</td></tr>
        <tr><td>Sesiones a escribir</td><td>${p.sesiones.length}</td></tr>
        <tr><td>Sesiones ya importadas antes</td><td>${p.omitidas.yaEstaba}</td></tr>
        <tr><td>Duplicadas evitadas por huella</td><td>${p.omitidas.duplicada}</td></tr>
        <tr><td>Sesiones sin actividad que las reciba</td><td>${p.omitidas.sinActividad}</td></tr>
        <tr><td><b>Total de escrituras</b></td><td>${total}</td></tr>
      </table>
      ${lista(p.crear, 'nueva', (a) => '<span>+ ' + esc(a.titulo) + '</span>')}
      ${lista(p.sincronizar, '', (a) => '<span>' + esc(a.titulo) + '</span><span>' + esc(a.datos.ultimaRealizacion ?? '—') + '</span>')}
      <p style="margin-top:14px;font-size:.86rem;font-weight:600;">Personas: viejo → 2.0</p>
      <div class="listado">${Object.entries(mapaUid).map(([v, n]) =>
        `<div><span>${esc(USUARIOS_VIEJOS[v].email)}</span><span>→ ${esc(n.nombre)}</span></div>`).join('')}</div>
      ${sinTraducir.length ? `<div class="aviso">Sin equivalente en el 2.0: ${esc(sinTraducir.join(', '))}. Si alguna sesión es de esas personas, va a quedar con el uid viejo y no la va a contar Horas. Creá el usuario con ese mismo email y volvé a calcular.</div>` : ''}
      ${p.sinPadre.length ? `<div class="aviso">${p.sinPadre.length} actividades apuntan a un proyecto que no está en el 2.0. Se van a crear igual, pero no aparecerán en el árbol hasta que las metas en un proyecto: ${esc(p.sinPadre.join(', '))}</div>` : ''}
      ${p.omitidas.sinActividad ? `<div class="aviso">${p.omitidas.sinActividad} sesiones apuntan a una actividad que no existe ni acá ni en el 2.0. Marcá “Crear” y volvé a calcular.</div>` : ''}
      ${total === 0 ? '<div class="aviso bien">No hay nada nuevo para escribir: el 2.0 ya está al día.</div>' : ''}`;

    $('tarjetaEscribir').classList.toggle('oculto', total === 0);
    progreso('', null);
  } catch (e) {
    $('salidaPlan').innerHTML = `<div class="aviso malo">No se pudo armar el plan: ${esc(e.code ?? e.message)}</div>`;
    progreso('', null);
  } finally {
    $('btnPlan').disabled = false;
  }
});

// ═══ Escribir ═════════════════════════════════════════════
$('btnEscribir').addEventListener('click', async () => {
  if (!plan) { CV2.toast('Calculá el plan primero', 'error'); return; }
  const total = plan.crear.length + plan.sincronizar.length + plan.sesiones.length;
  if (!confirm(`Se escriben ${total} documentos:\n\n${plan.crear.length} actividades nuevas\n${plan.sincronizar.length} actividades puestas al día\n${plan.sesiones.length} sesiones\n\n¿Seguimos?`)) return;

  $('btnEscribir').disabled = true;
  anota('── ' + new Date().toISOString());
  let hechas = 0, fallas = 0;
  const paso = () => { hechas++; progreso(`Escribiendo… ${hechas} de ${total}`, (hechas / Math.max(1, total)) * 100); };

  try {
    for (const a of plan.crear) {
      try {
        await setDoc(doc(db, 'actividades', a.id), {
          ...hidratar(a.datos),
          actualizadoEn: serverTimestamp(),
          migradoEn: serverTimestamp()
        }, { merge: true });
      } catch (e) { fallas++; anota(`✗ actividad ${a.titulo}: ${e.code ?? e.message}`); }
      paso();
    }
    if (plan.crear.length) anota(`✓ creadas: ${plan.crear.length}`);

    for (const a of plan.sincronizar) {
      try {
        await updateDoc(doc(db, 'actividades', a.id), {
          ...hidratar(a.datos),
          actualizadoEn: serverTimestamp()
        });
      } catch (e) { fallas++; anota(`✗ al día ${a.titulo}: ${e.code ?? e.message}`); }
      paso();
    }
    if (plan.sincronizar.length) anota(`✓ puestas al día: ${plan.sincronizar.length}`);

    for (const s of plan.sesiones) {
      try {
        await setDoc(doc(db, 'sesiones', s.id), {
          ...hidratar(s.datos),
          actualizadoEn: serverTimestamp()
        }, { merge: true });
      } catch (e) { fallas++; anota(`✗ sesión ${s.id}: ${e.code ?? e.message}`); }
      paso();
    }
    anota(`✓ sesiones: ${plan.sesiones.length}`);

    progreso('', null);
    anota(`── Fin: ${hechas - fallas} escritos, ${fallas} con error`);
    $('salidaPlan').innerHTML += fallas
      ? `<div class="aviso malo">${fallas} errores. Volvé a correr: lo que entró no se duplica.</div>`
      : `<div class="aviso bien">Listo. Abrí <b>Verificar la migración</b> para confirmar que están las ${RESUMEN.sesiones} sesiones.</div>`;
    CV2.toast(fallas ? 'Terminó con errores' : 'Historial importado', fallas ? 'error' : 'success');
    plan = null;
  } catch (e) {
    anota('✗ cortó: ' + (e.code ?? e.message));
    CV2.toast('Se cortó: ' + (e.code ?? e.message), 'error');
    progreso('', null);
  } finally {
    $('btnEscribir').disabled = false;
  }
});

$('btnLog').addEventListener('click', () => {
  const blob = new Blob([log.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'historial-importado-' + new Date().toISOString().slice(0, 10) + '.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
});
</script>
</body>
</html>
