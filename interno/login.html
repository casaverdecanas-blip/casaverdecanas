<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Ingresar</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  body { display: grid; place-items: center; min-height: 100dvh; }
  .login-card { width: min(380px, 92vw); }
  .logo { text-align: center; font-size: 2.2rem; margin-bottom: 4px; }
  .titulo { text-align: center; margin: 0 0 18px; }
  .titulo b { color: var(--verde); }
  .error { color: var(--rojo); font-size: .85rem; min-height: 1.2em; margin-top: 10px; text-align: center; }
</style>
</head>
<body>

<div class="card login-card">
  <div class="logo">🌿</div>
  <h1 class="titulo">CasaVerde <b>2.0</b></h1>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" inputmode="email">

  <label for="clave">Contraseña</label>
  <input id="clave" type="password" autocomplete="current-password">

  <div style="margin-top:16px;">
    <button id="btnEntrar" class="btn btn-primario" style="width:100%;justify-content:center;">
      <span class="material-icons">login</span> Entrar
    </button>
  </div>

  <div id="error" class="error"></div>
  <p class="texto-gris" style="text-align:center;margin-top:14px;">
    <a href="#" id="olvide">Olvidé mi contraseña</a>
    <span style="opacity:.4;margin:0 6px;">·</span>
    <a href="#" id="reparar">La app no abre</a>
  </p>
</div>

<script type="module">
import { auth, signInWithEmailAndPassword, sendPasswordResetEmail } from './firebase-init.js';
import { CV2 } from './nucleo.js';

CV2.registrarSW();

const $ = (id) => document.getElementById(id);

// Por qué te devolvió el panel. Cada motivo dice qué pasó Y a quién
// reclamarle: un rebote mudo no se diagnostica desde un teléfono.
// 'sesion' no se avisa: es simplemente que todavía no entraste.
const aviso = new URLSearchParams(location.search).get('e') || '';
const MOTIVOS = {
  inactivo: 'Tu usuario está desactivado. Hablá con el administrador.',
  sinperfil: 'Tu cuenta existe pero todavía no está dada de alta en el sistema. Pedile al administrador que te cree el perfil.',
  trancado: 'El panel no pudo leer tu perfil (algo quedó trancado en este teléfono). Probá "La app no abre", acá abajo.',
  // El arranque tiene que bajar el SDK de Firebase, que viene de Google y NO
  // queda guardado en el teléfono. Sin señal, la app abre y se queda
  // esperando. Este mensaje manda a mirar la conexión ANTES que a reparar:
  // reparar borra lo guardado y no arregla nada si lo que falta es internet.
  sinred: 'La app no pudo terminar de abrir. Suele ser falta de señal: revisá la conexión y volvé a entrar. Si tenés señal y se repite, probá "La app no abre".',
  reparada: 'Listo, quedó limpio. Entrá de nuevo.'
};
if (MOTIVOS[aviso]) $('error').textContent = MOTIVOS[aviso];
else if (aviso.indexOf('error:') === 0) {
  $('error').textContent = 'Hubo un error al verificar tu sesión (' + aviso.slice(6) + '). Si se repite, probá "La app no abre".';
}

async function entrar() {
  const email = $('email').value.trim();
  const clave = $('clave').value;
  if (!email || !clave) { $('error').textContent = 'Completá email y contraseña.'; return; }
  $('btnEntrar').disabled = true;
  $('error').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, clave);
    // replace, no href: si entrar dejara login en el historial, el botón
    // Atrás de Android volvería acá con la sesión ya abierta.
    location.replace('./index.html');
  } catch (e) {
    $('error').textContent = 'No se pudo ingresar. Revisá email y contraseña.';
    $('btnEntrar').disabled = false;
  }
}

$('btnEntrar').addEventListener('click', entrar);
$('clave').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') entrar(); });

// Salida de emergencia. Vive acá porque cuando el panel no abre, la hoja
// de cuenta —donde está el mismo botón— es justamente lo que no se alcanza.
$('reparar').addEventListener('click', async (ev) => {
  ev.preventDefault();
  if (!confirm('Esto borra lo que la app guardó en ESTE teléfono (cachés y sesión) y te pide entrar de nuevo.\n\nNo se toca nada del servidor: ni datos, ni fotos, ni usuarios.\n\n¿Seguimos?')) return;
  $('error').textContent = 'Reparando…';
  await CV2.repararApp((m) => { $('error').textContent = m; });
  location.replace('./login.html?e=reparada');
});

$('olvide').addEventListener('click', async (ev) => {
  ev.preventDefault();
  const email = $('email').value.trim();
  if (!email) { $('error').textContent = 'Escribí tu email arriba y volvé a tocar.'; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    $('error').textContent = 'Listo: revisá tu correo para restablecerla.';
  } catch (e) {
    $('error').textContent = 'No se pudo enviar el correo de restablecimiento.';
  }
});
</script>
</body>
</html>
