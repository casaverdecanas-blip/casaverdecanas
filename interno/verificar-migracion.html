<meta name="theme-color" content="#2d5a27">
<style>
  .marcador { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  .m { flex:1 1 130px; background:#fff; border:1px solid var(--linea);
       border-radius:var(--radio); box-shadow:var(--sombra); padding:12px 14px; }
  .m .n { font-size:1.7rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .m .r { font-size:.78rem; color:var(--gris); }
  .m.bien .n { color:var(--ok); }
  .m.mal .n { color:var(--rojo); }
  .m.tibio .n { color:var(--amarillo); }

  .veredicto { border-radius:var(--radio); padding:16px 18px; margin:14px 0;
               font-size:1rem; font-weight:600; }
  .veredicto.bien { background:#e7f4e4; color:#1f7a32; border:1px solid #bfe0b8; }
  .veredicto.mal { background:#fbe3e0; color:#9c3025; border:1px solid #f0c2bc; }
  .veredicto small { display:block; font-weight:400; font-size:.86rem; margin-top:5px; }

  details { background:#fff; border:1px solid var(--linea); border-radius:var(--radio);
            box-shadow:var(--sombra); margin-bottom:10px; }
  summary { padding:13px 16px; cursor:pointer; font-weight:600; font-size:.94rem;
            min-height:48px; display:flex; align-items:center; gap:8px; }
  summary .cuenta { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--gris);
                    font-weight:400; }
  .lista { padding:0 16px 14px; }
  .fila { border-top:1px solid var(--linea); padding:9px 0; font-size:.87rem; }
  .fila b { display:block; }
  .fila span { color:var(--gris); font-size:.8rem; }
  .idcorto { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.74rem;
             color:var(--gris); }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--linea); }
  th { font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--gris); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dif { color:var(--rojo); font-weight:700; }
</style>
</head>

<div id="nav"></div>

<div class="contenedor">

</div>

//      la huella las caza igual y evita el falso "falta".
//
//  Las personas se comparan por MAIL, no por uid: son dos proyectos

//

//  pueda mirar, no para alarmar.
// ═══════════════════════════════════════════════════════════

import { CV2 } from './nucleo.js';

CV2.renderNav('');

    + 'el administrador.</div>';
  $('btnCopiar').remove();
  throw new Error('sin-permiso');
}

$('fechaExport').textContent = VIEJO.exportadoEn.slice(0, 10).split('-').reverse().join('/');

const norma = (t) => (t || '').toString().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const msDe = (v) => {
  if (!v) return 0;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (typeof v === 'string') return new Date(v).getTime() || 0;
  return 0;
};
const huella = (actividadId, ms) => actividadId + '|' + ms;

let informe = '';

async function verificar() {
  // ── Traer la base nueva ──────────────────────────────────
  const [snapSes, snapAct, snapUsu] = await Promise.all([
    getDocs(collection(db, 'sesiones')),
    getDocs(collection(db, 'actividades')),
    getDocs(collection(db, 'usuarios'))
  ]);

  const mailPorUid = {};
  snapUsu.forEach((d) => { mailPorUid[d.id] = (d.data().email || '').toLowerCase(); });

  const nuevas = [];
  snapSes.forEach((d) => {
    const x = d.data();
    nuevas.push({
      id: d.id,
      actividadId: x.actividadId || '',
      actividadNombre: x.actividadNombre || '',
      ms: msDe(x.inicio),
      horas: Number(x.horas || 0),
      mail: mailPorUid[x.uid] || '',
      estado: x.estado || ''
    });
  });

  const porId = new Map(nuevas.map((s) => [s.id, s]));
  const porHuella = new Map();
  nuevas.forEach((s) => {
    const h = huella(s.actividadId, s.ms);
    if (!porHuella.has(h)) porHuella.set(h, []);
    porHuella.get(h).push(s);
  });

  const actNuevas = new Map();
  snapAct.forEach((d) => {
    const x = d.data();
    actNuevas.set(d.id, (x.titulo || x.nombre || '').toString());
  });
  const titulosNuevos = new Set([...actNuevas.values()].map(norma));

  // ── Sesiones: buscar una por una ─────────────────────────
  const faltan = [];
  const porHuellaSolo = [];
  const difHoras = [];
  const usadas = new Set();

  VIEJO.sesiones.forEach((v) => {
    const ms = new Date(v.i).getTime() || 0;
    let hallada = porId.get(v.id) || null;

    if (!hallada) {
      const cands = (porHuella.get(huella(v.a, ms)) || []).filter((s) => !usadas.has(s.id));
      if (cands.length) { hallada = cands[0]; porHuellaSolo.push({ v, n: hallada }); }
    }
    if (!hallada) { faltan.push(v); return; }

    usadas.add(hallada.id);
    if (Math.abs(hallada.horas - v.h) > 0.011) difHoras.push({ v, n: hallada });
  });

  const sobran = nuevas.filter((s) => !usadas.has(s.id));

  // ── Actividades ──────────────────────────────────────────
  const actFaltan = VIEJO.actividades.filter(
    (a) => !actNuevas.has(a.id) && !titulosNuevos.has(norma(a.t))
  );
  const actPorTitulo = VIEJO.actividades.filter(
    (a) => !actNuevas.has(a.id) && titulosNuevos.has(norma(a.t))
  );

  // ── Horas por persona ────────────────────────────────────
  const horas = {};
  const suma = (mail, campo, h) => {
    const m = mail || '(sin mail)';
    horas[m] = horas[m] || { viejo: 0, nuevo: 0, nViejo: 0, nNuevo: 0 };
    horas[m][campo] += h;
    horas[m][campo === 'viejo' ? 'nViejo' : 'nNuevo'] += 1;
  };
  VIEJO.sesiones.forEach((v) => suma(v.e, 'viejo', v.h));
  nuevas.forEach((s) => suma(s.mail, 'nuevo', s.horas));

  pintar({ faltan, porHuellaSolo, difHoras, sobran, actFaltan, actPorTitulo, horas,
           totalNuevas: nuevas.length, totalAct: actNuevas.size });
}

function pintar(r) {
  const okSesiones = r.faltan.length === 0;
  const okActs = r.actFaltan.length === 0;
  const todoBien = okSesiones && okActs && r.difHoras.length === 0;

  $('veredicto').innerHTML = todoBien
    ? '<div class="veredicto bien">✓ Está todo. Las ' + VIEJO.sesiones.length
      + ' sesiones y las ' + VIEJO.actividades.length + ' actividades del sistema viejo '
      + 'están en el 2.0, con las mismas horas.'
      + '<small>Podés hacer el corte de dominio cuando quieras.</small></div>'
    : '<div class="veredicto mal">Falta revisar algo antes del corte.'
      + '<small>Mirá los apartados de abajo. Mientras haya faltantes, no muevas el '
      + 'dominio: el panel viejo desaparece con él.</small></div>';

  const marca = (n, rot, clase) =>
    '<div class="m ' + clase + '"><div class="n">' + n + '</div><div class="r">'
    + esc(rot) + '</div></div>';

  $('marcador').innerHTML =
      marca(VIEJO.sesiones.length - r.faltan.length + '/' + VIEJO.sesiones.length,
            'sesiones encontradas', r.faltan.length ? 'mal' : 'bien')
    + marca(VIEJO.actividades.length - r.actFaltan.length + '/' + VIEJO.actividades.length,
            'actividades encontradas', r.actFaltan.length ? 'mal' : 'bien')
    + marca(r.difHoras.length, 'horas que no coinciden', r.difHoras.length ? 'mal' : 'bien')
    + marca(r.sobran.length, 'sesiones solo en el 2.0', 'tibio');

  const fila = (t, s) => '<div class="fila"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></div>';
  const fecha = (iso) => new Date(iso).toLocaleString('es-AR',
    { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  const bloque = (titulo, n, cuerpo, abierto) =>
    '<details' + (abierto ? ' open' : '') + '><summary>' + esc(titulo)
    + '<span class="cuenta">' + n + '</span></summary><div class="lista">' + cuerpo
    + '</div></details>';

  let html = '';

  if (r.faltan.length) {
    html += bloque('Sesiones que NO están en el 2.0', r.faltan.length,
      r.faltan.map((v) => fila(v.an || '(sin actividad)',
        fecha(v.i) + ' · ' + v.h.toFixed(2) + ' h · ' + v.e
        + ' · id ' + v.id)).join(''), true);
  }

  if (r.difHoras.length) {
    html += bloque('Sesiones con horas distintas', r.difHoras.length,
      r.difHoras.map((p) => fila(p.v.an,
        fecha(p.v.i) + ' · viejo ' + p.v.h.toFixed(2) + ' h · nuevo '
        + p.n.horas.toFixed(2) + ' h')).join(''), true);
  }

  if (r.actFaltan.length) {
    html += bloque('Actividades que NO están en el 2.0', r.actFaltan.length,
      r.actFaltan.map((a) => fila(a.t || '(sin título)', 'id ' + a.id)).join(''), true);
  }

  if (r.porHuellaSolo.length) {
    html += bloque('Sesiones halladas por huella, con otro ID', r.porHuellaSolo.length,
      '<p class="texto-gris" style="font-size:.84rem;">Están, pero con un identificador '
      + 'distinto al del sistema viejo. No se perdió nada; solo significa que alguna '
      + 'importación no conservó el ID original.</p>'
      + r.porHuellaSolo.map((p) => fila(p.v.an,
        fecha(p.v.i) + ' · viejo ' + p.v.id + ' → nuevo ' + p.n.id)).join(''));
  }

  if (r.actPorTitulo.length) {
    html += bloque('Actividades halladas por título, con otro ID', r.actPorTitulo.length,
      r.actPorTitulo.map((a) => fila(a.t, 'id viejo ' + a.id)).join(''));
  }

  if (r.sobran.length) {
    html += bloque('Sesiones que existen solo en el 2.0', r.sobran.length,
      '<p class="texto-gris" style="font-size:.84rem;">Esto es lo esperable: es el '
      + 'trabajo cargado en el sistema nuevo después de la migración.</p>'
      + r.sobran.map((s) => fila(s.actividadNombre || '(sin actividad)',
        (s.ms ? fecha(new Date(s.ms).toISOString()) : 'sin fecha')
        + ' · ' + s.horas.toFixed(2) + ' h · ' + (s.mail || 'sin mail'))).join(''));
  }

  // Horas por persona
  const mails = Object.keys(r.horas).sort();
  html += bloque('Horas por persona', mails.length,
    '<table><tr><th>Persona</th><th class="num">Viejo</th><th class="num">2.0</th>'
    + '<th class="num">Sesiones</th></tr>'
    + mails.map((m) => {
        const h = r.horas[m];
        const dist = Math.abs(h.viejo - h.nuevo) > 0.011;
        return '<tr><td>' + esc(m) + '</td>'
          + '<td class="num">' + h.viejo.toFixed(2) + '</td>'
          + '<td class="num' + (dist ? ' dif' : '') + '">' + h.nuevo.toFixed(2) + '</td>'
          + '<td class="num">' + h.nViejo + ' → ' + h.nNuevo + '</td></tr>';
      }).join('')
    + '</table>'
    + '<p class="texto-gris" style="font-size:.82rem;margin-top:10px;">Las horas del 2.0 '
    + 'pueden ser MÁS que las del viejo: incluyen lo trabajado después de migrar. Lo que '
    + 'no puede pasar es que sean menos.</p>', true);

  $('detalle').innerHTML = html;

  // Informe en texto plano, para guardar o mandar
  informe = [
    'VERIFICACIÓN DE MIGRACIÓN — ' + new Date().toLocaleString('es-AR'),
    'Export del sistema viejo: ' + VIEJO.exportadoEn,
    '',
    'Sesiones esperadas: ' + VIEJO.sesiones.length,
    'Sesiones encontradas: ' + (VIEJO.sesiones.length - r.faltan.length),
    'Sesiones que faltan: ' + r.faltan.length,
    'Horas que no coinciden: ' + r.difHoras.length,
    'Actividades esperadas: ' + VIEJO.actividades.length + ' · faltan ' + r.actFaltan.length,
    'Sesiones solo en el 2.0: ' + r.sobran.length,
    '',
    ...r.faltan.map((v) => 'FALTA · ' + v.an + ' · ' + v.i + ' · ' + v.h + ' h · ' + v.e),
    ...r.difHoras.map((p) => 'HORAS · ' + p.v.an + ' · viejo ' + p.v.h + ' → nuevo ' + p.n.horas),
    ...r.actFaltan.map((a) => 'ACTIVIDAD FALTA · ' + a.t + ' · ' + a.id)
  ].join('\n');
}

$('btnCopiar').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(informe);
    CV2.toast('Informe copiado', 'success');
  } catch (e) {
    CV2.toast('No se pudo copiar', 'error');
  }
});

try {
  await verificar();
} catch (e) {
  console.error(e);
  $('veredicto').innerHTML = '<div class="veredicto mal">No se pudo leer la base ('
    + esc(e.code || e.message) + ').</div>';
}
</script>
</body>
</html>
