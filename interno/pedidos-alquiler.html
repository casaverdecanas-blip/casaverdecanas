<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Pedidos de alquiler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  /* pedidos-alquiler-1 (18-oct-2026). Mauro: «un registro de todas las
     notificaciones que se relacionen a alquiler en Canasvieiras con el texto
     de la publicación y el link para acceder directamente a hacer un
     comentario. Listadas por fecha … para que Florencia y otro usuario
     logueado llegue a ver». Lo carga el agente (datos/herramientas/
     facebook.mjs) desde lo que lee la Pizarra del Redmi 13C.
     pedidos-alquiler-2 (18-oct-2026). Mauro: «simplificar y no tener que
     escrolear… llegar lo más directamente posible al mensaje en cuestión a
     responder». Arriba, cuántos hay; primero los que ya tienen la respuesta;
     el texto en cuatro renglones (un toque lo abre); y UN botón, «Copiar y
     abrir», que copia la respuesta y abre la publicación. Publicar lo hace
     la persona, en Facebook: eso es lo que no hace bloquear la cuenta. */
  .cuenta { display: flex; gap: 10px; margin: 4px 0 10px; }
  .cuenta div { flex: 1; background: #fff; border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 10px 12px; text-align: center; }
  .cuenta b { display: block; font-size: 1.6rem; color: var(--verde); line-height: 1.1; }
  .cuenta small { color: var(--gris); font-size: .76rem; }
  .ped-texto.corto { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer; }
  .ped-pregunta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;
    font-size: .86rem; }
  .ped-espera { font-size: .8rem; color: var(--gris); margin: 6px 0 0; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
  .filtros button { min-height: 40px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--linea); background: #fff; font: inherit; cursor: pointer; }
  .filtros button.activo { background: var(--verde); border-color: var(--verde); color: #fff; }
  .dia { margin: 16px 0 6px; font-size: .8rem; font-weight: 700; color: var(--gris);
    text-transform: uppercase; letter-spacing: .03em; }
  .ped { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 12px 14px; margin: 8px 0; box-shadow: var(--sombra); }
  .ped.atendido { opacity: .65; }
  .ped-cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ped-cab b { font-size: .92rem; overflow-wrap: anywhere; }
  .ped-cab small { color: var(--gris); font-size: .78rem; flex: 0 0 auto; }
  .ped-texto { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .9rem;
    line-height: 1.45; margin: 8px 0; }
  .ped-resp { background: var(--verde-claro); border-radius: 10px; padding: 9px 11px;
    font-size: .86rem; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
  .ped-resp b { display: block; font-size: .76rem; margin-bottom: 3px; }
  .ped-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .ped-acc .btn { min-height: 44px; }
  .ped-quien { font-size: .76rem; color: var(--gris); margin-top: 6px; }
  .vacio { text-align: center; color: var(--gris); padding: 28px 10px; }
  .nota { color: var(--gris); font-size: .82rem; margin: -4px 0 8px; }
</style>
</head>
<body>

<div id="nav"></div>

<div class="contenedor">
  <h1>Pedidos de alquiler</h1>
  <div class="cuenta" id="cuenta"></div>
  <p class="nota">«Copiar y abrir» copia la respuesta de Claude y abre la publicación: en Facebook,
    Comentar → mantener apretado → Pegar. En el Redmi 13C es más corto todavía: el aviso de la Pizarra
    hace lo mismo y abre la publicación exacta.
    <br><small id="sello" style="font-size:.72rem;"></small></p>

  <div class="filtros" id="filtros">
    <button data-f="nuevo" class="activo">Por responder</button>
    <button data-f="todos">Todos</button>
  </div>

  <div id="lista"><p class="vacio">Cargando…</p></div>
</div>

<script type="module">
// Regla del 2.0 (§3.2): definiciones primero, cargas y suscripciones AL FINAL.
import {
  db, collection, doc, query, orderBy, limit, onSnapshot, updateDoc, serverTimestamp
} from './firebase-init.js';
import { CV2 } from './nucleo.js';

CV2.registrarSW();
const u = await CV2.verificarAuth();
CV2.renderNav('pedidos-alquiler');

const $ = (id) => document.getElementById(id);
const esc = CV2.esc;
let filtro = 'nuevo';
let pedidos = [];

const ESTADOS = { nuevo: 'Por responder', respondido: 'Respondido', descartado: 'Descartado' };

function diaDe(ms) {
  if (!ms) return 'Sin fecha';
  return new Date(ms).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
}
function horaDe(ms) {
  return ms ? new Date(ms).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) : '';
}

const sinAtender = (p) => (p.estado || 'nuevo') === 'nuevo';
const destino = (p) => p.enlace || p.buscar || '';
let preguntando = '';   // el pedido que se abrió con «Copiar y abrir» y espera el «¿la publicaste?»

function pintarCuenta() {
  const nuevos = pedidos.filter(sinAtender);
  const listos = nuevos.filter((p) => p.respuesta).length;
  $('cuenta').innerHTML = '<div><b>' + nuevos.length + '</b><small>por responder</small></div>'
    + '<div><b>' + listos + '</b><small>con la respuesta lista</small></div>';
}

function tarjeta(p) {
  const estado = p.estado || 'nuevo';
  const id = esc(p.id);
  let acc = '';
  if (estado === 'nuevo') {
    acc = (p.respuesta
        ? '<button class="btn btn-primario" data-abrir="' + id + '"><span class="material-icons">content_copy</span>Copiar y abrir</button>'
        : (destino(p) ? '<a class="btn" href="' + esc(destino(p)) + '" target="_blank" rel="noopener"><span class="material-icons">open_in_new</span>Abrir en Facebook</a>' : ''))
      + '<button class="btn" data-estado="descartado" data-id="' + id + '">Descartar</button>';
  } else {
    acc = '<button class="btn" data-estado="nuevo" data-id="' + id + '">Volver a por responder</button>';
  }
  return '<div class="ped ' + (estado !== 'nuevo' ? 'atendido' : '') + '">'
    + '<div class="ped-cab"><b>' + esc(p.grupo || 'Grupo sin nombre') + '</b>'
    + '<small>' + esc(diaCorto(p.cuando)) + '</small></div>'
    + '<div class="ped-texto corto" data-abre>' + esc(p.texto || '') + '</div>'
    + (p.respuesta ? '<div class="ped-resp"><b>Respuesta de Claude</b>' + esc(p.respuesta) + '</div>'
        : (estado === 'nuevo' ? '<p class="ped-espera">La respuesta la prepara Claude en la próxima ronda.</p>' : ''))
    + (preguntando === p.id && estado === 'nuevo'
        ? '<div class="ped-pregunta">¿La publicaste?'
          + '<button class="btn btn-primario" data-estado="respondido" data-id="' + id + '">Sí, respondido</button>'
          + '<button class="btn" data-todavia>Todavía no</button></div>'
        : '<div class="ped-acc">' + acc + '</div>')
    + (estado !== 'nuevo' ? '<div class="ped-quien">' + esc(ESTADOS[estado] || estado)
        + (p.atendidoPor ? ' por ' + esc(p.atendidoPor) : '') + '</div>' : '')
    + '</div>';
}

function diaCorto(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  const hoy = new Date();
  return (d.toDateString() === hoy.toDateString() ? 'hoy' : d.toLocaleDateString('es', { day: 'numeric', month: 'short' }))
    + ' ' + horaDe(ms);
}

function pintar() {
  pintarCuenta();
  if (filtro === 'nuevo') {
    // Primero lo que ya se puede contestar, y dentro de cada grupo lo más nuevo arriba.
    const lista = pedidos.filter(sinAtender)
      .sort((a, b) => (b.respuesta ? 1 : 0) - (a.respuesta ? 1 : 0) || (b.cuando || 0) - (a.cuando || 0));
    $('lista').innerHTML = lista.length ? lista.map(tarjeta).join('') : '<p class="vacio">No hay pedidos por responder.</p>';
    return;
  }
  if (!pedidos.length) { $('lista').innerHTML = '<p class="vacio">Todavía no llegó ningún pedido.</p>'; return; }
  let html = '', diaAnterior = '';
  for (const p of pedidos) {
    const dia = diaDe(p.cuando);
    if (dia !== diaAnterior) { html += '<div class="dia">' + esc(dia) + '</div>'; diaAnterior = dia; }
    html += tarjeta(p);
  }
  $('lista').innerHTML = html;
}

// Sólo estos campos: la regla de pedidos_alquiler no deja tocar el texto.
async function marcar(id, estado) {
  try {
    await updateDoc(doc(db, 'pedidos_alquiler', id), {
      estado,
      atendidoPor: estado === 'nuevo' ? '' : (CV2.usuario?.nombre || u?.email || ''),
      atendidoEn: serverTimestamp(),
    });
  } catch (e) {
    CV2.toast('No se pudo guardar: ' + (e.code ?? e.message), 'error');
  }
}

$('filtros').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  filtro = b.dataset.f;
  for (const x of $('filtros').querySelectorAll('button')) x.classList.toggle('activo', x === b);
  pintar();
});

$('lista').addEventListener('click', async (e) => {
  const est = e.target.closest('[data-estado]');
  if (est) { preguntando = ''; await marcar(est.dataset.id, est.dataset.estado); return; }
  if (e.target.closest('[data-todavia]')) { preguntando = ''; pintar(); return; }
  const ab = e.target.closest('[data-abrir]');
  if (ab) {
    const p = pedidos.find((x) => x.id === ab.dataset.abrir);
    if (!p) return;
    // Se copia con la página todavía al frente y la ventana se abre en el mismo toque
    // (después de un await el navegador puede bloquearla).
    const copia = navigator.clipboard.writeText(p.respuesta || '');
    if (destino(p)) window.open(destino(p), '_blank', 'noopener');
    try { await copia; CV2.toast('Copiada. En Facebook: Comentar → mantené apretado → Pegar.', 'ok'); }
    catch { CV2.toast('No se pudo copiar: mantené apretada la respuesta y copiala.', 'error'); }
    preguntando = p.id; pintar();
    return;
  }
  const t = e.target.closest('[data-abre]');
  if (t) t.classList.toggle('corto');
});

$('sello').textContent = 'pantalla: pedidos-alquiler-2 · motor: ' + (CV2.VERSION ?? 'DESCONOCIDA — nucleo.js viejo');

// ═══ Carga: en vivo, los más nuevos primero ═══════════════
onSnapshot(query(collection(db, 'pedidos_alquiler'), orderBy('cuando', 'desc'), limit(300)),
  (snap) => { pedidos = snap.docs.map((d) => ({ id: d.id, ...d.data() })); pintar(); },
  (err) => {
    $('lista').innerHTML = '<p class="vacio">No se pudieron leer los pedidos ('
      + esc(err.code || err.message) + '). Si dice «permission-denied», faltan publicar las reglas nuevas.</p>';
  });
</script>
</body>
</html>
