<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaVerde 2.0 · Editar el sitio</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d5a27">
<style>
  /* ═══════════════════════════════════════════════════════════
     Pantalla de trabajo a pantalla completa: el sitio adentro de
     un marco, una cabecera mínima arriba y las acciones abajo, al
     alcance del pulgar. No lleva la barra de navegación del panel
     a propósito — cada píxel que le saque al marco es sitio que
     no se ve mientras se edita.
     ═══════════════════════════════════════════════════════════ */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--fondo, #f4f6f2); }

  .techo { display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    padding-top: calc(6px + env(safe-area-inset-top));
    background: #fff; border-bottom: 1px solid var(--linea); flex: none; }
  .techo .volver { border: 0; background: none; padding: 8px; cursor: pointer;
    display: flex; align-items: center; color: var(--tinta); border-radius: 10px; }
  .techo .titulo { font-weight: 600; font-size: .92rem; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* La confirmación es de la pantalla, no del navegador. Chrome deja apagar
     los diálogos de una página ("impedir que esta página cree más diálogos")
     y desde ese momento confirm() devuelve 'no' sin mostrar nada: Descartar
     no descartaría nunca y Volver no dejaría volver nunca, los dos sin decir
     por qué. Esto no se puede apagar. */
  #confirmar { position: fixed; inset: 0; z-index: 400; background: rgba(20,30,18,.55);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #confirmar.hide { display: none; }
  #confirmar .caja { background: #fff; border-radius: 16px; padding: 16px;
    max-width: 520px; width: 100%; box-shadow: 0 -8px 40px rgba(0,0,0,.3); }
  #confirmar p { font-size: .92rem; line-height: 1.5; margin: 0 0 12px; }
  #confirmar .fila-conf { display: flex; gap: 8px; }
  #confirmar .fila-conf .btn { flex: 1; justify-content: center; }

  /* Selector de página. Desde la T11.45 el sitio público tiene DOS
     páginas con textos editables: la portada y "Cómo funciona la casa".
     Sin esto, la segunda quedaba escrita y sin forma de corregirla —
     que es peor que no tenerla, porque nadie se entera hasta que hay
     algo mal en un idioma que casi no se mira. */
  /* Sacar del sitio / traer de vuelta. Aparece sólo cuando hay un texto
     tocado: fuera de eso no habría sobre qué actuar y un botón que no se
     sabe a qué apunta es peor que no tenerlo. */
  .piso .ojo { flex: none; min-width: 44px; padding: 0 10px; }
  .piso .ojo.esta-oculto { background: var(--terracota, #b86d4c); border-color: var(--terracota, #b86d4c); color: #fff; }

  .paginas { display: flex; gap: 3px; flex: none; }
  .paginas button { border: 1px solid var(--linea); background: #fff;
    border-radius: 999px; min-height: 34px; padding: 0 12px; font: inherit;
    font-size: .78rem; cursor: pointer; color: var(--gris); white-space: nowrap; }
  .paginas button.on { background: var(--tinta); border-color: var(--tinta);
    color: #fff; font-weight: 600; }

  /* Los tres idiomas. Editás en el que estás mirando: no hay
     "campo pt / campo es / campo en" uno debajo del otro. */
  .langs { display: flex; gap: 3px; flex: none; }
  .langs button { border: 1px solid var(--linea); background: #fff; border-radius: 999px;
    min-width: 44px; min-height: 34px; font: inherit; font-size: .8rem; cursor: pointer;
    color: var(--gris); }
  .langs button.on { background: var(--verde); border-color: var(--verde); color: #fff;
    font-weight: 700; }

  #marco { flex: 1; width: 100%; border: 0; display: block; background: #faf4e6; }

  /* Barra de acciones pegada abajo, arriba del área segura del
     teléfono. Es donde cae el pulgar y donde va lo que importa. */
  .piso { flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid var(--linea); }
  .piso .cuenta { flex: 1; font-size: .82rem; color: var(--gris); line-height: 1.25; }
  .piso .cuenta b { color: var(--tinta); }
  .btn { border: 0; border-radius: 999px; padding: 12px 20px; font: inherit;
    font-size: .9rem; font-weight: 600; cursor: pointer; min-height: 44px; }
  .btn.guardar { background: var(--verde); color: #fff; }
  .btn.guardar:disabled { background: #cdd6cb; color: #fff; cursor: default; }
  .btn.tirar { background: #fff; border: 1px solid var(--linea); color: var(--gris);
    padding: 12px 14px; }

  /* ── Hoja de fotos: se desliza desde abajo ────────────────
     Panel propio y NO un <dialog> nativo. El <dialog> se cerraba a
     través del parche de nucleo.js, que engancha el botón Atrás
     moviendo el historial. Pero este editor cambia el src de un
     iframe (al cambiar de página y al recargar el sitio), y cada
     cambio de src agrega una entrada al historial de la ventana: la
     pila de capas y el historial real dejan de coincidir y el
     history.back() del cierre termina retrocediendo una navegación
     del iframe. La hoja quedaba abierta, tapando la barra de abajo
     — con el botón Guardar adentro. Es decir: se podía editar y no
     se podía guardar, que es la peor forma de quedar trabado.
     Un panel propio no toca el historial y no puede fallar así. */
  .hoja-fondo { position: fixed; inset: 0; z-index: 350;
    background: rgba(20,30,18,.45); display: flex; align-items: flex-end; }
  .hoja-fondo.hide { display: none; }
  .hoja { background: #fff; width: 100%; max-height: 88dvh;
    border-radius: 18px 18px 0 0; box-shadow: 0 -6px 30px rgba(0,0,0,.25);
    display: flex; flex-direction: column; }
  .hoja .hcab { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--linea); flex: none; }
  .hoja .hcab b { flex: 1; font-size: .95rem; }
  .hoja .hcab button { border: 0; background: none; cursor: pointer; padding: 8px;
    color: var(--gris); display: flex; min-width: 44px; min-height: 44px;
    align-items: center; justify-content: center; }
  .hoja .cuerpo { overflow-y: auto; padding: 12px 14px; flex: 1; min-height: 0;
    padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

  .solapas { display: flex; gap: 6px; margin-bottom: 10px; }
  .solapas button { flex: 1; border: 1px solid var(--linea); background: #fff;
    border-radius: 999px; padding: 9px 8px; font: inherit; font-size: .82rem;
    cursor: pointer; color: var(--gris); min-height: 40px; }
  .solapas button.on { background: var(--verde); border-color: var(--verde);
    color: #fff; font-weight: 600; }

  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 8px; }
  .tile { position: relative; border-radius: 10px; overflow: hidden; background: #eee;
    border: 2px solid var(--linea); aspect-ratio: 4/3; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .x, .tile .pri { position: absolute; border: 0; cursor: pointer; padding: 0;
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: #fff; background: rgba(20,30,18,.68); }
  .tile .x { top: 4px; right: 4px; }
  .tile .pri { bottom: 4px; right: 4px; }
  .tile .x .material-icons, .tile .pri .material-icons { font-size: 20px; }
  .tile .etq { position: absolute; left: 6px; bottom: 6px; background: var(--verde); color: #fff;
    font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tile .etq.ok { background: rgba(20,30,18,.72); font-weight: 600; }
  .tile.elegible { cursor: pointer; }
  .tile.ya { opacity: .55; cursor: default; }
  .tile .marca { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(20,30,18,.35);
    display: flex; align-items: center; justify-content: center; color: transparent; }
  .tile .marca .material-icons { font-size: 18px; }
  .tile.tild { border-color: var(--verde); }
  .tile.tild .marca { background: var(--verde); color: #fff; }
  .aviso { color: var(--gris); font-size: .86rem; padding: 12px 2px; line-height: 1.5; }
  .subir { width: 100%; border: 1px solid var(--linea); background: #fff; border-radius: 12px;
    padding: 12px 14px; font: inherit; font-size: .9rem; cursor: pointer; display: flex;
    align-items: center; gap: 10px; min-height: 48px; color: var(--tinta); margin-bottom: 10px; }
  .subir .material-icons { color: var(--verde); }
  .deshacer { display: flex; align-items: center; gap: 8px; background: #fdf2d9;
    border-radius: 10px; padding: 8px 12px; font-size: .82rem; margin-bottom: 10px; }
  .deshacer span { flex: 1; }
  .deshacer button { border: 0; background: none; font: inherit; font-weight: 700;
    color: var(--verde); cursor: pointer; min-height: 40px; padding: 0 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .chips button { flex: none; border: 1px solid var(--linea); background: #fff; border-radius: 999px;
    padding: 7px 13px; font: inherit; font-size: .8rem; cursor: pointer; color: var(--gris);
    min-height: 36px; white-space: nowrap; }
  .chips button.on { background: var(--tinta); border-color: var(--tinta); color: #fff; font-weight: 600; }
  .mas { width: 100%; border: 1px dashed var(--linea); background: #fff;
    border-radius: 12px; padding: 12px; font: inherit; color: var(--gris);
    cursor: pointer; margin-top: 10px; min-height: 44px; }
  .hpie { flex: none; padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--linea); background: #fff; }
  .hpie.hide { display: none; }
  .hpie button { width: 100%; border: 0; border-radius: 999px; background: var(--verde); color: #fff;
    font: inherit; font-weight: 700; font-size: .92rem; padding: 12px; min-height: 46px; cursor: pointer; }
</style>
</head>
<body>

<div class="techo">
  <button class="volver" id="btnVolver" aria-label="Volver">
    <span class="material-icons">arrow_back</span>
  </button>
  <div class="paginas" id="paginas">
    <button data-p="index.html">Portada</button>
    <button data-p="la-casa.html">La casa</button>
  </div>
  <div style="flex:1"></div>
  <div class="langs" id="langs">
    <button data-l="pt">PT</button>
    <button data-l="es">ES</button>
    <button data-l="en">EN</button>
  </div>
</div>

<iframe id="marco" title="El sitio público, editable"></iframe>

<div class="piso">
  <div class="cuenta" id="cuenta">Cargando el sitio…</div>
  <button class="btn tirar" id="btnTirar" hidden aria-label="Descartar cambios">
    <span class="material-icons" style="font-size:20px;vertical-align:-4px;">undo</span>
  </button>
  <button class="btn ojo" id="btnOjo" hidden>
    <span class="material-icons" id="ojoIcono" style="font-size:20px;vertical-align:-4px;">visibility_off</span>
  </button>
  <button class="btn guardar" id="btnGuardar" disabled>Guardar</button>
</div>

<div id="confirmar" class="hide">
  <div class="caja">
    <p id="conf-txt"></p>
    <div class="fila-conf">
      <button class="btn" id="conf-no">Cancelar</button>
      <button class="btn btn-primario" id="conf-si">Sí</button>
    </div>
  </div>
</div>

<div class="hoja-fondo hide" id="hojaFotos">
  <div class="hoja">
    <div class="hcab">
      <b id="hojaTit">Fotos</b>
      <button id="hojaX" aria-label="Cerrar"><span class="material-icons">close</span></button>
    </div>
    <div class="cuerpo">
      <div class="solapas">
        <button data-f="album" class="on">Álbum</button>
        <button data-f="nube">Cloudinary</button>
        <button data-f="uso">Del sitio</button>
      </div>
      <div id="hojaLista"></div>
    </div>
    <div class="hpie hide" id="hojaPie">
      <button id="btnSumar">Agregar</button>
    </div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  EDITAR EL SITIO — edición visual del sitio público
//
//  QUÉ ES
//  El sitio de verdad, dentro de un marco, con los textos abiertos
//  para escribir encima y las fotos cambiables de un toque. Lo que
//  se ve mientras se edita ES lo que se publica, porque es la misma
//  página: no hay copia, no hay previsualización, no hay dos
//  versiones que se separan con el tiempo.
//
//  POR QUÉ NO HAY BORRADOR
//  El sitio lee TODO de Firestore. Guardar acá cambia el sitio en el
//  acto, así que un borrador aparte no protegería nada: sería un
//  segundo estado que hay que sincronizar a mano, y el día que se
//  desincronice el editor va a mostrar algo que no existe. Un solo
//  estado —lo publicado— y los cambios sin guardar viviendo en la
//  memoria de esta pantalla hasta que se toca Guardar.
//
//  CÓMO SABE DÓNDE ESCRIBIR
//  El sitio, abierto con ?edit=1, marca cada cosa editable con el
//  documento y el campo que la respaldan:
//     data-edit="config/sitio:textos.es.titulo"
//     data-edit="cabanas/c1:nombre.es"
//     data-edit-img="cabanas/c1:fotos.0"
//     data-edit-add="cabanas/c1:fotos"
//  Este editor no sabe nada del diseño del sitio: sigue esas marcas.
//  El día que el sitio cambie de forma, esto sigue funcionando.
//
//  LÍMITES CONOCIDOS, escritos para no volver a descubrirlos
//  · La ilustración de la portada, el logo y el logo del pie son
//    archivos del repositorio (./ilustracion-hero.jpg y compañía),
//    no están en Cloudinary y NO se editan desde acá. Se cambian
//    subiéndolos a GitHub. Es a propósito: son la identidad, no
//    contenido.
//  · El WhatsApp, las tarifas, la capacidad, las comodidades, el inventario
//    y la guía del huésped no se editan acá: son datos, no texto visible.
//    Siguen en «Datos de las cabañas» (cabanas.html).
//  · Desde el 24-nov-2026 ESTE es el único editor de lo que se lee en la web:
//    textos, nombres y descripciones, y las fotos (el álbum de cada cabaña y
//    de cada espacio). cabanas.html y espacios.html ya no escriben nada de eso.
//  · El calendario y los botones del sitio están apagados mientras se
//    edita; para probarlos hay que abrir el sitio normal.
// ═══════════════════════════════════════════════════════════════
import { CV2 } from './nucleo.js';
import {
  db, doc, setDoc, updateDoc, deleteField
} from './firebase-init.js';

// ── Arranque: sesión y permiso antes que nada ────────────────
CV2.registrarSW();
const u = await CV2.verificarAuth();
// replace y NO href: con href esta pantalla queda en el historial, y el
// botón Atrás desde el Inicio vuelve a entrar acá para que la echen otra
// vez — un rebote sin salida. Mismo motivo que explica usuarios.html.
if (!CV2.puede('contenido')) {
  location.replace('./index.html');
  throw new Error('sin permiso de contenido');
}
CV2.dialogosConAtras();

const $ = (id) => document.getElementById(id);
const marco = $('marco');

// ── Estado ───────────────────────────────────────────────────
// Un solo mapa: clave "coleccion/documento:campo" → valor nuevo.
// La clave es exactamente la que escribió el sitio en el atributo,
// así que no hay traducción de por medio donde perder algo.
const pendientes = new Map();

// Lo que ya usa el sitio hoy, para la solapa "Ya en el sitio":
// reusar una foto que ya está publicada es el caso más común y no
// necesita ni Cloudinary ni la función de Netlify.
let enUso = [];


// ── El marco ─────────────────────────────────────────────────
// Ruta RELATIVA a propósito: así el marco hereda el mismo origen que
// esta página, sea en casaverdecanas.com.br o en github.io. Con una
// dirección absoluta, el navegador trataría el marco como ajeno y
// este editor no podría ni leer su contenido.
let paginaActual = 'index.html';
// Desde Cabañas se llega con ?c=<id> a la tarjeta de esa cabaña: la portada ya sabe llevar hasta ella.
const cabDeEnlace = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9_-]/g, '');
marco.src = '../' + paginaActual + '?edit=1' + (cabDeEnlace ? '&c=' + encodeURIComponent(cabDeEnlace) : '');

/**
 * Cambia la página que se está editando.
 *
 * Los cambios sin guardar NO se arrastran de una página a otra: las
 * claves de 'pendientes' son "config/sitio:textos.es.loQueSea", así que
 * técnicamente sobrevivirían al cambio — y ahí está el problema. Alguien
 * escribe tres textos en la portada, se va a La casa, guarda algo de
 * ahí, y sin saberlo publica también lo de la portada. Guardar tiene que
 * publicar lo que se está mirando y nada más.
 */
function irAPagina(p) {
  if (p === paginaActual) return;
  if (pendientes.size) {
    // No se usa confirm(): Chrome deja apagar los diálogos de la página
    // ("impedir que esta página cree más diálogos") y desde entonces
    // devuelve 'no' sin mostrar nada. El botón quedaría muerto sin
    // explicar por qué.
    CV2.toast('Guardá o descartá los cambios antes de cambiar de página', 'error');
    return;
  }
  paginaActual = p;
  const bs = document.querySelectorAll('#paginas button');
  for (let i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.p === p);
  $('cuenta').textContent = 'Cargando la página…';
  marco.src = '../' + p + '?edit=1';
}

const botonesPagina = document.querySelectorAll('#paginas button');
for (let i = 0; i < botonesPagina.length; i++) {
  botonesPagina[i].classList.toggle('on', botonesPagina[i].dataset.p === paginaActual);
  // El evento se pasa como parámetro: 'event' global no existe en
  // Safari/iOS y el botón no haría nada, sin error a la vista.
  botonesPagina[i].addEventListener('click', (ev) => irAPagina(ev.currentTarget.dataset.p));
}

marco.addEventListener('load', () => {
  // El sitio avisa cada vez que termina de pintar. Hace falta
  // escucharlo y no enganchar una sola vez: al cambiar de idioma las
  // cabañas se rehacen enteras y los elementos de antes dejan de
  // existir. Sin esto, editar dejaba de funcionar en silencio después
  // del primer cambio de idioma.
  try {
    marco.contentDocument.addEventListener('cv:pintado', enganchar);
  } catch (e) {
    CV2.toast('No se pudo abrir el sitio para editar', 'error');
    return;
  }
  enganchar();
  // Página nueva: el ojo no apunta a nada hasta que se toque un texto.
  // Sin esto seguía apuntando a la clave de la página anterior, y un
  // botón que dice "sacar del sitio" apuntando a otra cosa es la peor
  // clase de botón.
  claveEnfocada = null;
  marcarOjo();
});

function ventana() { return marco.contentWindow; }
function documento() { return marco.contentDocument; }

/** Cuelga los oyentes de todo lo editable que haya en el marco. */
function enganchar() {
  const d = documento();
  if (!d) return;

  // Freno de mano contra la navegación, una sola vez por documento.
  // Hace falta ADEMÁS del pointer-events:none del sitio: varios textos
  // editables viven DENTRO de un enlace (el "Consultar" del WhatsApp, el
  // del pie), y un toque en el hijo burbujea al <a> y navega igual,
  // llevándose puesto todo lo escrito sin guardar.
  if (!d.body.dataset.cvFreno) {
    d.body.dataset.cvFreno = '1';
    d.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) ev.preventDefault();
    }, true);
  }

  // Textos
  d.querySelectorAll('[data-edit]').forEach((el) => {
    if (el.dataset.cvListo) return;
    el.dataset.cvListo = '1';
    // 'plaintext-only' evita que el teclado de Android meta <br> y
    // <div> al saltar de línea. Si el navegador no lo soporta, cae en
    // 'true' y al guardar se toma textContent, que ignora ese HTML.
    el.setAttribute('contenteditable', 'plaintext-only');
    if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
    el.setAttribute('spellcheck', 'false');
    el.addEventListener('input', () => anotar(el));
    el.addEventListener('keydown', (ev) => {
      // 23-nov-2026: lo marcado data-multi (el bloque del predio) admite varios párrafos: ahí Enter escribe una
      // línea nueva. En todo lo demás sigue cerrando la edición (un título o un rótulo no llevan saltos).
      if (ev.key === 'Enter' && !el.hasAttribute('data-multi')) { ev.preventDefault(); el.blur(); }
    });
    // Al tocar un texto, el botón del ojo pasa a apuntarle. Se usa
    // 'focus' y no 'click' porque un texto también se alcanza con el
    // tabulador, y el botón tiene que seguir al cursor y no al dedo.
    el.addEventListener('focus', () => {
      claveEnfocada = claveDe(el);
      marcarOjo();
    });
  });

  // Fotos existentes
  d.querySelectorAll('[data-edit-img]').forEach((el) => {
    if (el.dataset.cvListo) return;
    el.dataset.cvListo = '1';
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      abrirHojaFotos(el.getAttribute('data-edit-img'));
    });
  });

  // Huecos para agregar
  d.querySelectorAll('[data-edit-add]').forEach((el) => {
    if (el.dataset.cvListo) return;
    el.dataset.cvListo = '1';
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      abrirHojaFotos(el.getAttribute('data-edit-add') + '.+');
    });
  });

  recolectarEnUso();
  reaplicar();
  contar();
}

/**
 * Vuelve a escribir en la pantalla los cambios sin guardar.
 * Hace falta porque cada cambio de idioma repinta el sitio desde los
 * datos de la base: sin esto, cambiar de idioma y volver borraba de
 * la vista lo que todavía no se había guardado. Los cambios seguían
 * en memoria, pero la persona los veía desaparecer, que es peor.
 */
function reaplicar() {
  const d = documento();
  if (!d) return;
  d.querySelectorAll('[data-edit]').forEach((el) => {
    const k = el.getAttribute('data-edit');
    if (pendientes.has(k)) {
      if (el.textContent !== pendientes.get(k)) el.textContent = pendientes.get(k);
      el.classList.add('cv-tocado');
    }
  });
  d.querySelectorAll('[data-edit-img]').forEach((el) => {
    const ref = el.getAttribute('data-edit-img');   // col/doc:fotos.N
    const corte = ref.lastIndexOf('.');
    const clave = ref.slice(0, corte);              // col/doc:fotos
    const i = Number(ref.slice(corte + 1));
    if (pendientes.has(clave)) {
      const arr = pendientes.get(clave);
      if (Array.isArray(arr) && arr[i] && el.src !== arr[i]) el.src = arr[i];
    }
  });
}

/** Anota el texto de un elemento como cambio pendiente. */
function anotar(el) {
  const k = el.getAttribute('data-edit');
  // textContent y no innerHTML: lo que se guarda es texto, siempre.
  // Guardar HTML del navegador es abrir la puerta a que un pegado
  // desde WhatsApp meta estilos que el sitio no controla.
  const valor = el.textContent.replace(/\s+/g, ' ').trim();
  pendientes.set(k, valor);
  el.classList.add('cv-tocado');
  contar();
}

/* ── Sacar del sitio y traer de vuelta ────────────────────────
   Por qué no alcanza con borrar el texto: un texto vacío vuelve al
   diccionario, y eso es lo correcto —quien borra sin querer no debería
   dejar el sitio con un hueco—. Pero entonces no había forma de sacar
   una regla o un renglón que ya no corresponde. Son dos intenciones
   distintas y por eso van en dos campos distintos: 'textos' guarda lo
   que dice, y 'ocultos' guarda lo que no se muestra.

   Agregar un párrafo o una regla NUEVA sigue necesitando tocar el HTML:
   es la contrapartida de que cada renglón sea su propia clave. Cambiarlo
   pediría un modelo de bloques dinámicos, que es otra cosa y bastante
   más grande. */
let claveEnfocada = null;

/**
 * La lista de ocultos, COPIADA a un array de esta ventana.
 *
 * ⚠ Array.from() no es adorno. El array viene de dentro del iframe y por
 * lo tanto lleva el Array.prototype del iframe, no el de esta página.
 * Para JavaScript es un array igual, pero Firestore comprueba el tipo
 * contra SU propio Array y no lo reconoce: rechaza el guardado entero con
 * 'invalid-argument', sin decir cuál de los campos fue. Se copia acá, al
 * cruzar la frontera, y no en el momento de guardar: así todo lo que
 * circula por el editor ya es de esta ventana y el problema no puede
 * reaparecer por otro camino.
 *
 * Los arrays de fotos nunca tuvieron este problema porque leerAlbum()
 * los construye acá desde cero; este es el único dato que llega armado
 * desde adentro del marco.
 */
function ocultosAhora() {
  const w = ventana();
  const lista = (w && w.CVSITIO && w.CVSITIO.ocultos) ? w.CVSITIO.ocultos : [];
  return Array.from(lista, (x) => String(x));
}

/** ¿Qué clave de texto es la que se está tocando? */
function claveDe(el) {
  const ref = el && el.getAttribute ? el.getAttribute('data-edit') : '';
  if (!ref) return null;
  // "config/sitio:textos.es.casa_r_luces_p" → "casa_r_luces_p".
  // Sólo los textos del sitio se pueden ocultar: el nombre de una cabaña
  // se saca despublicando la cabaña, no escondiendo su título.
  const i = ref.indexOf(':textos.');
  if (i === -1) return null;
  const trozos = ref.slice(i + ':textos.'.length).split('.');
  return trozos.length === 2 ? trozos[1] : null;
}

function marcarOjo() {
  const b = $('btnOjo');
  if (!claveEnfocada) { b.hidden = true; return; }
  b.hidden = false;
  const oculto = ocultosAhora().indexOf(claveEnfocada) !== -1;
  b.classList.toggle('esta-oculto', oculto);
  $('ojoIcono').textContent = oculto ? 'visibility' : 'visibility_off';
  b.title = oculto ? 'Traer de vuelta al sitio' : 'Sacar del sitio';
}

$('btnOjo').addEventListener('click', () => {
  if (!claveEnfocada) return;
  const w = ventana();
  if (!w || !w.CVSITIO || !w.CVSITIO.setOcultos) return;
  const lista = ocultosAhora();
  const i = lista.indexOf(claveEnfocada);
  if (i === -1) lista.push(claveEnfocada);
  else lista.splice(i, 1);
  // Se pinta en el acto y se anota como cambio pendiente: no se escribe
  // en la base hasta que se toque Guardar, igual que los textos. Guardar
  // al instante haría que el botón sea irreversible de hecho.
  w.CVSITIO.setOcultos(lista);
  // Array.from y no lista.slice(): slice() usa el prototipo del array que
  // recibe, así que un array del iframe devuelve otro array del iframe.
  pendientes.set('config/sitio:ocultos', Array.from(lista, (x) => String(x)));
  marcarOjo();
  contar();
});

function contar() {
  const n = pendientes.size;
  $('btnGuardar').disabled = n === 0;
  $('btnTirar').hidden = n === 0;
  $('cuenta').innerHTML = n === 0
    ? 'Tocá un texto para escribirlo. Tocá una foto para ver y ordenar su álbum.'
    : '<b>' + n + '</b> cambio' + (n === 1 ? '' : 's') + ' sin guardar';
}

// ── Idiomas ──────────────────────────────────────────────────
// El idioma lo maneja el sitio, no este editor: se le pide el cambio
// y él repinta. Un segundo lugar que decida el idioma es un segundo
// lugar que se puede desincronizar.
function marcarLangs() {
  const w = ventana();
  const actual = (w && w.CVSITIO) ? w.CVSITIO.lang : 'es';
  $('langs').querySelectorAll('button').forEach((b) =>
    b.classList.toggle('on', b.dataset.l === actual));
}
$('langs').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const w = ventana();
  if (!w || !w.CVSITIO) return;
  w.CVSITIO.setLang(b.dataset.l);
  marcarLangs();
  // El repintado dispara 'cv:pintado' y de ahí sale enganchar() +
  // reaplicar(): los cambios sin guardar del idioma nuevo vuelven a
  // aparecer solos.
});

// ── Fotos ────────────────────────────────────────────────────
function recolectarEnUso() {
  const d = documento();
  if (!d) return;
  const vistas = new Set();
  d.querySelectorAll('[data-edit-img]').forEach((el) => {
    if (el.src) vistas.add(el.src);
  });
  enUso = [...vistas];
}

// ── Álbumes de fotos ─────────────────────────────────────────
// 24-nov-2026. Antes se tocaba UNA foto y se la cambiaba por otra: para quitar una
// había que abrir la hoja, y para sumar cinco había que repetirlo cinco veces; y el
// álbum de un espacio común (que en pantalla muestra sólo su primera foto) se armaba
// desde lo que se veía y perdía el resto al guardar. Ahora tocar cualquier foto abre
// EL ÁLBUM entero de esa cabaña o espacio:
//   · «Álbum»      las fotos que tiene, cada una con ✕ (quitar) y ★ (poner de portada);
//   · «Cloudinary» todo lo que hay en Cloudinary, para tildar varias y sumarlas de una vez;
//   · «Del sitio»  lo que ya se ve en esta página (por si Cloudinary no contesta).
// Quitar una foto la saca del álbum y nada más: el archivo sigue en Cloudinary y se puede
// volver a sumar. El álbum de verdad lo guarda el SITIO en memoria (CVSITIO.fotosDe / verFotos):
// el editor no lo deduce de la pantalla.
let album = null;            // { clave, doc, nombre, carpeta, solapa, filtro, sel:Map(id→url) }
const origenes = new Map();  // clave → cómo estaba el álbum antes del primer cambio
const nube = new Map();      // filtro de carpeta → { fotos, cursor, diag, error }
let quitada = null;          // { url, pos } la última quitada, para «Deshacer»

const CHIPS_CARPETA = [
  ['', 'Todas'], ['sitio', 'Sitio'], ['cabanas', 'Cabañas'],
  ['Espacios', 'Espacios'], ['recuerdos', 'Recuerdos']
];

/** El identificador de una foto de Cloudinary sin transformaciones, versión ni extensión. */
function idFoto(url) {
  const s = String(url || '');
  const i = s.indexOf('/upload/');
  if (i === -1) return s;
  return s.slice(i + 8).split('/')
    .filter((p) => p && !/^v\d+$/.test(p) && !CV2._esTransformacion(p))
    .join('/').replace(/\.[A-Za-z0-9]+$/, '');
}

/** La misma foto de Cloudinary con OTRA transformación de entrega (las demás van tal cual). */
function conTransformacion(url, trans) {
  const s = String(url || '');
  const i = s.indexOf('/upload/');
  if (i === -1 || !CV2.esCloudinary(s)) return s;
  const resto = s.slice(i + 8).split('/');
  while (resto.length && CV2._esTransformacion(resto[0])) resto.shift();
  return s.slice(0, i + 8) + trans + '/' + resto.join('/');
}

/** Miniatura liviana de una foto de Cloudinary. */
function miniDe(url) { return conTransformacion(url, 'f_auto,q_auto,w_300,h_300,c_fill'); }

function mismasFotos(a, b) {
  return a.length === b.length && a.every((u, i) => u === b[i]);
}

/** El álbum tal como está AHORA (con lo sin guardar): lo sabe el sitio. */
function leerAlbum() {
  if (!album) return [];
  const w = ventana();
  const info = (w && w.CVSITIO && w.CVSITIO.fotosDe) ? w.CVSITIO.fotosDe(album.doc) : null;
  if (info) return info.fotos.slice();
  if (pendientes.has(album.clave)) return pendientes.get(album.clave).slice();
  return arrayDePantalla(album.clave);
}

/** Último recurso (un sitio viejo en la caché): lo que se ve en pantalla. */
function arrayDePantalla(clave) {
  const d = documento();
  const salida = [];
  if (d) {
    d.querySelectorAll('[data-edit-img^="' + clave + '."]').forEach((el) => {
      salida[Number(el.getAttribute('data-edit-img').split('.').pop())] = el.src;
    });
  }
  return salida.filter((x) => typeof x === 'string');
}

/** Deja el álbum así: lo muestra en el sitio y lo anota como cambio sin guardar. */
function aplicarAlbum(arr) {
  if (!origenes.has(album.clave)) origenes.set(album.clave, leerAlbum());
  const w = ventana();
  if (w && w.CVSITIO && w.CVSITIO.verFotos) w.CVSITIO.verFotos(album.doc, arr);
  // Si quedó igual que al principio, no es un cambio: no cuenta ni se guarda.
  if (mismasFotos(arr, origenes.get(album.clave))) pendientes.delete(album.clave);
  else pendientes.set(album.clave, arr.slice());
  contar();
}

/** ref = "col/doc:fotos.3" (una foto) o "col/doc:fotos.+" (el hueco de agregar): abre su álbum. */
function abrirHojaFotos(ref) {
  const clave = ref.slice(0, ref.lastIndexOf('.'));
  const doc = clave.split(':')[0];
  const w = ventana();
  const info = (w && w.CVSITIO && w.CVSITIO.fotosDe) ? w.CVSITIO.fotosDe(doc) : null;
  album = {
    clave: clave, doc: doc, nombre: info ? info.nombre : '',
    carpeta: carpetaSegunDestino(ref), solapa: 'album', filtro: '', sel: new Map()
  };
  quitada = null;
  $('hojaTit').textContent = 'Fotos' + (album.nombre ? ' · ' + album.nombre : '');
  solapa(leerAlbum().length ? 'album' : 'nube');
  abrirHoja();
}

// ── Abrir y cerrar la hoja ───────────────────────────────────
// El botón Atrás sigue cerrándola, pero por CV2.capaAtras y no por el
// parche de <dialog>: acá se sabe con certeza cuándo se abrió y cuándo
// se cerró, y nada depende de que el historial de la ventana esté
// donde se lo dejó.
let cerrarHojaAtras = null;

function abrirHoja() {
  $('hojaFotos').classList.remove('hide');
  if (!cerrarHojaAtras) cerrarHojaAtras = CV2.capaAtras(() => {
    cerrarHojaAtras = null;
    $('hojaFotos').classList.add('hide');
  });
}

function cerrarHoja() {
  $('hojaFotos').classList.add('hide');
  // Se limpia la entrada del historial que agregó capaAtras. Si el
  // cierre vino del propio Atrás, cerrarHojaAtras ya es null y esto no
  // hace nada: en los dos caminos la hoja termina cerrada.
  const c = cerrarHojaAtras;
  cerrarHojaAtras = null;
  if (c) c();
}

$('hojaX').addEventListener('click', cerrarHoja);

// Tocar el fondo oscuro también cierra. Es lo que la gente intenta
// primero en el teléfono, y antes no hacía nada.
$('hojaFotos').addEventListener('click', (ev) => {
  if (ev.target === $('hojaFotos')) cerrarHoja();
});

document.querySelector('.solapas').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (b) solapa(b.dataset.f);
});

$('hojaLista').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-acc]');
  if (!b || !album) return;
  const acc = b.dataset.acc, i = Number(b.dataset.i);
  if (acc === 'quitar') quitarDelAlbum(i);
  else if (acc === 'portada') ponerDePortada(i);
  else if (acc === 'deshacer') deshacerQuitar();
  else if (acc === 'subir') subirNueva();
  else if (acc === 'elegir') tildarFoto(b);
  else if (acc === 'mas') traerMas();
  else if (acc === 'chip') { album.filtro = b.dataset.c || ''; pintarNube(); }
});

$('btnSumar').addEventListener('click', sumarElegidas);

function solapa(cual) {
  if (!album) return;
  album.solapa = cual;
  const n = leerAlbum().length;
  document.querySelectorAll('.solapas button').forEach((b) => {
    b.classList.toggle('on', b.dataset.f === cual);
    if (b.dataset.f === 'album') b.textContent = 'Álbum · ' + n;
  });
  if (cual === 'album') pintarAlbum();
  else if (cual === 'nube') pintarNube();
  else pintarEnUso();
  pintarPie();
}

/** La barra de abajo: «Agregar N fotos» cuando hay fotos tildadas. */
function pintarPie() {
  const n = album && album.solapa !== 'album' ? album.sel.size : 0;
  $('hojaPie').classList.toggle('hide', n === 0);
  $('btnSumar').textContent = 'Agregar ' + n + (n === 1 ? ' foto' : ' fotos')
    + (album && album.nombre ? ' a ' + album.nombre : '');
}

function pintarAlbum() {
  const cont = $('hojaLista');
  const fotos = leerAlbum();
  let h = '<button class="subir" data-acc="subir"><span class="material-icons">add_a_photo</span>'
    + '<span>Subir una foto nueva</span></button>';
  if (quitada) {
    h += '<div class="deshacer"><span>Foto quitada del álbum. El archivo sigue en Cloudinary.</span>'
      + '<button data-acc="deshacer">Deshacer</button></div>';
  }
  if (!fotos.length) {
    h += '<div class="aviso">Este álbum no tiene fotos. Subí una nueva o elegí las que ya '
      + 'están en Cloudinary (solapa <b>Cloudinary</b>).</div>';
  } else {
    h += '<div class="grilla">' + fotos.map((u, i) =>
      '<div class="tile">'
      + '<img src="' + CV2.esc(miniDe(u)) + '" alt="">'
      + (i === 0 ? '<span class="etq">Portada</span>'
        : '<button class="pri" data-acc="portada" data-i="' + i + '" aria-label="Poner de portada">'
          + '<span class="material-icons">star</span></button>')
      + '<button class="x" data-acc="quitar" data-i="' + i + '" aria-label="Quitar del álbum">'
      + '<span class="material-icons">close</span></button></div>'
    ).join('') + '</div>'
      + '<div class="aviso">✕ saca la foto de este álbum (el archivo queda en Cloudinary y '
      + 'se puede volver a sumar). ★ la pone primera: es la que se ve en la tarjeta.</div>';
  }
  cont.innerHTML = h;
}

function quitarDelAlbum(i) {
  const arr = leerAlbum();
  if (i < 0 || i >= arr.length) return;
  quitada = { url: arr.splice(i, 1)[0], pos: i };
  aplicarAlbum(arr);
  solapa('album');
}

function deshacerQuitar() {
  if (!quitada) return;
  const arr = leerAlbum();
  arr.splice(Math.min(quitada.pos, arr.length), 0, quitada.url);
  quitada = null;
  aplicarAlbum(arr);
  solapa('album');
}

function ponerDePortada(i) {
  const arr = leerAlbum();
  if (i <= 0 || i >= arr.length) return;
  arr.unshift(arr.splice(i, 1)[0]);
  quitada = null;
  aplicarAlbum(arr);
  solapa('album');
}

/** Una grilla para tildar fotos de una lista (Cloudinary o «Del sitio»). */
function grillaParaElegir(lista) {
  const ya = new Set(leerAlbum().map(idFoto));
  return '<div class="grilla">' + lista.map((f) => {
    const id = idFoto(f.url);
    const esta = ya.has(id), tild = album.sel.has(id);
    return '<div class="tile elegible' + (esta ? ' ya' : '') + (tild ? ' tild' : '') + '"'
      + (esta ? '' : ' data-acc="elegir"') + ' data-id="' + CV2.esc(id) + '" data-u="' + CV2.esc(f.url) + '">'
      + '<img src="' + CV2.esc(f.mini || miniDe(f.url)) + '" loading="lazy" alt="' + CV2.esc(f.nombre || '') + '">'
      + (esta ? '<span class="etq ok">✓ en el álbum</span>'
        : '<span class="marca"><span class="material-icons">check</span></span>')
      + '</div>';
  }).join('') + '</div>';
}

function tildarFoto(el) {
  const id = el.dataset.id;
  if (album.sel.has(id)) { album.sel.delete(id); el.classList.remove('tild'); }
  else { album.sel.set(id, el.dataset.u); el.classList.add('tild'); }
  pintarPie();
}

function sumarElegidas() {
  if (!album || !album.sel.size) return;
  const arr = leerAlbum();
  const ya = new Set(arr.map(idFoto));
  let n = 0;
  album.sel.forEach((url, id) => {
    if (ya.has(id)) return;
    // Se guarda con la misma transformación de entrega que las fotos subidas desde el panel.
    arr.push(conTransformacion(url, CV2.ENTREGA));
    n++;
  });
  album.sel.clear();
  quitada = null;
  aplicarAlbum(arr);
  solapa('album');
  CV2.toast(n === 1 ? 'Foto agregada al álbum' : n + ' fotos agregadas al álbum', 'success');
}

function pintarEnUso() {
  const cont = $('hojaLista');
  if (!enUso.length) {
    cont.innerHTML = '<div class="aviso">Todavía no hay ninguna foto en esta página.</div>';
    return;
  }
  cont.innerHTML = grillaParaElegir(enUso.map((u) => ({ url: u, mini: miniDe(u) })));
}

/** Los atajos de carpeta: «Todas», la de esta cabaña/espacio si es propia, y las del sitio. */
function chipsHTML() {
  const chips = CHIPS_CARPETA.slice();
  const lista = chips.map((c) => c[0]);
  if (album.carpeta && lista.indexOf(album.carpeta) === -1) {
    chips.splice(1, 0, [album.carpeta, album.doc.indexOf('cabanas/') === 0 ? 'Esta cabaña' : 'Este lugar']);
  }
  return '<div class="chips">' + chips.map((c) =>
    '<button data-acc="chip" data-c="' + CV2.esc(c[0]) + '"' + (album.filtro === c[0] ? ' class="on"' : '')
    + '>' + CV2.esc(c[1]) + '</button>').join('') + '</div>';
}

async function pintarNube() {
  const cont = $('hojaLista');
  const f = album.filtro;
  let est = nube.get(f);
  if (!est) {
    cont.innerHTML = chipsHTML() + '<div class="aviso">Buscando en Cloudinary…</div>';
    est = await pedirNube(f, '');
    // La hoja pudo cerrarse o cambiar de solapa o de filtro mientras se esperaba.
    if (!album || album.solapa !== 'nube' || album.filtro !== f) return;
  }
  dibujarNube(est);
}

/** Pide una página del listado. Nunca tira: el motivo del fallo queda a la vista. */
async function pedirNube(filtro, cursor) {
  const base = nube.get(filtro) || { fotos: [], cursor: null, diag: null, error: '' };
  try {
    let url = CV2.NETLIFY + '/cloudinary-listar';
    const q = [];
    if (filtro) q.push('carpetas=' + encodeURIComponent(filtro));
    if (cursor) q.push('cursor=' + encodeURIComponent(cursor));
    if (q.length) url += '?' + q.join('&');
    const r = await fetch(url);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    base.fotos = base.fotos.concat(data.fotos || []);
    base.cursor = data.cursor || null;
    base.diag = data.diagnostico || null;
    base.error = '';
    nube.set(filtro, base);
  } catch (e) {
    // El motivo completo a la vista: acá los errores son de configuración
    // (variables, carpetas) y adivinarlos cuesta horas. Un fallo no se cachea.
    base.error = e.message || String(e);
    if (!base.fotos.length) nube.delete(filtro);
  }
  return base;
}

function dibujarNube(est) {
  const cont = $('hojaLista');
  let h = chipsHTML();
  if (est.error && !est.fotos.length) {
    h += '<div class="aviso">No se pudo leer Cloudinary.<br>' + CV2.esc(est.error)
      + '<br><br>Mientras tanto podés usar la solapa <b>Del sitio</b> o <b>Subir una foto nueva</b> '
      + '(en la solapa Álbum).</div>';
  } else if (!est.fotos.length) {
    h += '<div class="aviso">No hay fotos en ' + (album.filtro ? 'esa carpeta' : 'las carpetas del sitio')
      + '.<br><br>Las que están sueltas en la raíz de Cloudinary no se muestran: ahí viven '
      + 'también los comprobantes de Dinero, y este listado nunca los toca. Para que aparezcan, '
      + 'movelas a una carpeta (<b>sitio</b>, <b>cabanas</b>, <b>Espacios</b>, <b>recuerdos</b>) desde '
      + 'Cloudinary: mover no cambia la dirección de la foto.' + diagnosticoHTML(est.diag) + '</div>';
  } else {
    h += grillaParaElegir(est.fotos);
    if (est.cursor) h += '<button class="mas" data-acc="mas">Ver más fotos</button>';
    if (est.error) h += '<div class="aviso">No se pudo traer más: ' + CV2.esc(est.error) + '</div>';
  }
  cont.innerHTML = h;
}

/** Lo que la función contó sobre su búsqueda; sólo se muestra cuando volvió vacía. */
function diagnosticoHTML(diag) {
  if (!diag) return '';
  let h = '<br><br><b>Lo que buscó:</b><br>carpetas: ' + CV2.esc((diag.carpetas_pedidas || []).join(', '));
  if (typeof diag.total_en_cloudinary === 'number') h += '<br>coincidencias en Cloudinary: ' + diag.total_en_cloudinary;
  return h;
}

async function traerMas() {
  const f = album.filtro;
  const est = nube.get(f);
  if (!est || !est.cursor) return;
  const b = document.querySelector('#hojaLista .mas');
  if (b) { b.textContent = 'Buscando…'; b.disabled = true; }
  await pedirNube(f, est.cursor);
  if (!album || album.solapa !== 'nube' || album.filtro !== f) return;
  dibujarNube(nube.get(f) || { fotos: [], cursor: null, error: 'sin respuesta' });
}

/**
 * Deduce a qué carpeta de Cloudinary va una foto, mirando el documento al
 * que se la está poniendo. Antes no se mandaba ninguna y todo caía en la
 * raíz, junto a los comprobantes de Dinero: por eso el listado de acá
 * nunca encontraba nada.
 *
 * ref = "cabanas/c1:fotos.3"  → cabanas/cabana1
 * ref = "espacios_comunes/piscina:fotos.+" → Espacios
 * ref = "config/sitio:heroUrl" → sitio
 */
function carpetaSegunDestino(ref) {
  const r = String(ref || '');
  if (r.indexOf('cabanas/') === 0) {
    // El id del documento ('c1') es la clave del mapa de nucleo.js.
    const id = r.slice('cabanas/'.length).split(':')[0];
    return CV2.carpetaDe(id);
  }
  if (r.indexOf('espacios_comunes/') === 0) return CV2.carpetaDe('espacios');
  return CV2.carpetaDe('sitio');
}

async function subirNueva() {
  const url = await CV2.elegirYSubirImagen({
    titulo: 'Foto para ' + (album.nombre || 'el sitio'),
    carpeta: album.carpeta
  });
  if (!url || !album) return;
  const arr = leerAlbum();
  arr.push(url);
  nube.clear();          // el listado de Cloudinary quedó viejo
  quitada = null;
  aplicarAlbum(arr);
  solapa('album');
  CV2.toast('Foto subida y agregada al álbum', 'success');
}

// ── Guardar ──────────────────────────────────────────────────
$('btnGuardar').addEventListener('click', guardar);

async function guardar() {
  if (!pendientes.size) return;
  const btn = $('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  // Se agrupa por documento: un solo escrito por documento, aunque se
  // hayan tocado ocho campos suyos.
  const porDoc = new Map();
  // ⚠ Claves de texto con punto: updateDoc lee cada punto del camino como
  // un nivel de anidamiento, así que 'textos.es.casa.r.ruido' se guardaría
  // como textos→es→casa→r→ruido mientras el sitio lee la clave LITERAL
  // 'casa.r.ruido'. Se guarda bien, no da error, dice "✓ Sitio actualizado"
  // y el sitio nunca lo muestra. Antes de la T11.46 ninguna clave tenía
  // puntos y esto no podía pasar; ahora que hay claves compuestas, tiene
  // que fallar RUIDOSAMENTE en vez de fallar en silencio.
  const conPunto = [];
  pendientes.forEach((valor, clave) => {
    const i = clave.indexOf(':');
    const ruta = clave.slice(0, i);        // config/sitio · cabanas/c1
    const campo = clave.slice(i + 1);      // textos.es.titulo · fotos
    // 'ocultos' es un array suelto del documento, no un texto: no lleva
    // la comprobación de los tres trozos ni se borra al quedar vacío
    // (una lista vacía significa "no hay nada oculto", que es un dato).
    if (ruta === 'config/sitio' && campo.indexOf('textos.') === 0) {
      // 'textos' + idioma + clave = tres trozos y ni uno más.
      const trozos = campo.split('.');
      if (trozos.length !== 3) { conPunto.push(trozos.slice(2).join('.')); return; }
    }
    if (!porDoc.has(ruta)) porDoc.set(ruta, {});
    // Un texto vaciado del todo NO se guarda como cadena vacía: se
    // BORRA el campo, y así el sitio vuelve a mostrar el texto por
    // defecto del diccionario. Guardar '' dejaría un hueco en blanco
    // para siempre, que es lo contrario de lo que quiere alguien que
    // borra un texto. Ojo: merge no borra claves ausentes, hace falta
    // deleteField() explícito.
    const esTextoSitio = ruta === 'config/sitio' && campo.indexOf('textos.') === 0;
    // Último filtro antes de Firestore: cualquier array se reconstruye con
    // el Array de ESTA ventana. Un array llegado del iframe se rechaza con
    // 'invalid-argument' y el mensaje no dice qué campo fue, así que el
    // rato que cuesta encontrarlo no compensa ahorrarse esta línea.
    const limpio = Array.isArray(valor) ? Array.from(valor) : valor;
    porDoc.get(ruta)[campo] = (limpio === '' && esTextoSitio) ? deleteField() : limpio;
  });

  if (conPunto.length) {
    btn.textContent = 'Guardar';
    btn.disabled = false;
    CV2.toast('No se guardó: la clave "' + conPunto[0] + '" lleva un punto y '
      + 'Firestore la guardaría en otro lado. Hay que renombrarla con guión bajo '
      + 'en el HTML y en textos-sitio.js.', 'error');
    return;
  }

  const fallidos = [];
  for (const [ruta, campos] of porDoc) {
    const partes = ruta.split('/');
    const ref = doc(db, partes[0], partes[1]);
    try {
      // updateDoc y no setDoc con merge: updateDoc entiende los campos
      // con puntos ('textos.es.titulo') como camino dentro del objeto,
      // que es justo lo que hace falta para no pisar los otros idiomas.
      await updateDoc(ref, campos);
    } catch (e) {
      if (e.code === 'not-found') {
        // config/sitio puede no existir todavía la primera vez.
        try {
          await setDoc(ref, anidar(campos), { merge: true });
        } catch (e2) { fallidos.push(ruta + ': ' + (e2.code || e2.message)); }
      } else {
        fallidos.push(ruta + ': ' + (e.code || e.message));
      }
    }
  }

  btn.textContent = 'Guardar';

  if (fallidos.length) {
    CV2.toast('No se guardó todo: ' + fallidos.join(' · '), 'error');
    btn.disabled = false;
    return;
  }

  pendientes.clear();
  origenes.clear();
  // Se recarga del servidor en vez de dar por bueno lo que está en
  // pantalla: si algo se guardó distinto de lo que se creía, se ve
  // ahora y no dentro de tres semanas.
  const w = ventana();
  if (w && w.CVSITIO) await w.CVSITIO.recargar();
  CV2.toast('✓ Sitio actualizado', 'success');
  contar();
}

/** { 'textos.es.titulo': v } → { textos: { es: { titulo: v } } } */
function anidar(campos) {
  const salida = {};
  Object.keys(campos).forEach((camino) => {
    const trozos = camino.split('.');
    let n = salida;
    for (let i = 0; i < trozos.length - 1; i++) {
      if (!n[trozos[i]]) n[trozos[i]] = {};
      n = n[trozos[i]];
    }
    n[trozos[trozos.length - 1]] = campos[camino];
  });
  return salida;
}

// ── Preguntar sin depender del navegador ─────────────────────
// Ver el comentario del CSS de #confirmar: confirm() se puede apagar desde
// Chrome y desde entonces devuelve 'no' en silencio. Con confirm(), estos
// dos botones quedaban muertos sin explicar nada.
function preguntar(texto) {
  return new Promise((resolver) => {
    const capa = $('confirmar');
    $('conf-txt').textContent = texto;
    capa.classList.remove('hide');
    let resuelto = false;
    const terminar = (r) => {
      if (resuelto) return;
      resuelto = true;
      capa.classList.add('hide');
      $('conf-si').onclick = null;
      $('conf-no').onclick = null;
      resolver(r);
    };
    // Entra en la pila del botón Atrás: Atrás cancela, como en el resto
    // del panel.
    const cerrarCapa = CV2.capaAtras(() => terminar(false));
    $('conf-si').onclick = () => { terminar(true); cerrarCapa(); };
    $('conf-no').onclick = () => { cerrarCapa(); };
  });
}

// ── Descartar ────────────────────────────────────────────────
$('btnTirar').addEventListener('click', async () => {
  if (!pendientes.size) return;
  if (!(await preguntar('¿Descartar los ' + pendientes.size + ' cambios sin guardar?'))) return;
  pendientes.clear();
  origenes.clear();
  const w = ventana();
  if (w && w.CVSITIO) await w.CVSITIO.recargar();
  contar();
});

// ── Salir ────────────────────────────────────────────────────
$('btnVolver').addEventListener('click', async () => {
  if (pendientes.size
    && !(await preguntar('Hay ' + pendientes.size + ' cambio(s) sin guardar. ¿Salir igual?'))) return;
  location.href = './index.html';
});

// Último aviso si se cierra la pestaña o se va con el gesto de Android.
window.addEventListener('beforeunload', (ev) => {
  if (!pendientes.size) return;
  ev.preventDefault();
  ev.returnValue = '';
});

marcarLangs();
contar();
</script>
