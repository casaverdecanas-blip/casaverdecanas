<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Casa Verde Canas</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --papel:#faf4e6; --selva:#225b38; --terracota:#b86d4c; --tinta:#2b3327; --gris:#6f7a68; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--papel); color:var(--tinta); font-family:Figtree,system-ui,sans-serif; }
  .caja { max-width:440px; text-align:center; }
  h1 { font-family:Fraunces,Georgia,serif; font-weight:600; color:var(--selva);
       font-size:1.7rem; margin:0 0 10px; }
  p { color:var(--gris); line-height:1.6; margin:0 0 22px; }
  a.btn { display:inline-block; background:var(--terracota); color:#fff; text-decoration:none;
          padding:11px 22px; border-radius:999px; font-weight:600; }
  small { display:block; margin-top:18px; color:var(--gris); font-size:.8rem; }
</style>
</head>
<body>
<div class="caja">
  <h1>Esa página se mudó</h1>
  <p id="msj">Renovamos el sitio y esta dirección ya no existe. Te llevamos a la portada.</p>
  <a class="btn" href="/">Ir a la portada</a>
  <small>Casa Verde Canas · Canasvieiras, Florianópolis</small>
</div>

<script>
// GitHub Pages no puede hacer redirecciones 301 del lado del servidor: se
// resuelven acá. Cada ruta del sitio viejo que ya no exista va en este mapa,
// para no perder las visitas ni los enlaces que están publicados afuera.
(function () {
  var MAPA = {
    '/index.html': '/',
    '/admin.html': '/interno/',
    '/interno/index.html': '/interno/'
  };
  var ruta = location.pathname.replace(/\/+$/, '') || '/';
  var destino = MAPA[ruta] || MAPA[location.pathname];

  // cabana.html?id=xxx → la portada abre la ficha de esa cabaña
  if (!destino && /cabana\.html$/i.test(location.pathname)) {
    var id = new URLSearchParams(location.search).get('id');
    destino = id ? '/?cabana=' + encodeURIComponent(id) : '/';
  }

  if (destino) {
    document.getElementById('msj').textContent = 'Te estamos llevando al lugar nuevo…';
    location.replace(destino);
  }
})();
</script>
</body>
</html>
